name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'index.html'
      - '.lycheeignore'
      - 'scripts/baselines/lychee_external.toml'
      - 'scripts/check_docsify_links.py'
      - 'scripts/repo_files.py'
      - 'scripts/baselines/docsify_links.json'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'index.html'
      - '.lycheeignore'
      - 'scripts/baselines/lychee_external.toml'
      - 'scripts/check_docsify_links.py'
      - 'scripts/repo_files.py'
      - 'scripts/baselines/docsify_links.json'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC: full external scan
  workflow_dispatch:

# Least privilege: these jobs only read the checkout (lychee uses the token for
# GitHub API rate limits only). Declared here so it does not depend on the repo setting.
permissions:
  contents: read

jobs:
  internal:
    name: Internal links and anchors (docsify routing)
    # Blocking. Resolves every in-repo link and #anchor the way the published docsify site
    # does (relativePath: false, docsify heading slugs), which lychee cannot: it resolves
    # links relative to the linking file with GitHub slugs. Pre-existing breakage is held in
    # scripts/baselines/docsify_links.json; a new broken link or anchor fails the build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check internal links and anchors
        run: python scripts/check_docsify_links.py

  external:
    name: External links (lychee)
    # Pull requests and pushes: BLOCKING on the http(s) links the change adds (the added
    # lines of the diff), so a dead, expired or hijackable outbound link cannot be merged.
    # Links that were already on a page are not re-litigated on every unrelated edit.
    # Monday schedule / manual run: the full scan of every page, reported in the run's job
    # summary and the uploaded report. It does not fail yet: the 2026-10-13 sweep fixed or
    # baselined every failure outside the open content PRs' pages, but those pages still carry
    # failures; flip `fail=false` below to true once a full run is clean.
    # Known links that only fail for an automated client (bot challenges, runner IP blocks)
    # are baselined in scripts/baselines/lychee_external.toml, which only ever shrinks.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Collect the links to check
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p lychee
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              RANGE="$BASE_SHA...HEAD"
            elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              RANGE="$BEFORE..HEAD"
            else
              RANGE="HEAD~1..HEAD"
            fi
            # Added lines only (no context), Markdown only; lychee extracts the URLs.
            git diff --no-color -U0 "$RANGE" -- '*.md' | grep -E '^\+[^+]' | cut -c2- > lychee/added-lines.md || true
            echo "links=$(grep -cE 'https?://' lychee/added-lines.md || true)" >> "$GITHUB_OUTPUT"
            echo "input=lychee/added-lines.md" >> "$GITHUB_OUTPUT"
            echo "fail=true" >> "$GITHUB_OUTPUT"
          else
            echo "links=all" >> "$GITHUB_OUTPUT"
            echo "input=./**/*.md" >> "$GITHUB_OUTPUT"
            echo "fail=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lychee
        if: steps.inputs.outputs.links != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # http(s) only: in-repo links are the internal job's. Exclusions live in .lycheeignore
          # (read automatically from the working directory) and, for the per-URL baseline of
          # links that fail only for automated clients, in the --config file. --root-dir lets lychee turn a
          # root-absolute page link ("/X.md", the form docsify needs) into a file:// URI that
          # the scheme filter then skips; without it every such link is an input error.
          args: >-
            --no-progress
            --config scripts/baselines/lychee_external.toml
            --root-dir '${{ github.workspace }}'
            --scheme https --scheme http
            --timeout 20
            --max-retries 3
            --accept '200..=299, 429'
            '${{ steps.inputs.outputs.input }}'
          fail: ${{ steps.inputs.outputs.fail }}
          failIfEmpty: false
          jobSummary: true
          format: markdown
          output: lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No new external links in this change
        if: steps.inputs.outputs.links == '0'
        run: echo "The change adds no http(s) links to Markdown; nothing to check."

      - name: Upload link check report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.inputs.outputs.links != '0'
        with:
          name: link-check-report
          path: lychee/out.md
          retention-days: 30
