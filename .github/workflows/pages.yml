name: Deploy site

# Builds the Pages artifact (every tracked file, plus the search index) and deploys it.
#
#   push to main         build, then deploy when the Pages source is "GitHub Actions"
#   workflow_dispatch    the same; dry_run: true builds and uploads the artifact only
#   pull_request         build only, when anything the build reads changes: the site shell,
#                        the index builder, this file, any page (.md) or the ATT&CK data the
#                        ID map reads; nothing is deployed
#
# The search index (pagefind/ and ids.json, from scripts/build_search_index.py) exists only
# in the artifact and is never committed. While the Pages source is still "Deploy from a
# branch" (build_type legacy), the deploy job is skipped and the branch build keeps serving.
#
# This replaces pages-deploy.yml. Its runs never finished: a run from 2026-09-25 sat in
# "waiting" on the github-pages environment and held the workflow-wide concurrency group
# "pages" (cancel-in-progress: false), so every later run queued behind it as "pending" with
# no jobs, and each new push cancelled the previous pending run. Here only the deploy job
# joins the "pages" group; builds of pull requests and other refs never queue behind a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build_search_index.py'
      - 'scripts/requirements-search.txt'
      - 'scripts/repo_files.py'
      - '.github/workflows/pages.yml'
      # The builder fails on content too: a required ID missing, one ID on two pages, an
      # unreadable page. Build every page and data change before it reaches main.
      - '**.md'
      - 'mitre/**'
      - 'data/attack/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload the artifact without deploying'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build site and search index
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      build_type: ${{ steps.source.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Pagefind (pinned, hash-checked)
        run: python -m pip install --no-deps --require-hashes -r scripts/requirements-search.txt

      - name: Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "build_type=$bt" >> "$GITHUB_OUTPUT"
          echo "Pages source build_type: $bt"

      - name: Configure Pages
        if: steps.source.outputs.build_type == 'workflow'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The artifact is the tracked tree, the same files the branch build serves, without
      # .github/. git archive leaves out anything untracked in the checkout.
      - name: Stage the site
        run: |
          mkdir _site
          git archive --format=tar HEAD | tar -x -C _site
          rm -rf _site/.github

      - name: Build the search index
        run: python -I scripts/build_search_index.py --site _site

      - name: Check the artifact
        run: |
          test -f _site/index.html
          test -f _site/ids.json
          test -f _site/pagefind/pagefind.js
          test -f _site/pagefind/pagefind-entry.json
          test -d _site/pagefind/index
          test -d _site/pagefind/fragment
          {
            echo "### Pages artifact"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Files | $(find _site -type f | wc -l) |"
            echo "| Size | $(du -sh _site | cut -f1) |"
            echo "| pagefind/ | $(du -sh _site/pagefind | cut -f1), $(find _site/pagefind -type f | wc -l) files |"
            echo "| Index chunks | $(find _site/pagefind/index -type f | wc -l) |"
            echo "| Fragments (one per page) | $(find _site/pagefind/fragment -type f | wc -l) |"
            echo "| ids.json | $(stat -c %s _site/ids.json) bytes |"
            echo "| Pages source | ${{ steps.source.outputs.build_type }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.build_type == 'workflow' &&
      !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
