name: Validate Data Files

on:
  # No paths filter: the drift, encoding and revoked-ID gates below cover generated trees
  # (mitre/, techniques/, detections/, scores/) and every hand-written page, so any change
  # can break one of them. The whole workflow runs in about a minute.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job only reads the checkout. Declared here so it does not
# depend on the repository's default GITHUB_TOKEN setting.
permissions:
  contents: read

jobs:
  validate-jsonl:
    name: Validate JSONL edge tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Validate JSONL files
        run: python scripts/validate_jsonl.py

      # Rebuilds the ATT&CK core (Enterprise, ICS, Mobile) and superseded_by.jsonl in
      # memory from the commit-pinned v19.2 STIX bundles and fails on any drift. It fetches
      # the three public bundles (about 64 MB) from raw.githubusercontent.com at the pinned
      # commit and aborts unless each one matches its SHA-256 in build_attack_core.py.
      - name: ATT&CK core matches the pinned v19.2 STIX (Enterprise, ICS, Mobile)
        run: python scripts/build_attack_core.py --check

      - name: Check CAPEC edge integrity (profiles vs capec.jsonl)
        run: python scripts/backfill_capec_edges.py --check

      - name: Check CTID edge tables (control/vendor -> technique) match their sources
        run: python scripts/build_ctid_edges.py --check

  corpus-signal:
    name: Corpus-signal round-trip (data file == pages, exactly 21)
    # The "Team Star Wolf corpus signal" paragraph on 21 technique pages comes from the
    # uncommitted training corpus and exists in-repo only as
    # data/generated/corpus_signal.jsonl. Fail if the data file and the committed pages
    # disagree, or if the count drifts from 21 (a regeneration that dropped the
    # paragraphs, or an edit that added one without a data row, both fail here).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Corpus signal preserved for exactly 21 techniques
        run: python scripts/generate_mitre_pages.py --verify-corpus 21

  pages-drift:
    name: Generated page trees match the data (mitre/, techniques/, detections/strategies/)
    # Each generator renders into a temporary directory (nothing is written in the checkout)
    # and fails on any committed page that differs from the data, is missing, or is an orphan
    # the data no longer produces. scores/ is diffed by compute_coverage.py --check in the
    # validate-navigator job; the priority-gap page by build_priority_gaps.py --check below.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: mitre/ (every section) matches the data
        run: python scripts/generate_mitre_pages.py --only all --check

      - name: techniques/ and detections/strategies/ match the data
        run: python scripts/generate_technique_detail_pages.py --check

  repo-hygiene:
    name: Tracked junk, text encoding, revoked ATT&CK IDs, voice in hand-written pages, theme contrast
    # junk: nothing build/editor/OS-generated is tracked (all of it would be published).
    # contrast: every text/background pair the site theme uses (index.html --tsw-* tokens,
    #   dark and light) meets WCAG AA: 4.5:1 for text, 3:1 for focus rings and accent rules.
    # encoding: every tracked text file is valid UTF-8 with no U+FFFD and no double-encoded
    #   UTF-8 (the mojibake class PR-15 cleaned up).
    # revoked: hand-written pages may not cite a revoked/deprecated ATT&CK ID (per
    #   data/attack/superseded_by.jsonl) more often than scripts/baselines/revoked_ids.json
    #   records; the baseline holds the pre-existing citations and may only shrink.
    # voice: hand-written pages follow docs/VOICE.md (no em-dashes, emoji, sentence-ending
    #   exclamation marks, marketing words or hand-typed headline counts) beyond what
    #   scripts/baselines/voice.json records. That baseline only shrinks: --update-baseline
    #   refuses a rise, and on a pull request the step below also fails when any rule's
    #   baselined total is higher than on the base branch.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: No tracked junk
        run: python scripts/check_repo_hygiene.py --only junk

      - name: Valid UTF-8, no mojibake
        run: python scripts/check_repo_hygiene.py --only encoding

      - name: No new revoked/deprecated ATT&CK IDs in hand-written pages
        run: python scripts/check_repo_hygiene.py --only revoked --report

      - name: Site theme colours meet WCAG AA in both themes (index.html tokens)
        run: python scripts/check_contrast.py

      # The sidebars, navbar, domain hubs, breadcrumbs, homepage domain cards and docsify
      # aliases are written by build_site_nav.py from docs/site_nav.json. Fails when any
      # of them is stale, when a root reference is in no hub or in two, or when a
      # hand-written page is in no nav section.
      - name: Site navigation matches docs/site_nav.json; every hand-written page is in a nav section
        run: python scripts/build_site_nav.py --check

      - name: Explore page and assets/explore.json match data/
        run: python scripts/build_explore.py --check

      # The cross-links between the hand-written and generated pages are written into the
      # Markdown by build_crosslinks.py from docs/crosslinks.json and the pages' own links:
      # each learning path's matching reference, the "Related pages" footer on each root
      # reference, the "(local)" links after MITRE IDs in the three framework atlases, and
      # the "Library references" block on each mitre/ page that hand-written pages cite.
      # Fails when any committed block differs from what the script writes.
      - name: Cross-link blocks match the pages and docs/crosslinks.json
        run: python scripts/build_crosslinks.py --check

      - name: No new voice-guide violations in hand-written pages (docs/VOICE.md)
        # On a pull request, fetch only the base branch tip (no credentials needed for a
        # public repository) so the baseline can be compared with it.
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "refs/heads/${GITHUB_BASE_REF}"
            python scripts/check_voice.py --base FETCH_HEAD
          else
            python scripts/check_voice.py
          fi

  doc-meta:
    name: Header cards match data/doc_meta.yaml; every takeaway quotes its page
    # The header card at the top of each root reference and learning path, the folds and the
    # "Which page should I read?" tables are written by build_doc_meta.py from
    # data/doc_meta.yaml; it fails on any difference, on a reference or path with no entry,
    # and on a draft or reviewed takeaway whose quote is no longer in its section. "Due for
    # review" compares a page's last recorded review with the date its text last changed,
    # which needs the full git history, so this job checks out with fetch-depth: 0.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Planted cases (YAML reader, folds, card placement, due rule, voice rules)
        run: python scripts/build_doc_meta.py --self-test

      - name: Header cards and folds match data/doc_meta.yaml; takeaways quote their sections
        run: python scripts/build_doc_meta.py --check

  validate-navigator:
    name: Validate ATT&CK Navigator layers
    # Every layer under navigator/ (not just one): JSON shape, domain, versions.attack == 19 for
    # the ATT&CK domains, every techniqueID LIVE (present and not revoked/deprecated) in its
    # domain's profile file, every tactic a v19.2 tactic of that technique, no orphan layers,
    # stage names vs SECURITY_PIPELINE.md. ATLAS/F3 layers are checked against their own data.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Validate every Navigator layer against the v19.2 data
        run: python scripts/validate_navigator.py

      - name: Full-stack layer, curated-layer normalization and navigator/index.md match the data
        run: python scripts/build_navigator_layers.py --check

      - name: scores/ (coverage scores + rendered coverage_gaps.md) match the data
        run: python scripts/compute_coverage.py --check

  stats-drift:
    name: Headline-number drift guard
    # Audit Wave 0: headline numbers compute from data, never hand-typed. Regenerate
    # stats.json and the README and HOME "What's inside" blocks from source data, fail if
    # any committed copy is stale, and fail if any human-facing doc states a number that
    # diverges from the computed value. The homepage guide cards are checked the same way.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Regenerate stats.json and the README and HOME counts from data
        run: python scripts/build_stats.py

      - name: Fail if committed stats.json or the README or HOME counts are stale
        run: git diff --exit-code -- data/generated/stats.json README.md HOME.md

      - name: Homepage guide cards match each guide's Time and Difficulty table
        run: python scripts/build_home_guides.py --check

      - name: Headline-number drift check (docs vs data)
        run: python scripts/build_stats.py --check

      - name: Regenerate data/MANIFEST.json
        run: python scripts/build_manifest.py

      - name: Fail if committed MANIFEST.json is stale
        run: git diff --exit-code -- data/MANIFEST.json

      - name: Manifest provenance/integrity check
        run: python scripts/build_manifest.py --check

      - name: Regenerate technique control rollup
        run: python scripts/build_control_rollup.py

      - name: Fail if committed technique_profiles.jsonl is stale
        run: git diff --exit-code -- data/attack/technique_profiles.jsonl

      - name: Control-rollup consistency check
        run: python scripts/build_control_rollup.py --check

      - name: Priority-gap page + analytics Navigator layers match the data
        run: python scripts/build_priority_gaps.py --check
