name: Validate Data Files

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'navigator/**'
      - 'scripts/**'
      - 'README.md'
      - 'HOME.md'
      - 'INDEX.md'
      - 'CITATION.cff'
      - 'scores/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'navigator/**'
      - 'scripts/**'
      - 'README.md'
      - 'HOME.md'
      - 'INDEX.md'
      - 'CITATION.cff'
      - 'scores/**'
  workflow_dispatch:

jobs:
  validate-jsonl:
    name: Validate JSONL edge tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSONL files
        run: python scripts/validate_jsonl.py

      - name: Check CAPEC edge integrity (profiles vs capec.jsonl)
        run: python scripts/backfill_capec_edges.py --check

  validate-navigator:
    name: Validate ATT&CK Navigator layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Navigator layer JSON
        run: |
          python -c "
          import json, sys
          with open('navigator/teamstarwolf_vendor_coverage.json') as f:
              layer = json.load(f)
          required = ['name', 'versions', 'domain', 'techniques', 'gradient']
          missing = [k for k in required if k not in layer]
          if missing:
              print(f'ERROR: Missing required fields: {missing}')
              sys.exit(1)
          technique_count = len(layer['techniques'])
          print(f'OK: Navigator layer valid — {technique_count} techniques')
          scores = [t['score'] for t in layer['techniques'] if 'score' in t]
          print(f'OK: Score range {min(scores)}–{max(scores)}')
          "

  stats-drift:
    name: Headline-number drift guard
    # Audit Wave 0: headline numbers compute from data, never hand-typed. Regenerate
    # stats.json from source data, fail if the committed copy is stale, and fail if any
    # human-facing doc states a number that diverges from the computed value.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate stats.json from data
        run: python scripts/build_stats.py

      - name: Fail if committed stats.json is stale
        run: git diff --exit-code -- data/generated/stats.json

      - name: Headline-number drift check (docs vs data)
        run: python scripts/build_stats.py --check

      - name: Regenerate data/MANIFEST.json
        run: python scripts/build_manifest.py

      - name: Fail if committed MANIFEST.json is stale
        run: git diff --exit-code -- data/MANIFEST.json

      - name: Manifest provenance/integrity check
        run: python scripts/build_manifest.py --check

      - name: Regenerate technique control rollup
        run: python scripts/build_control_rollup.py

      - name: Fail if committed technique_profiles.jsonl is stale
        run: git diff --exit-code -- data/attack/technique_profiles.jsonl

      - name: Control-rollup consistency check
        run: python scripts/build_control_rollup.py --check
