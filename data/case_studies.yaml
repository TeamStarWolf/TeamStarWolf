# The case study timeline: one entry per study in case-studies/ (every .md file there
# except README.md and the generated TIMELINE.md), keyed by the study's repository path.
#
# scripts/build_case_study_timeline.py reads this file and writes assets/case-studies.json
# (read by the timeline on the site) and case-studies/TIMELINE.md (the timeline page and its
# plain list). Edit here, run python scripts/build_case_study_timeline.py, and commit the
# two files it rewrites; the --check run in CI fails when they are stale, when a study has
# no entry here or an entry names no study, and on any field below that breaks its rule.
# Every value is JSON on one line, so any YAML reader and the script's own reader see the
# same data. A new study adds its entry in the pull request that adds the study.
#
# Per study:
#   kind         vulnerability  one flaw or exploit chain at the centre
#                incident       one organization's or one product's compromise
#                campaign       one operation or exploitation wave across many victims
#                actor          a threat actor's public record
#                era            a period of time across many actors and events
#                reference      an attack surface or technology studied across many incidents
#   title        the study's H1, exactly
#   start, end   the study's period, as its row in case-studies/README.md gives it: "YYYY",
#                "YYYY-MM" or "YYYY-MM-DD"; end is null while the subject is ongoing
#   core_start, core_end
#                optional: the core period the README names ("core: November to December
#                2021"); the study is placed under the year its core starts
#   sectors      from the sectors list below: the sectors the study's victims or subject
#                belong to; "technology" covers software, cloud and internet services and the
#                vendors that build them; "cross-sector" means victims across many sectors
#   cves         every CVE id the study names (the check fails on one it does not name)
#   actors       the ATT&CK group ids the study binds: the groups it links to their library
#                page as actors in its record, or the bound groups it lists itself; never a
#                group it says is not bound or not involved, nor one it names only for
#                comparison or overlap. Each must be in data/attack/group_profiles.jsonl
#                with a page in mitre/groups/
#   tags         a few words a reader might search for
#   pdf, pptx    the export file names in case-studies/pdf/ and case-studies/slides/, when
#                they exist; every export in those folders must belong to an entry
#   events       at most 12 dated key events, oldest first, each taken from the study's own
#                timeline or record table (never added from outside it):
#                {"date": "YYYY[-MM[-DD]]", "label": "..."}, the label one line of at most
#                160 characters. Where the study gives a range, the date is its first day and
#                the label names the range.
#
# Provenance: the entries for the studies on main on 2026-11-11 were written from each
# study's H1, its README row (period and downloads), its CVE ids, the ATT&CK groups it binds
# and the rows of its timeline, operational record or Part 1 table.

sectors: ["healthcare", "finance", "government", "energy", "manufacturing", "technology", "telecommunications", "education", "retail", "defense", "transport", "media", "cross-sector"]

