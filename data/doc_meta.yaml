clusters:
  active-directory:
    topic: "Active Directory attack and defense"
    pages:
      ACTIVE_DIRECTORY_ATTACKS.md: "the offensive playbook for penetration testers and red teamers: each major attack with tool commands, ATT&CK mappings, detection event IDs, and defenses."
      ACTIVE_DIRECTORY_ATTACK_REFERENCE.md: "the same attacks from the defender's side: what each looks like on the wire, the telemetry it generates, and how to detect and prevent it."
      ACTIVE_DIRECTORY_SECURITY_REFERENCE.md: "the defensive companion: detection guidance, hardening controls, and response playbooks, including domain controller, Group Policy, and AD CS security."
  windows-hardening:
    topic: "Windows hardening"
    pages:
      WINDOWS_HARDENING.md: "hands-on apply-and-verify commands for each control, built from CIS Benchmarks, Microsoft baselines, and DISA STIGs."
      WINDOWS_HARDENING_GPO.md: "Group Policy baselines: disabling dangerous services, credential and network hardening, and the attacks GPO misconfigurations enable."
      WINDOWS_HARDENING_REFERENCE.md: "from security architecture foundations to monitoring: Credential Guard, LAPS, Sysmon, and Windows Event Forwarding."
  grc:
    topic: "governance, risk, and compliance"
    pages:
      FRAMEWORKS.md: "a quick reference to each major framework: who publishes it, whether it is mandatory, who it applies to, and its structure."
      GRC_COMPLIANCE_REFERENCE.md: "frameworks in depth, with compliance automation tooling such as OSCAL and ComplianceAsCode."
      GRC_REFERENCE.md: "running the program: governance structure, risk quantification, compliance programs, third-party risk, and audits."
  identity:
    topic: "identity security"
    pages:
      IDENTITY_ACCESS_MANAGEMENT_REFERENCE.md: "controls and architecture: authentication technologies, authorization models, PAM, IGA, and compliance mapping."
      IDENTITY_SECURITY_REFERENCE.md: "attacks and vendor controls: MFA bypass, Entra ID, Okta, CyberArk, and identity detection and response."
  web-application:
    topic: "web application security"
    pages:
      WEB_APPLICATION_PENTESTING.md: "the test playbook: recon to reporting, with working commands and payloads for each bug class."
      WEB_APPLICATION_SECURITY_REFERENCE.md: "the OWASP Top 10 with injection, client-side, and authentication deep dives, covering both payloads and fixes."
  penetration-testing:
    topic: "running a penetration test"
    pages:
      PENETRATION_TESTING_METHODOLOGY.md: "the end-to-end engagement playbook: legal paperwork, recon, exploitation, post-exploitation, and reporting."
      PENTEST_CHECKLISTS.md: "task checklists for each phase, from pre-engagement through external, internal, Active Directory, web, cloud, and reporting."
  deception:
    topic: "deception and adversary engagement"
    pages:
      DECEPTION_TECHNOLOGY_REFERENCE.md: "deception program strategy and detection engineering: honeytokens, decoy placement, alert pipelines, and metrics."
      HONEYPOT_DECEPTION_REFERENCE.md: "hands-on install, configuration, and SIEM integration for honeypot and honeytoken tools such as OpenCanary, Canarytokens, and T-Pot."
      ENGAGE_REFERENCE.md: "the MITRE Engage framework for planning adversary engagement, mapped to ATT&CK techniques."
  network-protocols:
    topic: "network protocols"
    pages:
      NETWORK_PROTOCOLS_REFERENCE.md: "the engineering view: protocol internals, hardening configurations, and packet-analysis tooling."
      NETWORK_PROTOCOLS_SECURITY.md: "the attacker view: how each protocol is exploited, with ATT&CK IDs, detection, and defenses."
  cloud:
    topic: "cloud security"
    pages:
      CLOUD_ARCHITECTURE_REFERENCE.md: "designing cloud systems: landing zones, hub-and-spoke networking, and architecture decisions with their trade-offs."
      CLOUD_SECURITY_REFERENCE.md: "controls and their configuration across AWS, Azure, and GCP, plus privilege-escalation paths and cloud attack tools."
      CLOUD_ATTACK_REFERENCE.md: "attacker techniques per cloud and for Kubernetes, aligned to ATT&CK, for building detections and running incident response."
      CLOUD_SECURITY_BENCHMARK.md: "CIS Benchmark hardening checks with fix commands, audit scripts, and CSPM tools."
      CLOUD_NETWORK_SECURITY.md: "network controls across the three clouds: VPC design, firewalls, WAF, private connectivity, DDoS protection, and flow logs."
  architecture:
    topic: "architecture"
    pages:
      ARCHITECTURE_REFERENCE.md: "general enterprise and solution architecture: domains, frameworks, decision records, and patterns, each read as an attack-surface decision."
      SECURITY_ARCHITECTURE_REFERENCE.md: "security architecture itself: SABSA, TOGAF, defense in depth, Zero Trust, and architecture reviews."
  tool-indexes:
    topic: "finding a tool"
    pages:
      TOOLS.md: "a matrix of tools by function, each marked open source or commercial."
      OPEN_SOURCE_TOOLKIT.md: "free and open-source tools organized by discipline, with practice platforms and bookmarks."
      STARRED_REPOS.md: "the full index of starred GitHub repositories, grouped by the job they do."
      SECURITY_TOOL_DOCUMENTATION.md: "official documentation, API references, and GitHub organizations for the platforms in an enterprise security stack."
  threat-actors:
    topic: "threat actors"
    pages:
      THREAT_ACTORS.md: "a narrative quick reference to notable groups by nation and type, with aliases, targets, and signature TTPs."
      THREAT_GROUP_PROFILES.md: "profiles built from ATT&CK group data: aliases, technique and software counts, and signature techniques."
  detection-content:
    topic: "SIEM and detection content"
    pages:
      SIEM_REFERENCE.md: "SIEM platforms: architecture and sizing, and the query languages and detection workflows of Splunk, Sentinel, QRadar, and Elastic."
      SIEM_DETECTION_CONTENT.md: "where to get vendor-maintained, ready-made detection content and how to deploy it."
      DETECTION_RULES_REFERENCE.md: "writing your own rules in Sigma, YARA, Suricata, SPL, and KQL, then testing and tuning them."
  threat-hunting:
    topic: "threat hunting"
    pages:
      THREAT_HUNTING_PLAYBOOKS.md: "ready-to-run hunts, each with a hypothesis, data sources, a query, and response steps."
      THREAT_HUNTING_REFERENCE.md: "hunting fundamentals, query languages, rule authoring, and hunt tracking."
  controls:
    topic: "security controls and vendor settings"
    pages:
      CONTROLS_MAPPING.md: "the chain from security vendors to the NIST 800-53 controls they implement and the ATT&CK techniques those controls mitigate."
      ENTERPRISE_SECURITY_CONTROLS.md: "configuration, policy tuning, and detection guidance for specific enterprise platforms."
      VENDOR_PREVENTION_POLICIES.md: "recommended prevention settings from official vendor documentation and the CISA SCuBA baselines."
  network-design:
    topic: "how networks work and how to design them"
    pages:
      NETWORKING_FUNDAMENTALS.md: "how networking works, from OSI layers to routing and DNS, explained for reasoning about attacks and detections."
      NETWORKING_ARCHITECTURE_REFERENCE.md: "designing networks: topologies, overlays, segmentation, SD-WAN and SASE, and core services."
      NETWORK_SECURITY_ARCHITECTURE.md: "building a segmented enterprise network: zones, firewall and IPS placement, 802.1X, and VPNs, with configuration examples."
  network-operations:
    topic: "network attack, defense, and monitoring"
    pages:
      NETWORK_ATTACKS_REFERENCE.md: "how network attacks work layer by layer, each paired with the control that detects or blocks it."
      NETWORK_DEFENSE_REFERENCE.md: "defense architecture and NSM operations: Suricata, Zeek, Security Onion, segmentation, and DDoS defense."
      NETWORK_MONITORING_REFERENCE.md: "the monitoring stack and hunting workflows: sensor placement, Zeek, Suricata rules, JA3, and flow data."
      NETWORK_FORENSICS_REFERENCE.md: "collecting and preserving network evidence and reconstructing an incident from it."
      PACKET_ANALYSIS_REFERENCE.md: "reading raw traffic in Wireshark, tcpdump, and Zeek, and spotting attacks in packet captures."
  ai-security:
    topic: "AI security"
    pages:
      AI_SECURITY_REFERENCE.md: "securing LLM applications: the OWASP LLM Top 10, prompt injection, adversarial ML, and guardrails."
      AI_MCP_SECURITY_REFERENCE.md: "the Model Context Protocol: its threat model and hardening for MCP servers and agents."
      AI_OFFENSIVE_SECURITY_REFERENCE.md: "AI-assisted attack tooling and the defensive playbook against it."
      AI_ARCHITECTURE_REFERENCE.md: "designing ML and LLM systems end to end, with the controls that make the architecture defensible."
      AI_INFRASTRUCTURE_SECURITY_REFERENCE.md: "the infrastructure behind AI: model registries, unsafe model files, pipelines, and inference servers."
      AGENTIC_AI_ATTACK_REFERENCE.md: "an illustrative agent-swarm intrusion kill chain mapped to ATT&CK and ATLAS."
      ATLAS_REFERENCE.md: "the MITRE ATLAS matrix of techniques and mitigations for attacks on AI systems."
  forensics:
    topic: "digital forensics"
    pages:
      DIGITAL_FORENSICS_REFERENCE.md: "host, disk, and memory forensics: acquisition, Windows artifacts, and reporting."
      CLOUD_SAAS_MOBILE_FORENSICS_REFERENCE.md: "acquisition and preservation when the evidence lives in an API, a tenant, or a phone."
  vulnerability:
    topic: "vulnerability prioritization and management"
    pages:
      VULNERABILITY_PRIORITIZATION_REFERENCE.md: "the decision layer: which signal outranks which (SSVC, KEV, EPSS) and how the result becomes an SLA."
      CVE_REFERENCE.md: "the scoring mechanics: CVE records, CVSS, EPSS, and the KEV catalog, with automation code."
      VULNERABILITY_MANAGEMENT_REFERENCE.md: "operational tooling: scanners, DefectDojo, SCA and SBOM, and patching."
      CTEM_REFERENCE.md: "the program loop prioritization runs inside: scoping, discovery, prioritization, validation, and mobilization."
