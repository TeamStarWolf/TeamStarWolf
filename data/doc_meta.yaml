# Header cards for the root references, the learning paths and the hand-written pages of
# the subject folders (FOLDERS and FOLDER_FILES in scripts/build_doc_meta.py).
#
# scripts/build_doc_meta.py reads this file and writes the card at the top of each page,
# between the meta:start and meta:end markers, so GitHub and the site show the same card.
# Edit here, run python scripts/build_doc_meta.py, and commit the pages it rewrites; the
# --check run in CI fails when a page and this file disagree. Every value is JSON on one
# line, so any YAML reader and the script's own reader see the same data.
#
# Per page (keyed by repository path):
#   audience       who the page is for
#   level          Beginner, Beginner to intermediate, Intermediate, Intermediate to
#                  advanced, Advanced, or (learning paths) Beginner to advanced
#   read_when, start_at, pairs_with
#                  the page's orientation rows, as Markdown with any '|' escaped;
#                  start_at has at most 3 links (the check enforces it). On a page
#                  below the root every link names its path from the root
#                  ("/SECURE_CODING_REFERENCE.md"), because the site runs with
#                  relativePath off; the check fails on a link without the '/'
#   learning_path  the learning path docs/crosslinks.json pairs with a reference; the
#                  check fails if the two files disagree
#   corrected      the id of the page's last recorded correction (see corrections:)
#   corrected_what what that correction changed on this page, when the entry's own
#                  "what" is too general for it
#   reviewed       the id of the owner's last whole-page review (see reviews:), or null
#   fold           sections folded into <details>: "section:<anchor>" folds a section's
#                  body, "tables:<anchor>" folds each table of more than 40 rows in it
#
# corrections: pull requests from the repository history that edited the text of the
# pages naming them. They are not reviews of the whole page. The card shows them as
# "Last corrected" (or the entry's label), with what the edit changed on that page and
# the pull request; an entry with a label (the pages #68 created) shows only its date and
# pull request, "Added: 2026-09-29 (#68)". "attack" is set only on edits to ATT&CK content (IDs,
# tactic names, version pins), and only then does the card print the ATT&CK release.
#
# reviews: whole-page reviews the owner records (date, what was checked, optionally the
# ATT&CK release it was checked against and a pull request). None are recorded yet, so
# every card says "Last reviewed: No review recorded yet". To record one, add an entry
# here and set reviewed: on each page it covered. "Due for review" is computed only from
# these dates (text changed more than 90 days after the review), so a correction never
# resets the clock. If the owner prefers another basis for "Due for review", that is a
# change to due() in scripts/build_doc_meta.py.
#
# clusters: pages that overlap; each gets a "Which page should I read?" note naming the
# others, with the one-line focus given here.
#
# Provenance: read_when, start_at and pairs_with of the references that already had an
# orientation card were moved here verbatim from the pages on 2026-10-20 (six start_at
# rows were then trimmed to 3 links). Later on 2026-10-20 every read_when row was reworded
# as clauses with their subject ("You are planning ..., you need ..., or ..."),
# and the pairs_with links that showed a file name now show the page's
# title; the targets are unchanged. audience and level for every page, the orientation
# rows of the references that had none, the read_when and start_at rows of the learning
# paths, the corrected_what descriptions (each from the pull request's diff of that page)
# and the cluster notes were written on 2026-10-20; edit any of them freely.
#
# The subject-folder entries were written on 2026-11-03 from each page's own content:
# start_at names three of the page's headings, pairs_with the pages its own Related, Go
# deeper or Learn more list links (by their titles), and audience and read_when follow
# the page's opening and its sections. The orientation rows that seven of them carried
# in a hand-written table (three in ai-tooling/, three in research/ and the technique
# detection library) moved here, reworded as clauses, with file-name link text replaced
# by the page titles.

