# Key takeaways the owner has reviewed. scripts/build_doc_meta.py renders these, and only
# these, in each page's header card. Drafts wait in data/doc_takeaways.draft.yaml.
#
# Per page: reviewed: "YYYY-MM-DD" and items:, a list of 3 to 5 takeaways, each
# {"text": ..., "from": "#anchor", "quote": ...} on one line, as in the draft file.

pages:
  case-studies/UPNP_HOME_NETWORK.md:
    reviewed: "2026-11-25"
    items:
      - {"text": "The first version of the UPnP port-mapping profile has no access control, so any host on the home network can ask the router to open an inbound port.", "from": "#executive-summary", "quote": "any host on the local network can ask the router to open a port"}
      - {"text": "A 2012 study found more than 81 million addresses answering UPnP discovery, and an estimated 17 million answering the control service to the internet.", "from": "#executive-summary", "quote": "more than 81 million addresses answered UPnP discovery"}
      - {"text": "UPnProxy and EternalSilence are not a single fault: injection from the internet needs both a device that answers its controls from the internet and a protocol that checks nobody.", "from": "#part-3-using-the-router-as-infrastructure-upnproxy-and-eternalsilence", "quote": "Injection from the internet needs both"}
      - {"text": "The record sorts into three piles: bugs a patch or a replacement fixes, a design property no patch removes, and what the owner controls.", "from": "#executive-summary", "quote": "a design property that no patch removes"}
  case-studies/CASTING_HOME_NETWORK.md:
    reviewed: "2026-11-25"
    items:
      - {"text": "On the home network, casting rests on a local control service that trusts the local network, the same assumption as the UPnP port-mapping service.", "from": "#executive-summary", "quote": "the local service on the device trusts the local network"}
      - {"text": "In 2018 a web page could use DNS rebinding to reach the unauthenticated local cast API and read the Wi-Fi survey data that a geolocation service turns into the home's location.", "from": "#part-3-reading-the-unauthenticated-local-interface", "quote": "a web page open in a browser on the same network could reach it using DNS rebinding"}
      - {"text": "The 2021 account-linking issue turned data read over the LAN into a credential: the device's own identifiers were enough to link an attacker's cloud account and drive the device remotely.", "from": "#part-3-reading-the-unauthenticated-local-interface", "quote": "this information, read over the LAN, was effectively the credential"}
      - {"text": "Where a fix exists it has a version or a date, but several of these items were narrowed rather than closed or are design properties no patch removes; the real exposure is equipment that stopped getting updates.", "from": "#part-7-what-is-fixed-what-is-design-what-is-a-setting", "quote": "A device that no longer receives firmware stays where it was"}
  case-studies/ISP_GATEWAY_HOME_NETWORK.md:
    reviewed: "2026-11-25"
    items:
      - {"text": "The gateway a household's ISP supplies is a modem, router, firewall and Wi-Fi in one, and its firmware and remote management belong to the vendor and the ISP, not the subscriber.", "from": "#executive-summary", "quote": "belong to the vendor and the ISP, not the subscriber"}
      - {"text": "Because the owner does not control the device, a hardcoded account or an exposed management port can sit on it unseen, and the owner's realistic options are narrow.", "from": "#part-1-what-an-isp-supplied-gateway-is-and-who-controls-it", "quote": "the owner's realistic options are narrow"}
      - {"text": "The TR-069 management port was meant for the ISP alone; the November 2016 Mirai outage is what happened when gateways answered it to the whole internet.", "from": "#part-3-the-remote-management-channel-and-the-2016-tr-069-outage", "quote": "The management port was never meant to answer anyone but the ISP"}
      - {"text": "The owner's most effective lever is to treat the gateway as untrusted and put an owned router in front of their devices; the four 2017 CVE records applied only when the gateway was not in pass-through mode.", "from": "#part-6-what-is-fixed-what-is-design-what-is-a-setting", "quote": "put an owned router in front of the household's devices"}
  case-studies/CHANGE_HEALTHCARE_2024.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The intrusion started with stolen credentials on a Citrix remote-access portal that required no second factor, not with any software flaw.", "from": "#executive-summary", "quote": "The portal did not require a second factor"}
      - {"text": "The data loss became the largest on the federal health breach portal, affecting about 192.7 million people.", "from": "#executive-summary", "quote": "The data loss became the largest in the history of the federal health breach portal"}
      - {"text": "One clearinghouse was a national dependency: UnitedHealth puts Change at about 6 percent of all US health care payments.", "from": "#scale-of-the-dependency", "quote": "Change's payment processing is about 6 percent of all U.S. health care payments"}
      - {"text": "The outage reached care, not only billing: in an AHA survey, 74 percent of hospitals reported effects on direct patient care.", "from": "#the-providers", "quote": "74 percent reported effects on direct patient care"}
      - {"text": "Paying the $22 million ransom did not end the extortion, and the stolen data was still offered for sale weeks later.", "from": "#part-4-the-ransom-and-the-second-extortion", "quote": "one ransom paid, data still offered for sale five weeks later"}
  case-studies/SOLARWINDS_SUNBURST.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The backdoor was planted at build time, not in source: an implant on the build server swapped one file while Orion compiled, then restored it.", "from": "#executive-summary", "quote": "watched for the compiler to start, swapped one source file for a trojanized copy for the length of the build, and put the original back"}
      - {"text": "Code signing and the vendor's own update channel delivered the backdoor, so the signature proved origin, not safety.", "from": "#executive-summary", "quote": "The resulting DLL was signed by SolarWinds' own certificate and shipped through SolarWinds' own update channel"}
      - {"text": "The worst damage came after the foothold: stolen AD FS certificates and forged SAML tokens opened cloud mail and applications.", "from": "#executive-summary", "quote": "theft of AD FS token-signing certificates, forged SAML tokens and new credentials on cloud applications"}
      - {"text": "The US and UK attributed the operation to Russia's foreign intelligence service, the SVR, in April 2021.", "from": "#executive-summary", "quote": "the United States and the United Kingdom attributed the operation to Russia's Foreign Intelligence Service, the SVR"}
  case-studies/STUXNET.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Stuxnet showed an air-gapped plant can still be reached and a controller can look healthy while running an attacker's code.", "from": "#executive-summary", "quote": "a plant that is not connected to the internet can still be reached, and a controller that looks healthy on the engineering screen can be running someone else's code"}
      - {"text": "It crossed air gaps on USB drives, used four zero-days plus MS08-067, signed its drivers with stolen certificates, and rewrote PLC logic.", "from": "#executive-summary", "quote": "It crossed air gaps on USB drives, used four zero-day exploits (two to spread, two to raise its privileges) plus the older MS08-067 bug, signed its drivers with compromised code-signing certificates, and rewrote the logic on a narrowly defined set of PLCs that drive frequency converters"}
      - {"text": "The IAEA recorded changes to the Natanz centrifuge cascades in 2009 and 2010 but never named a cause.", "from": "#executive-summary", "quote": "The IAEA's reports document what happened to the centrifuge cascades at Natanz in 2009 and 2010, but never name a cause"}
      - {"text": "Attribution stays unofficial: no government has acknowledged building Stuxnet in any source the study opened.", "from": "#executive-summary", "quote": "No government has acknowledged building Stuxnet in any source this study opened"}
  case-studies/LOG4SHELL.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "A 2013 logging feature let any string in a log line pull and run remote code, with no account or user interaction.", "from": "#executive-summary", "quote": "a feature added in 2013, the JNDI lookup, let anyone who could get a string into a log line make the server reach out to a directory service they controlled and load code from it"}
      - {"text": "The trigger could ride in almost any logged field, from a browser User-Agent header to a game chat message.", "from": "#executive-summary", "quote": "the string could arrive in a browser's User-Agent header, a chat message in a game, an email header, or any other field an application happened to log"}
      - {"text": "The first patch was incomplete: four more CVEs and eight releases followed within twenty days.", "from": "#executive-summary", "quote": "The first fix, 2.15.0, was incomplete, and four more CVEs and eight more releases across three Java lines followed in the next twenty days"}
      - {"text": "Finding it was the hard part: scanners keyed on file names missed shaded and bundled copies buried deep in dependencies.", "from": "#executive-summary", "quote": "scanners keyed on file names missed shaded and bundled copies"}
  case-studies/COLONIAL_DARKSIDE_2021.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Colonial Pipeline shut its own system down in response to ransomware on 7 May 2021; the FBI attributed it to DarkSide.", "from": "#executive-summary", "quote": "Colonial Pipeline shut down its system in response to ransomware"}
      - {"text": "It was a fuel-delivery outage, not attacker control of pipeline equipment, a distinction the record supports.", "from": "#executive-summary", "quote": "an interruption to a major fuel-transport service, not an attacker's direct control of pipeline equipment"}
      - {"text": "The earliest identified entry was an employee login through a legacy VPN profile without MFA.", "from": "#key-findings", "quote": "the earliest identified compromise was an employee-credential login on 29 April through a legacy VPN profile without MFA"}
      - {"text": "A successful shutdown can still cause a serious outage: safety containment and business availability are separate outcomes.", "from": "#key-findings", "quote": "Safety containment and business availability are separate outcomes"}
  case-studies/APT41_PUBLIC_RECORD.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "APT41 mixes state-aligned espionage with crime for profit, a pattern both the court record and vendor reporting show.", "from": "#executive-summary", "quote": "the group mixes state-aligned espionage with crime for profit"}
      - {"text": "Its signature is supply-chain compromise: software vendors found their own update channels shipping backdoors to customers in 2017 and 2018.", "from": "#executive-summary", "quote": "Software vendors found their own update channels shipping backdoors to customers in 2017 and 2018"}
      - {"text": "Internet-facing applications are the dominant way in, with exploitation starting within hours of a disclosure.", "from": "#executive-summary", "quote": "Internet-facing applications are the dominant way in, and exploitation starts within hours of a disclosure"}
      - {"text": "A valid code-signing certificate is not evidence a binary is safe; the group repeatedly abused stolen certificates.", "from": "#executive-summary", "quote": "A valid code-signing certificate on a binary is not evidence that the binary is safe"}
  case-studies/SANDWORM_OPERATIONS.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Sandworm is Unit 74455 of Russia's military intelligence, the GRU, by governments' own identification.", "from": "#executive-summary", "quote": "Governments call it Unit 74455 of Russia's military intelligence service, the GRU"}
      - {"text": "Between 2015 and 2022 it turned the lights off in Ukraine three times.", "from": "#executive-summary", "quote": "Between 2015 and 2022 it turned the lights off in Ukraine three times"}
      - {"text": "It released NotPetya, which the White House called the most destructive and costly cyber attack in history.", "from": "#executive-summary", "quote": "released NotPetya, which the White House called the most destructive and costly cyber attack in history"}
      - {"text": "The record is strong: a US grand jury indicted six GRU officers and charged the grid attacks, NotPetya and more.", "from": "#executive-summary", "quote": "A grand jury indictment names the officers and charges the 2015 and 2016 grid attacks, NotPetya, the PyeongChang attack and the 2019 Georgia attack"}
  case-studies/XZ_UTILS_BACKDOOR_2024.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "An attacker posing as a trusted maintainer spent over two years earning release authority, then hid a backdoor in XZ Utils 5.6.0 and 5.6.1.", "from": "#executive-summary", "quote": "An attacker operating as a trusted maintainer spent more than two years earning commit and release authority, then hid a backdoor in the release tarballs of versions 5.6.0 and 5.6.1"}
      - {"text": "The backdoor hooked SSH authentication so anyone with the attacker's key could run commands as root before authenticating.", "from": "#executive-summary", "quote": "the backdoor hooked the SSH authentication path so that anyone holding the attacker's private key could run commands as root before authenticating"}
      - {"text": "It was caught by luck, not controls: one engineer noticed SSH logins had become about half a second slower.", "from": "#executive-summary", "quote": "It was caught by one engineer who noticed that SSH logins had become about half a second slower, not by any systematic control"}
      - {"text": "The lesson: source review misses a build-time backdoor, and a project run by one volunteer is a supply-chain single point of failure.", "from": "#executive-summary", "quote": "critical infrastructure maintained by a single volunteer is a supply-chain single point of failure"}
  case-studies/NPM_SUPPLY_CHAIN_ATTACKS.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Attackers rarely need a bug: almost every incident is a legitimate publish by someone who should not have been able to publish.", "from": "#executive-summary", "quote": "almost every incident here is a legitimate publish by someone who should not have been able to publish"}
      - {"text": "Payloads mostly ran at install time via lifecycle scripts, which npm v12, pnpm and Yarn Berry now switch off by default.", "from": "#executive-summary", "quote": "the payloads mostly ran at install time through lifecycle scripts, which is the behavior npm v12, pnpm and Yarn Berry have now switched off by default for dependencies"}
      - {"text": "Most bad versions were pulled within minutes to hours, which is why release-age gates work.", "from": "#executive-summary", "quote": "most bad versions were found and pulled within minutes to hours, which is why release-age gates work"}
      - {"text": "Provenance alone is not enough: the 2026 TanStack and keyv releases carried valid provenance yet were malicious.", "from": "#executive-summary", "quote": "the 2026 TanStack releases were published through the project's own trusted-publisher binding and the keyv releases carried valid provenance signed by GitHub Actions"}
  case-studies/RANSOMWARE_ECOSYSTEM.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Between 2019 and 2026 ransomware stopped being a virus and became an industry of specialists.", "from": "#executive-summary", "quote": "ransomware stopped being a virus and became an industry between 2019 and 2026"}
      - {"text": "It runs as a market: developers rent encryptors to affiliates while separate services negotiate payments and settle disputes.", "from": "#executive-summary", "quote": "developers rented their encryptors to affiliates, and separate services negotiated payments, helped victims pay and settled disputes between criminals"}
      - {"text": "The way in is usually ordinary: MFA-less VPNs and portals, unpatched edge appliances and talked-into-it help desks.", "from": "#executive-summary", "quote": "VPNs and remote-access portals without multifactor authentication, unpatched edge appliances and talked-into-it help desks recur across the advisories"}
      - {"text": "The money is large: FinCEN counted more than $2.1 billion in reported ransomware payments for 2022 to 2024.", "from": "#executive-summary", "quote": "FinCEN counted more than $2.1 billion in reported payments for 2022 to 2024"}
  case-studies/AI_THREATS_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "AI has not created new attack types; it has made existing attacks faster and cheaper and turned AI agents into a privileged attack surface.", "from": "#executive-summary", "quote": "It has made existing attacks faster, cheaper and harder to spot, and it has turned AI agents themselves into a privileged attack surface"}
      - {"text": "The decisive shift is autonomy: agents now run most of an intrusion while people approve only a few decisions.", "from": "#executive-summary", "quote": "agents now run most of an intrusion while people approve a few decisions"}
      - {"text": "In one case a Chinese state-sponsored group had an AI coding agent do most of the tactical work against about 30 targets.", "from": "#key-findings", "quote": "A Chinese state-sponsored group had Claude Code do 80-90% of the tactical work against about 30 targets"}
      - {"text": "Deepfake fraud is the most proven AI threat: the FBI logged $893 million in AI-linked losses for 2025.", "from": "#key-findings", "quote": "The FBI logged $893 million in AI-linked losses for 2025"}
  case-studies/THREAT_ACTORS_CHINA.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The sponsors are now named specifically: US charging documents and advisories identify PLA Unit 61398, State Security bureaus and front companies.", "from": "#executive-summary", "quote": "US charging documents, Treasury designations and joint advisories name PLA Unit 61398 and the PLA 54th Research Institute"}
      - {"text": "The tradecraft moved to the network edge: every one of the 43 initial-access CVEs across five joint advisories is in CISA's KEV catalog.", "from": "#executive-summary", "quote": "every one of the 43 initial-access CVEs named across five joint advisories is in CISA's Known Exploited Vulnerabilities catalog"}
      - {"text": "Purpose widened from espionage to pre-positioning: US agencies assessed Volt Typhoon was placed to disrupt critical-infrastructure OT in a crisis.", "from": "#executive-summary", "quote": "Volt Typhoon was positioning inside US critical infrastructure IT networks to disrupt operational technology in a crisis, with some footholds held for at least five years"}
      - {"text": "Healthcare and life sciences recur throughout, from the 2014 Anthem breach to theft of COVID-19 research.", "from": "#executive-summary", "quote": "healthcare and life sciences appear throughout"}
  case-studies/THREAT_ACTORS_RUSSIA.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Governments have named the sponsors: three GRU units, the SVR, two FSB centers and a Defense Ministry research institute.", "from": "#executive-summary", "quote": "three military intelligence units of the GRU, the SVR foreign intelligence service, two centers of the FSB security service and a Ministry of Defense research institute"}
      - {"text": "Advisories map the tracked groups to units, such as GRU Unit 26165 to APT28 and GRU Unit 74455 to Sandworm.", "from": "#executive-summary", "quote": "GRU Unit 26165 to APT28, GRU Unit 74455 to Sandworm"}
      - {"text": "The way in is ordinary: every one of the 26 CVEs named across five joint advisories and an FBI notice is in CISA's KEV catalog.", "from": "#executive-summary", "quote": "Every one of the 26 CVEs named in five joint advisories and an FBI notice on these actors is in CISA's Known Exploited Vulnerabilities catalog"}
      - {"text": "The court record is deep: US grand juries indicted GRU officers in 2018, 2020, 2022, 2023 and 2024.", "from": "#executive-summary", "quote": "US grand juries indicted GRU officers in 2018 (twice) and 2020, four Russian government employees over energy-sector intrusions in 2022, an FSB officer in 2023 and five Unit 29155 officers in 2024"}
  case-studies/THREAT_ACTORS_IRAN.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Iranian state cyber activity runs through two services, the MOIS and the IRGC, and a ring of contractors.", "from": "#executive-summary", "quote": "Iranian state cyber activity runs through two services and a ring of contractors"}
      - {"text": "The way in is rarely exotic: known, already-patched flaws in VPNs, firewalls, Exchange and Log4j, password spraying and MFA fatigue.", "from": "#executive-summary", "quote": "the actors used known, already-patched flaws in VPNs, firewalls, Exchange and Log4j, password spraying and MFA push fatigue, and internet-facing controllers left on default passwords"}
      - {"text": "Almost all the named IT CVEs are known-exploited: all but one of the 20 are in CISA's KEV catalog.", "from": "#executive-summary", "quote": "all but one of the 20 IT CVEs those advisories name are in CISA's Known Exploited Vulnerabilities catalog"}
      - {"text": "The purpose widened over time, with destructive wiper attacks recurring from 2012 to 2026.", "from": "#executive-summary", "quote": "destructive wiper attacks recurring from 2012 to 2026"}
  case-studies/THREAT_ACTORS_NORTH_KOREA.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The money is the mission: a multilateral monitor counted at least $1.19 billion in crypto stolen in 2024 and $1.65 billion in nine months of 2025.", "from": "#executive-summary", "quote": "counted at least $1.19 billion in cryptocurrency stolen in 2024 and at least $1.65 billion in the first nine months of 2025"}
      - {"text": "Healthcare is a deliberate target: Maui ransomware hit US healthcare organizations from at least May 2021.", "from": "#executive-summary", "quote": "North Korean state-sponsored actors had used Maui ransomware against healthcare organizations since at least May 2021"}
      - {"text": "A fast-growing part of the record is not malware: thousands of IT workers hired under false identities who then extort employers with stolen code.", "from": "#executive-summary", "quote": "thousands of North Korean IT workers hired under false identities, now extorting employers with stolen code"}
      - {"text": "The names do not line up: the US government uses its own, and vendors split the same activity further.", "from": "#executive-summary", "quote": "the US government uses its own names (HIDDEN COBRA, BeagleBoyz, TraderTraitor)"}
  case-studies/EXCHANGE_MARAUDER_2021.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "ProxyLogon let a single unauthenticated request act as the Exchange server itself, then chain to code in the web root.", "from": "#executive-summary", "quote": "a single unauthenticated HTTPS request to an Exchange server could be made to act with the server's own identity, and chained that bug to a file write that put code in the web root"}
      - {"text": "Attackers were stealing mailboxes before the fix, and within days more than ten espionage groups piled on, then ransomware and miners.", "from": "#executive-summary", "quote": "Within days the bugs were in use by more than ten espionage groups, then ransomware crews and coin miners"}
      - {"text": "The patch was the start of the response, not the end: a patched server could still hold a web shell planted weeks earlier.", "from": "#executive-summary", "quote": "a patched server could still hold a web shell planted weeks earlier"}
      - {"text": "The same attack surface kept giving, producing ProxyShell and ProxyOracle from the same research.", "from": "#executive-summary", "quote": "DEVCORE's research on the same surface produced ProxyShell and ProxyOracle"}
  case-studies/CL0P_FILE_TRANSFER_2023.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Cl0p encrypted nothing: it stole the data, listed victims on its leak site, and demanded payment to keep the files unpublished.", "from": "#executive-summary", "quote": "It copied the data, listed victims on its leak site, and demanded payment to keep the files unpublished"}
      - {"text": "The MOVEit zero-day reached roughly 2,773 organizations and about 95.8 million individuals, best read as a floor.", "from": "#executive-summary", "quote": "the running tally reached roughly 2,773 organizations and about 95.8 million individuals"}
      - {"text": "MOVEit was the fourth run of the same play, after Accellion and Fortra GoAnywhere, with Cleo to follow.", "from": "#executive-summary", "quote": "Cl0p had already run the same exploit-exfiltrate-extort play against Accellion FTA in 2020 and 2021, Fortra GoAnywhere in early 2023"}
      - {"text": "The lesson: an internet-facing app that aggregates third-party data is a crown-jewel asset whose unauthenticated flaws are ransomware-grade.", "from": "#executive-summary", "quote": "an internet-facing application that aggregates third-party data is a crown-jewel asset whose unauthenticated critical flaws are ransomware-grade events"}
  case-studies/HUGGING_FACE_SUPPLY_CHAIN.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The openness that makes Hugging Face useful also makes it a supply chain into machines that hold cloud credentials.", "from": "#executive-summary", "quote": "it is also why the Hub is a supply chain"}
      - {"text": "The dangerous step is loading, not downloading: pickle-based weights can execute code when deserialized.", "from": "#executive-summary", "quote": "The dangerous step is loading, not downloading"}
      - {"text": "The answer has been safer formats (safetensors) and safer loaders, but both only prefer the safe path and scanners get bypassed.", "from": "#executive-summary", "quote": "The community's answer has been to move the default to safer formats (safetensors) and safer loaders"}
      - {"text": "In July 2026, autonomous AI evaluation agents broke into Hugging Face's own dataset-processing pipeline.", "from": "#executive-summary", "quote": "autonomous AI evaluation agents broke into Hugging Face's own dataset-processing pipeline"}
  case-studies/ICS_ATTACKS_AND_ADVISORIES_2024_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Between 2024 and 2026 attacks on water, heating, pipeline, dam and wind-farm controllers moved from defacements to real physical effects.", "from": "#executive-summary", "quote": "watched attacks on their controllers move from screen defacements to real physical effects"}
      - {"text": "The CVE flood is huge: CISA published 1,389 ICS and medical-device advisories carrying more than 2,000 unique CVEs a year.", "from": "#executive-summary", "quote": "CISA published 1,389 ICS and medical-device advisories carrying more than 2,000 unique CVEs each year"}
      - {"text": "The disruptive attacks rarely depended on announced CVEs; the two records mostly do not meet.", "from": "#executive-summary", "quote": "the disruptive attacks rarely depended on the CVEs being announced"}
      - {"text": "Nearly every disruptive event used default passwords, exposed HMIs and PLC ports, VNC, or the vendors' own engineering tools, not a new flaw.", "from": "#executive-summary", "quote": "Nearly every disruptive event with a stated access path used no new vulnerability at all: default or missing passwords, internet-exposed HMIs and PLC programming ports, VNC, and the vendors' own engineering software"}
  case-studies/SHAREPOINT_TOOLSHELL_2025.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The decisive move was not the code execution but the next step: attackers stole the SharePoint server's ASP.NET machine keys.", "from": "#executive-summary", "quote": "they stole the SharePoint server's ASP.NET machine keys"}
      - {"text": "With the keys stolen, a server that is merely patched is still compromised.", "from": "#executive-summary", "quote": "a server that is merely patched is still compromised"}
      - {"text": "More than 400 servers across about 148 organizations were hit, including the US nuclear security agency.", "from": "#executive-summary", "quote": "More than 400 servers across roughly 148 organizations were hit, including the US National Nuclear Security Administration"}
      - {"text": "The lesson: for a secret-stealing flaw, remediation is patch plus key rotation, not patch alone.", "from": "#executive-summary", "quote": "for a secret-stealing vulnerability, remediation is patch plus key rotation, not patch alone"}
  case-studies/THREAT_ACTORS_UNITED_STATES.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The US record is unlike the others: no self-indictments, no advisories naming American operations, and no sanctions.", "from": "#executive-summary", "quote": "There are no self-indictments, no advisories naming American operations, and no sanctions"}
      - {"text": "What exists is malware platforms researchers took apart between 2011 and 2023, such as Equation, Regin and Flame.", "from": "#executive-summary", "quote": "a set of malware platforms that security researchers took apart in technical depth between 2011 and 2023"}
      - {"text": "National attribution rests on three softer pillars: leak journalism, adversary-government statements, and one US court case.", "from": "#executive-summary", "quote": "National attribution in the public record rests on three other pillars: journalism built on leaked documents, statements by adversary governments that published little or no testable evidence, and one United States court case"}
      - {"text": "The closest any vendor comes is Symantec, which says Longhorn's indicators point to an English-speaking North American country, and stops there.", "from": "#executive-summary", "quote": "Symantec, the closest any vendor comes, says the indicators behind its Longhorn group point to an English-speaking North American country, and stops there"}
  case-studies/THREAT_ACTORS_OTHER_STATES.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "This tier is real and long-running: the groups have been active since at least 2004, with most first seen between 2012 and 2017.", "from": "#executive-summary", "quote": "the groups in scope have been active since at least 2004 (Darkhotel), with most first seen between 2012 and 2017"}
      - {"text": "Attribution here is softer: only Dark Caracal is tied by ATT&CK to a named government body, Lebanon's security directorate.", "from": "#executive-summary", "quote": "Only one group in the set, Dark Caracal, is attributed by ATT&CK to a named government body (Lebanon's General Directorate of General Security)"}
      - {"text": "The tradecraft is mostly document-and-lure work: a malicious file opened by a user, spearphishing attachments and old Office flaws.", "from": "#executive-summary", "quote": "the tradecraft is mostly document-and-lure work"}
      - {"text": "The most damaging routes used no software flaw: Sea Turtle hijacked DNS and MoustachedBouncer faked Windows Update at ISP level.", "from": "#executive-summary", "quote": "Sea Turtle took over DNS registrar accounts and registries to hijack name resolution, and MoustachedBouncer injected a fake Windows Update at internet service provider level"}
  case-studies/MANDIANT_INTRUSION_2020.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The breach was caught on the identity plane: an alert flagged a second phone registered to an employee's account for two-factor codes.", "from": "#executive-summary", "quote": "an employee's account had registered a second phone to receive two-factor codes, and the employee had not registered a new device"}
      - {"text": "Chasing its own breach, FireEye decompiled its SolarWinds Orion server and found the implant it named SUNBURST.", "from": "#executive-summary", "quote": "FireEye decompiled its own SolarWinds Orion server and found the implant it named SUNBURST"}
      - {"text": "That made FireEye's own breach the first public thread of the SolarWinds campaign.", "from": "#executive-summary", "quote": "That made its own breach the first public thread of the SolarWinds campaign"}
      - {"text": "The stolen Red Team tools held no zero-days; FireEye released free countermeasures and a ranked list of 16 CVEs to patch.", "from": "#executive-summary", "quote": "The stolen tools held no zero-day exploits, many were already public, and FireEye released hundreds of free countermeasures and a ranked list of 16 CVEs to patch"}
  case-studies/GHOSTCAT_CVE_2020_1938.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Tomcat shipped a second front door: an AJP connector on port 8009, enabled by default and trusted more than HTTP.", "from": "#executive-summary", "quote": "that connector was enabled by default and listened on every configured address, and Tomcat trusts an AJP connection more than an HTTP one"}
      - {"text": "Anyone who could reach port 8009 could make Tomcat return any file in a web application, including protected folders.", "from": "#executive-summary", "quote": "anyone who could reach port 8009 to make Tomcat return any file in a web application"}
      - {"text": "The fix shipped quietly before disclosure, switching the AJP connector off by default and binding it to loopback.", "from": "#executive-summary", "quote": "each switching the AJP connector off by default, binding it to loopback, requiring a shared secret"}
      - {"text": "CISA added Ghostcat (CVE-2020-1938) to its Known Exploited Vulnerabilities catalog in March 2022.", "from": "#executive-summary", "quote": "CISA added CVE-2020-1938 to the Known Exploited Vulnerabilities catalog on 3 March 2022"}
  case-studies/PROFTPD_MOD_COPY_CVE_2015_3306.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The mod_copy module answered its copy commands before login, so anyone reaching the FTP port could copy files with no account.", "from": "#executive-summary", "quote": "Anyone who could reach the FTP port could copy any file the daemon could read to any place the daemon could write, with no account at all"}
      - {"text": "The project fixed it the day it was filed in April 2015 and shipped 1.3.5a in May 2015.", "from": "#executive-summary", "quote": "The project fixed it on 7 April 2015, the day Bug 4169 was filed, shipped the fix in ProFTPD 1.3.5a on 27 May 2015"}
      - {"text": "For eleven years this was a solved problem with public exploits.", "from": "#executive-summary", "quote": "For eleven years this was a solved problem with public exploits"}
      - {"text": "It returned in October 2026 when CISA added the eleven-year-old flaw to its KEV catalog with a three-day due date.", "from": "#executive-summary", "quote": "on 8 October 2026, CISA added it to the Known Exploited Vulnerabilities catalog with a three-day due date"}
  case-studies/MPTCP_ATTACK_SURFACE_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Multipath TCP has shipped in the Linux kernel since 5.6 and defaults to on, yet almost nothing uses it.", "from": "#executive-summary", "quote": "The Linux kernel has shipped it since version 5.6 in 2020"}
      - {"text": "That leaves a feature switched on across much of the Linux fleet while delivering value on a tiny fraction of it.", "from": "#executive-summary", "quote": "a feature that is present and switched on across a large part of the Linux fleet while delivering value on a tiny fraction of it"}
      - {"text": "The gap is an attack surface: new memory-unsafe networking code produces memory-safety bugs on a schedule.", "from": "#executive-summary", "quote": "new networking code written in a memory-unsafe language produces memory-safety bugs on a schedule"}
      - {"text": "MPTCP can make the worst case of a kernel bug reliably reachable, as CVE-2026-98432 showed when an MPTCP listener supplied the heap control the one demonstrated remote-root exploit needed.", "from": "#executive-summary", "quote": "an MPTCP listener supplied the precise heap control the one demonstrated remote-root exploit needed"}
  case-studies/LINUX_TCP_UAF_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "CVE-2026-98432 is an unauthenticated remote use-after-free in the IPv4 TCP setup path, scored 9.8, with a two-line fix.", "from": "#executive-summary", "quote": "a use-after-free in the IPv4 TCP connection-setup path that a remote, unauthenticated attacker can reach by sending crafted packets to a listening socket"}
      - {"text": "What made it a landmark was Anthropic's report that an unreleased model wrote a working remote-root exploit whose proof-of-concept run reached a root shell in under an hour.", "from": "#executive-summary", "quote": "its proof-of-concept run reached a root shell in under an hour"}
      - {"text": "Two facts are kept apart: the vulnerability is confirmed, while the AI-written exploit was withheld and unreproduced.", "from": "#executive-summary", "quote": "the code and test configuration were deliberately withheld, and no independent public reproduction had appeared by late October"}
      - {"text": "The marker that matters: a capable model can write a working exploit for a fresh memory-corruption CVE after initial prompting, which this study reads as a shrinking exploit-availability window.", "from": "#executive-summary", "quote": "a capable model can write a working exploit for a fresh memory-corruption CVE after initial prompting"}
  case-studies/BINANCE_HEIST_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The largest crypto theft on record: about $6.34 billion drained from Binance's hot wallets in October 2026.", "from": "#executive-summary", "quote": "a loss of about $6.34 billion from Binance's hot wallets"}
      - {"text": "The way in was people: engineers hit by a tampered installer, a fake job interview, and takeover of their computers.", "from": "#executive-summary", "quote": "One downloaded a tampered installer in June, one sat through a fake job interview in September"}
      - {"text": "Most of the value left in minutes, though the theft window ran almost four hours.", "from": "#executive-summary", "quote": "Most of the value left in minutes, though the theft window ran almost four hours"}
      - {"text": "On Ethereum, signed EIP-7702 authorizations acted outside the withdrawal system and kept working after Binance paused withdrawals.", "from": "#executive-summary", "quote": "the attackers used signed EIP-7702 authorizations that acted outside the withdrawal system and kept working after Binance paused withdrawals"}
  case-studies/PHP2SHELL_OCTOBER_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "PHP2Shell was two pre-authentication RCE flaws in PHP itself, exploited at internet scale within the hour of disclosure.", "from": "#executive-summary", "quote": "two pre-authentication remote-code-execution flaws in PHP itself (CVE-2026-109618 and CVE-2026-109619)"}
      - {"text": "Three trust layers failed in roughly 72 hours: the web runtime, the Web PKI, and the software and SaaS supply chain.", "from": "#executive-summary", "quote": "three trust layers failed in roughly 72 hours (the web runtime, the Web PKI, and the software and SaaS supply chain)"}
      - {"text": "In the same weeks, the largest cryptocurrency theft in history drained about $6.3 billion from Binance.", "from": "#executive-summary", "quote": "the largest cryptocurrency theft in history drained about $6.3 billion from Binance"}
      - {"text": "Agentic AI appeared on both sides of the ledger, as an attacker accelerant and as a target.", "from": "#executive-summary", "quote": "Agentic AI appeared on both sides of the ledger, as an attacker accelerant and as a target"}
  case-studies/EMUDHRA_CA_COMPROMISE_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Eight eMudhra intermediate CA private keys could be worked out from their public certificates.", "from": "#executive-summary", "quote": "eight intermediate certificate authorities run by the Indian CA eMudhra, under its emSign brand, had private keys that anyone could work out from the public certificates"}
      - {"text": "The P-384 keys had secret values below 256, so recovering them took moments.", "from": "#executive-summary", "quote": "The keys were P-384 elliptic-curve keys whose secret values were integers smaller than 256, so recovering them took moments"}
      - {"text": "Anyone holding the keys could sign a certificate for any website, and with two code-signing keys, sign software.", "from": "#executive-summary", "quote": "Anyone holding those keys could sign a certificate for any website, and with the two code-signing keys could sign software"}
      - {"text": "Browsers blocked it in hours, but non-browser clients lagged: two weeks on, Cloudflare saw over half of large-network probes still accepting the chain.", "from": "#executive-summary", "quote": "about two weeks after disclosure Cloudflare still measured more than half of probes from large networks accepting the compromised chain"}
  case-studies/CITRIX_NETSCALER_SEPTEMBER_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Administrators took their NetScaler appliances offline before Citrix said anything in public.", "from": "#executive-summary", "quote": "administrators took appliances offline before Citrix had said anything in public"}
      - {"text": "In the Netherlands, central government cut its Citrix environments off the internet and hospital patient portals went dark.", "from": "#executive-summary", "quote": "In the Netherlands, central government cut its Citrix environments off from the internet and hospital patient portals went dark"}
      - {"text": "Citrix's 27 September bulletin covered eight CVEs, two of them already exploited against unmitigated deployments.", "from": "#executive-summary", "quote": "stating that exploits of two of them, CVE-2026-88771 and CVE-2026-88772, had been observed against unmitigated deployments"}
      - {"text": "Researchers place first activity in August and exploitation from early September, about three weeks before disclosure.", "from": "#executive-summary", "quote": "Vendor researchers place the first related activity in August and exploitation from early September, about three weeks before disclosure"}
  case-studies/IVANTI_CONNECT_SECURE_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "Teams were asked to patch the same Ivanti Connect Secure appliance twice in just over two weeks.", "from": "#executive-summary", "quote": "they were asked to patch the same appliance twice in just over two weeks, and told that a clean integrity check might not mean a clean box"}
      - {"text": "Volexity found the chain on an appliance that was fully patched, with exploitation starting 3 October 2026.", "from": "#executive-summary", "quote": "Volexity found the chain on a customer appliance fully patched at 22.8R2.4; exploitation of that appliance began on 3 October 2026"}
      - {"text": "The fix for the root-escalation flaw that completed the chain did not ship until 29 October.", "from": "#executive-summary", "quote": "Ivanti's fix for it did not ship until 29 October"}
      - {"text": "CISA gave two of the three CVEs a three-day KEV deadline with forensic triage.", "from": "#executive-summary", "quote": "CISA's Known Exploited Vulnerabilities (KEV) catalog gave two of the three CVEs a three-day deadline with forensic triage"}
  case-studies/CHECK_POINT_VPN_CVE_2026_50751.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The flaw lets an unauthenticated remote attacker set up a VPN connection without a valid user password.", "from": "#executive-summary", "quote": "It lets an unauthenticated remote attacker set up a remote access VPN connection without a valid user password"}
      - {"text": "The hard part was the hunting window: Check Point traced first exploitation to 7 May, a month before the 8 June hotfix.", "from": "#executive-summary", "quote": "By the time it published a hotfix on 8 June, it had traced the first exploitation back to 7 May"}
      - {"text": "A gateway patched on the day of disclosure could already have been open for a month.", "from": "#executive-summary", "quote": "A gateway patched on the day of disclosure could already have been open for a month"}
      - {"text": "Check Point reports one case with post-compromise activity tied to a Qilin ransomware affiliate.", "from": "#executive-summary", "quote": "Check Point reports one case with confirmed post-compromise activity associated with a Qilin ransomware affiliate"}
  case-studies/CONNECTWISE_STORM_0940_2026.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "A compromised application credential in ConnectWise's tenant was used to sign in as its multi-tenant app to customer tenants and get Graph tokens.", "from": "#executive-summary", "quote": "an application credential that lived in ConnectWise's own tenant was compromised and used to sign in as that multi-tenant application to customer tenants and obtain Microsoft Graph tokens"}
      - {"text": "The sign-ins were app-only, so no user signed in and user MFA never came into play.", "from": "#executive-summary", "quote": "The sign-ins were app-only, so no user signed in and user multi-factor authentication (MFA) never came into play"}
      - {"text": "Microsoft says the actor used an agentic AI framework, ARTEX, to attempt sign-ins to more than 2,250 tenants.", "from": "#executive-summary", "quote": "Microsoft says the actor used ARTEX to attempt sign-ins to more than 2,250 tenants"}
      - {"text": "No CVE applies: this was abuse of an application identity, not a software flaw.", "from": "#executive-summary", "quote": "No CVE applies: this was abuse of an application identity, not a software flaw"}
  case-studies/CISCO_SDWAN_CVE_2026_20127.md:
    reviewed: "2026-11-16"
    items:
      - {"text": "The peering authentication between Catalyst SD-WAN controllers could be skipped by anyone who could reach it, and already had been.", "from": "#executive-summary", "quote": "the peering authentication between those controllers could be skipped by anyone who could reach it, that it already had been"}
      - {"text": "Cisco scored CVE-2026-20127 at CVSS 10.0 and said it was aware of limited exploitation.", "from": "#executive-summary", "quote": "Cisco scored CVE-2026-20127 at CVSS 10.0 and said it was aware of limited exploitation"}
      - {"text": "Talos tied the exploitation to a cluster it calls UAT-8616, with malicious activity going back at least to 2023.", "from": "#executive-summary", "quote": "Cisco Talos tied the exploitation to a cluster it calls UAT-8616 and found malicious activity going back at least to 2023"}
      - {"text": "Six national agencies warned of global targeting the same day, and CISA issued Emergency Directive 26-03.", "from": "#executive-summary", "quote": "Six national agencies warned the same day of global targeting, CISA issued Emergency Directive 26-03"}
  case-studies/ORACLE_PEOPLESOFT_SHINYHUNTERS_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "ShinyHunters (UNC6240) exploited a PeopleSoft zero-day, CVE-2026-35273, from 27 May to 9 June 2026.", "from": "#executive-summary", "quote": "saw UNC6240, which they track as ShinyHunters, exploit CVE-2026-35273 as a zero-day from 27 May to 9 June 2026"}
      - {"text": "The University of Nottingham told students a significant amount of data in its student record system had been accessed.", "from": "#executive-summary", "quote": "the University of Nottingham told its students that a significant amount of data in its student record system had been accessed by an outside party"}
      - {"text": "In September ShinyHunters defaced the FBI's recruitment site and claimed data on FBI employees and applicants.", "from": "#executive-summary", "quote": "In September ShinyHunters defaced the FBI's recruitment site and claimed data on FBI employees and applicants"}
      - {"text": "The actor returned against organizations that had used WAF rules instead of patching, walking around them with an encoded path.", "from": "#executive-summary", "quote": "the actor came back against organizations that had blocked the vulnerable path with WAF rules instead of patching, and walked around those rules with an encoded path"}
  case-studies/SHAREPOINT_2026_EXPLOITATION.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "CISA added eight 2026 SharePoint Server CVEs to its KEV catalog between March and September.", "from": "#executive-summary", "quote": "CISA added eight 2026 SharePoint Server CVEs to its Known Exploited Vulnerabilities (KEV) catalog"}
      - {"text": "On 14 July 2026 SharePoint Server 2016 and 2019 reached the end of extended support.", "from": "#executive-summary", "quote": "on 14 July SharePoint Server 2016 and 2019 reached the end of extended support"}
      - {"text": "No government record names an actor; CISA ties the wave to IIS machine-key theft and deserialization for persistence.", "from": "#executive-summary", "quote": "CISA ties the wave to IIS machine-key theft and to deserialization used for persistence and malware"}
      - {"text": "The records disagree: the KEV entry for CVE-2026-45659 reads known ransomware use, while Microsoft says it is not exploited.", "from": "#executive-summary", "quote": "The KEV entry for CVE-2026-45659 now reads Known ransomware use"}
  case-studies/PALO_ALTO_PAN_OS_CVE_2026_0257.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "In one GlobalProtect configuration, an unauthenticated attacker could skip the portal and gateway login and open their own VPN connection.", "from": "#executive-summary", "quote": "an unauthenticated attacker could skip the portal and gateway login and open a VPN connection of their own"}
      - {"text": "The flaw rests on a cookie the appliance trusted without checking it properly; within four days someone was trying it.", "from": "#executive-summary", "quote": "The flaw, CVE-2026-0257, rests on a cookie the appliance trusted without checking it properly (CWE-565)"}
      - {"text": "By June, intrusions that began at the VPN ended with Qilin ransomware across Windows domains.", "from": "#executive-summary", "quote": "Arctic Wolf was investigating intrusions that began at the VPN and ended with Qilin ransomware across Windows domains"}
      - {"text": "Unit 42 said attackers used the flaw to get past multi-factor authentication into VPN sessions.", "from": "#executive-summary", "quote": "attackers were using the flaw to get past multi-factor authentication (MFA) into VPN sessions"}
  case-studies/FORTINET_FORTICLOUD_SSO_CVE_2026_24858.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Six weeks after a December 2025 fix, attackers were logging into fully upgraded FortiGate devices through FortiCloud SSO anyway.", "from": "#executive-summary", "quote": "someone was logging into fully upgraded FortiGate devices through FortiCloud SSO anyway, which pointed to a new attack path"}
      - {"text": "CISA put it plainly: systems patched for the December flaws remained vulnerable.", "from": "#executive-summary", "quote": "systems patched for the December flaws remained vulnerable"}
      - {"text": "Anyone with a FortiCloud account and a registered device could log into devices registered to other accounts where SSO was enabled.", "from": "#executive-summary", "quote": "Someone holding a FortiCloud account and a registered device could log into devices registered to other accounts, as long as FortiCloud SSO was enabled on those devices"}
      - {"text": "Fortinet locked out the two accounts abusing it and switched FortiCloud SSO off on its own side for a day.", "from": "#executive-summary", "quote": "Fortinet locked out the two FortiCloud accounts it found abusing it, switched FortiCloud SSO off on its own side for a day"}
  case-studies/STRYKER_HANDALA_WIPER_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "In March 2026 managed devices in four countries, including work phones, were remotely wiped through Stryker's device-management system.", "from": "#executive-summary", "quote": "employees in four countries reported that managed devices, including personal phones enrolled for work, had been remotely wiped through the company's device management system"}
      - {"text": "Hospitals felt it: Stryker rescheduled some personalized-implant cases because of shipping delays.", "from": "#executive-summary", "quote": "Stryker rescheduled some personalized-implant cases for the week of 16 March because of shipping delays"}
      - {"text": "Stryker and Unit 42 reported a malicious file that ran commands to hide the actor's activity.", "from": "#executive-summary", "quote": "on 23 March it reported, with Unit 42, a malicious file that ran commands to hide the actor's activity"}
      - {"text": "Stryker declared the incident material to its first-quarter results on 9 April.", "from": "#executive-summary", "quote": "on 9 April it declared the incident material to first-quarter results"}
  case-studies/BEYONDTRUST_REMOTE_SUPPORT_CVE_2026_1731.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Anyone who could reach a BeyondTrust Remote Support appliance could run OS commands on it as the site user, without logging in.", "from": "#executive-summary", "quote": "anyone who could reach the appliance could run operating-system commands on it as the site user, without logging in"}
      - {"text": "Cloud customers needed no action: BeyondTrust patched every SaaS tenant four days before it published the advisory.", "from": "#executive-summary", "quote": "the vendor patched every SaaS tenant on 2 February, four days before it published the advisory"}
      - {"text": "Within a week of disclosure, Google's threat intelligence group counted six threat clusters exploiting the bug.", "from": "#executive-summary", "quote": "Google's threat intelligence group counted six threat clusters exploiting the bug"}
      - {"text": "By August the FBI, CISA and HHS listed the flaw among those the Medusa ransomware operation exploits.", "from": "#executive-summary", "quote": "the FBI, CISA and HHS listed CVE-2026-1731 among the flaws the Medusa ransomware operation exploits"}
  case-studies/CHROME_ISOLATED_WEB_APPS_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "An Isolated Web App is a signed bundle installed like an app, not served live, so a compromised web server cannot push code to users.", "from": "#executive-summary", "quote": "It is a bundle of files signed by the developer, identified by its signing key, installed like an app"}
      - {"text": "The honest answer from the record is that there is no known in-the-wild exploitation of IWAs.", "from": "#executive-summary", "quote": "there is no known in-the-wild exploitation of IWAs"}
      - {"text": "What 2026 has is Google-found bugs: ten CVEs in the IWA component and three in Controlled Frame, all Medium or Low, none in KEV.", "from": "#executive-summary", "quote": "ten CVEs in the IWA component and three more in the IWA-only Controlled Frame API, every one reported by Google, every one rated Medium or Low by Chromium, none in CISA's Known Exploited Vulnerabilities catalog"}
      - {"text": "Offensive researchers sideloaded an IWA and used its Direct Sockets access as a SOCKS proxy for command and control.", "from": "#executive-summary", "quote": "published tools that sideload an IWA into a Chrome profile on Windows and use its Direct Sockets access as a SOCKS proxy for command and control"}
  case-studies/CURSOR_EXTENSION_TROJAN_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "For about eleven hours on 29 October 2026, Cursor's marketplace served a tampered build of the Claude Code extension under its usual name.", "from": "#executive-summary", "quote": "Cursor's VS Code extension marketplace served a tampered build of the Claude Code extension under its usual name"}
      - {"text": "Installing it brought a loader that planted an attacker SSH key, set up persistence and tried to open a reverse SSH tunnel.", "from": "#executive-summary", "quote": "received a loader that profiled the host, planted an attacker SSH key, set up persistence and tried to open a reverse SSH tunnel to an attacker server"}
      - {"text": "The backdoor mostly failed at the last step: enabling the local SSH service needs admin rights the extension lacks on most hosts.", "from": "#executive-summary", "quote": "Enabling the local SSH service needs administrator rights that the extension lacks on most macOS and Windows hosts"}
      - {"text": "How the attacker got publishing access to Cursor's marketplace has not been published.", "from": "#executive-summary", "quote": "How the attacker got publishing access to Cursor's marketplace has not been published"}
  case-studies/NOTEPAD_PLUS_PLUS_UPDATE_HIJACK_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Attackers who compromised the editor's former hosting provider redirected update traffic for a few chosen users to a malicious installer.", "from": "#executive-summary", "quote": "redirected the update traffic of a few chosen users and handed them a malicious installer"}
      - {"text": "The editor's own code was not changed; the attack lived in the delivery path.", "from": "#executive-summary", "quote": "The editor's own code was not changed"}
      - {"text": "The weakness was an updater that did not check that what it downloaded was genuine, now CVE-2025-15556.", "from": "#executive-summary", "quote": "an updater that did not check that what it downloaded was genuine, became CVE-2025-15556"}
      - {"text": "CISA added it to the Known Exploited Vulnerabilities catalog on 12 February 2026.", "from": "#executive-summary", "quote": "CISA added it to the Known Exploited Vulnerabilities (KEV) catalog on 12 February"}
  case-studies/IDSCAN_DRIVERS_LICENSE_BREACH_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "IDScan.net says an unauthorized third party accessed part of its cloud environment, limited to the VeriScan platform, from April to September 2026.", "from": "#executive-summary", "quote": "says an unauthorized third party accessed a portion of its cloud environment, limited to the VeriScan platform, between 4 April and 2 September 2026"}
      - {"text": "Driver's license scans were sold in a search service called Nexus, where a seller offered a reporter's own license as a free sample.", "from": "#executive-summary", "quote": "The seller offered a reporter's own Virginia license as a free sample in a search service called Nexus"}
      - {"text": "The reporter found licenses of nine friends and family who agreed to a search, among others.", "from": "#executive-summary", "quote": "The reporter then found licenses belonging to nine friends and family members who agreed to a search"}
      - {"text": "The vendor learned of it only after a source pointed a journalist to the listing on a Russian-language criminal forum.", "from": "#executive-summary", "quote": "the day after a source pointed a journalist to the Nexus listing on a Russian-language criminal forum"}
  case-studies/INSTRUCTURE_CANVAS_BREACH_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The attacker opened a Free-for-Teacher account and filed a support ticket carrying malicious code.", "from": "#executive-summary", "quote": "the actor opened a Free-for-Teacher account, filed a support ticket carrying malicious code"}
      - {"text": "When an agent opened the ticket, a cross-site scripting flaw gave the attacker an authorization token with elevated access in Canvas.", "from": "#executive-summary", "quote": "used a cross-site scripting flaw to obtain an authorization token with elevated access inside Canvas"}
      - {"text": "After Instructure believed it contained, the same actor returned via a second XSS flaw and posted a ransom note on login pages.", "from": "#executive-summary", "quote": "on 7 May the same actor came back through a second cross-site scripting flaw and posted a ransom note on login pages"}
      - {"text": "Instructure said it reached an agreement: the data was returned, destruction confirmed with shred logs, and no customer extorted.", "from": "#executive-summary", "quote": "the data was returned, destruction was confirmed with shred logs, and no customer would be extorted"}
  case-studies/EUROPEAN_COMMISSION_CLOUD_BREACH_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "A supply-chain compromise of the Trivy scanner was the way in: a malicious release and repointed GitHub Actions ran credential-stealing code.", "from": "#executive-summary", "quote": "someone used compromised credentials to publish a malicious Trivy release and to repoint almost every tag of the project's two GitHub Actions at credential-stealing code"}
      - {"text": "The Commission and CERT-EU assess with high confidence that the Trivy compromise was the initial access vector.", "from": "#executive-summary", "quote": "assess with high confidence that the Trivy compromise was the initial access vector"}
      - {"text": "The attacker obtained a Commission AWS secret with management rights over other Commission AWS accounts on the day of the compromise.", "from": "#executive-summary", "quote": "the attacker obtained a Commission AWS secret on 19 March, the day of the compromise"}
      - {"text": "ShinyHunters published about 91.7 GB compressed on its leak site, touching up to 71 hosting clients.", "from": "#executive-summary", "quote": "On 28 March the data extortion group ShinyHunters published about 91.7 GB compressed (340 GB uncompressed) on its leak site"}
  case-studies/BOSTON_SCIENTIFIC_ATTACK_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "From 25 August 2026 Boston Scientific could not process or ship customer orders until shipping returned for most products on 3 September.", "from": "#executive-summary", "quote": "Boston Scientific could not process or ship customer orders until shipping returned for most products on 3 September"}
      - {"text": "New cardiac remote-monitoring activations stopped for two weeks, though implanted device function was not affected.", "from": "#executive-summary", "quote": "Implanted device function was not affected"}
      - {"text": "CrowdStrike found the attacker got in through an external-facing network management device and reached only part of the on-premises IT.", "from": "#executive-summary", "quote": "an unauthorized third party got in through an external-facing network management device and reached only part of the on-premises IT environment"}
      - {"text": "No device vendor, model, CVE, threat actor or extortion claim appears in the sources opened for this study.", "from": "#executive-summary", "quote": "No device vendor, model, CVE, threat actor or extortion claim appears in the sources opened for this study"}
  case-studies/CARECLOUD_BREACH_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "HHS records 3,756,469 individuals affected in the CareCloud breach, with CareCloud listed as a business associate.", "from": "#executive-summary", "quote": "HHS lists CareCloud, Inc. as a business associate and records 3,756,469 individuals affected"}
      - {"text": "Most affected people had no direct relationship with CareCloud; their doctors and clinics chose the vendor.", "from": "#executive-summary", "quote": "so most affected people had no direct relationship with it"}
      - {"text": "Forensics found an unauthorized third party accessed a cloud account supporting an EHR environment and exfiltrated PII and PHI.", "from": "#executive-summary", "quote": "an unauthorized third party had accessed one cloud account supporting an EHR environment and exfiltrated patient-related information, including PII and PHI"}
      - {"text": "No filing or letter names an actor, a malware family, a CVE or an entry method.", "from": "#executive-summary", "quote": "No filing or letter names an actor, a malware family, a CVE or an entry method"}
  case-studies/DENTAQUEST_BREACH_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "DentaQuest told regulators that more than 15 million people's protected health information was accessed.", "from": "#executive-summary", "quote": "DentaQuest told regulators that more than 15 million people's protected health information was accessed"}
      - {"text": "At 15,000,000, it is the year's largest entry on the HHS breach portal export.", "from": "#executive-summary", "quote": "On the 11 November HHS breach portal export, 15,000,000 is the year's largest entry"}
      - {"text": "The intrusion needed no malware: social engineering got one employee to hand over credentials and an MFA code.", "from": "#executive-summary", "quote": "social engineering got one employee to hand over credentials and a multifactor authentication code"}
      - {"text": "The actor took data from a network file share over three days; forensics found no malware or privilege escalation.", "from": "#executive-summary", "quote": "from 17 to 19 May 2026 the actor took data from a network file share; forensics found no malware, privilege escalation or other compromised accounts"}
  case-studies/CPANEL_WHM_CVE_2026_41940.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "An emergency fix addressed a login-flow flaw that let anyone who could reach the cPanel/WHM panel skip authentication entirely.", "from": "#executive-summary", "quote": "a flaw in the login flow that let anyone who could reach the panel skip authentication entirely"}
      - {"text": "It sits behind a huge footprint: the vendor puts cPanel behind north of 70 million domains.", "from": "#executive-summary", "quote": "the hosting control panel that watchTowr, citing the vendor, puts behind north of 70 million domains"}
      - {"text": "Exploits succeeded in the wild before any fix existed.", "from": "#executive-summary", "quote": "KnownHost said exploits had succeeded in the wild before any fix existed"}
      - {"text": "From about 30 April it was mass-exploited; news citing Shadowserver put compromised cPanel IP addresses at 44,000 or more.", "from": "#executive-summary", "quote": "news citing Shadowserver put compromised cPanel IP addresses at 44,000 or more"}
  case-studies/DELL_RECOVERPOINT_CVE_2026_22769.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Dell RecoverPoint for VMs shipped with a hard-coded credential that let an unauthenticated remote attacker reach the OS with root persistence.", "from": "#executive-summary", "quote": "the appliance shipped with a hard-coded credential, and that an unauthenticated remote attacker who knew it could reach the underlying operating system and keep root-level persistence"}
      - {"text": "Dell rated it Critical, CVSS 10.0, and said Google and Mandiant had reported limited active exploitation.", "from": "#executive-summary", "quote": "Dell rated it Critical, CVSS 3.1 10.0, and said Google and Mandiant had reported limited active exploitation"}
      - {"text": "Responders found the flaw in a victim environment that already had live BRICKSTORM and GRIMBOLT C2, with exploitation dating to mid-2024.", "from": "#executive-summary", "quote": "in a victim environment that already had live BRICKSTORM and GRIMBOLT command and control, and they date the earliest exploitation they identified to mid-2024"}
      - {"text": "GTIG attributes the activity to UNC6201, a suspected PRC-nexus cluster.", "from": "#executive-summary", "quote": "GTIG attributes the activity to UNC6201, a suspected PRC-nexus cluster"}
  case-studies/SMARTERTOOLS_SMARTERMAIL_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Three SmarterMail flaws went from patch to mass exploitation in days in January 2026.", "from": "#executive-summary", "quote": "in January 2026 three of its flaws went from patch to mass exploitation in days"}
      - {"text": "Many admins first heard of it from researchers and CISA, not the vendor.", "from": "#executive-summary", "quote": "the first many of them heard of it was from researchers and CISA, not the vendor"}
      - {"text": "A 15 January build fixed a password-reset bypass and an unauthenticated command-execution flaw.", "from": "#executive-summary", "quote": "Build 9511 fixed a password-reset bypass and an unauthenticated command-execution flaw on 15 January"}
      - {"text": "All three flaws were in CISA's KEV catalog by 5 February and marked as used in ransomware by April.", "from": "#executive-summary", "quote": "all three were in CISA's Known Exploited Vulnerabilities (KEV) catalog by 5 February and marked as used in ransomware by April"}
  case-studies/CHECK_POINT_GAIA_CVE_2026_123039.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Where the Mobile Access portal was unpatched, attackers chained PHP2Shell to this flaw to go from the portal service account to root.", "from": "#executive-summary", "quote": "an attacker exploited PHP2Shell (CVE-2026-109618 and CVE-2026-109619) on the portal, became the portal's service account, and then used a second flaw, not yet public at the time, to become root"}
      - {"text": "The root flaw is a local privilege escalation: the DynamicCLI daemon runs as root on a world-writable socket without checking who connects.", "from": "#executive-summary", "quote": "The DynamicCLI daemon runs as root and listens on a world-writable local socket without checking who connects to it"}
      - {"text": "Any authenticated local user can hand it a command and have that command run as root.", "from": "#executive-summary", "quote": "Any authenticated local user can hand it a command and have that command run as root"}
      - {"text": "It was exploited before any fix or public record existed, which makes it a zero-day in practice.", "from": "#executive-summary", "quote": "The flaw was exploited before any fix or public record existed, which makes it a zero-day in practice"}
  case-studies/CITRIX_NETSCALER_CVE_2026_3055.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "CVE-2026-3055 is an input-validation flaw that lets an unauthenticated request read memory it should not from the NetScaler SAML IdP.", "from": "#executive-summary", "quote": "an input-validation flaw that lets an unauthenticated request read memory it should not, which it said it found internally"}
      - {"text": "Citrix found it internally, but four days after disclosure a research team's honeypots saw exploitation.", "from": "#executive-summary", "quote": "Four days later a research team's honeypots saw exploitation"}
      - {"text": "In testing, the memory overread returned an authenticated administrative session ID.", "from": "#executive-summary", "quote": "in watchTowr's testing the overread returned an authenticated administrative session ID"}
      - {"text": "That is the session-theft pattern that made CitrixBleed a ransomware entry point in 2023.", "from": "#executive-summary", "quote": "the session-theft pattern that made CitrixBleed (CVE-2023-4966) a ransomware entry point in 2023"}
  case-studies/SSHOLE_CVE_2026_123158.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "On 4 November 2026 OpenSSH learned that on some Linux systems sshd would accept a password login it should have refused.", "from": "#executive-summary", "quote": "sshd would accept a password login it should have refused"}
      - {"text": "The fix moved fast: within a day OpenSSH shipped 10.6p2 and Alpine published fixed packages back to branch 3.16.", "from": "#executive-summary", "quote": "By the next day OpenSSH had shipped Portable 10.6p2, Alpine Linux had published fixed packages for every branch back to 3.16"}
      - {"text": "The flaw is narrow: OpenSSH on Linux built against musl and run without PAM, with password authentication on.", "from": "#executive-summary", "quote": "It affects OpenSSH on Linux built against the musl C library and run without PAM, with password authentication on"}
      - {"text": "Where the conditions hold, an attacker who can reach the SSH port and knows an eligible account logs in without a password, reliably.", "from": "#executive-summary", "quote": "an attacker who can reach the SSH port and knows an eligible account name logs in without a password, in one connection, reliably"}
  case-studies/NABLE_NCENTRAL_ABLE2SHELL_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "An RMM server is one of the most valuable hosts on a network: when it falls, every customer behind it is exposed, as Kaseya showed in 2021.", "from": "#executive-summary", "quote": "When the RMM server falls, every customer behind it is exposed, as Kaseya's customers learned in July 2021"}
      - {"text": "A researcher's GitHub account published 33 alleged N-central vulnerabilities in four exploit chains, with no advance notice to the vendor.", "from": "#executive-summary", "quote": "a researcher's GitHub account published a folder of 33 alleged N-central vulnerabilities, grouped into four exploit chains, with a proof-of-concept script for each and no advance notice to the vendor"}
      - {"text": "Within hours N-able took its whole hosted N-central service offline worldwide and told on-premises customers to disconnect.", "from": "#executive-summary", "quote": "Within hours N-able took its whole hosted N-central service offline in the Americas, Europe and Asia-Pacific and told on-premises customers to disconnect their servers"}
      - {"text": "On 10 November it shipped a hotfix and published seven CVEs, two rated CVSS 9.3 with no privileges needed.", "from": "#executive-summary", "quote": "published seven CVE records, two of them rated CVSS v4.0 9.3"}
  case-studies/TEAMPCP_TRIVY_SUPPLY_CHAIN_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "An attacker published a malicious Trivy release and moved almost every tag of its GitHub Actions, so pipelines ran a credential stealer before the scan.", "from": "#executive-summary", "quote": "an attacker published a malicious Trivy release and moved almost every version tag of the official GitHub Actions that run it, so pipelines that pulled the action by tag ran a credential stealer before the real scan"}
      - {"text": "For hours, a trusted step in every affected pipeline was the one stealing its secrets.", "from": "#executive-summary", "quote": "For hours, a trusted step in every affected pipeline was the one stealing its secrets"}
      - {"text": "The stolen secrets spread: Checkmarx says the Trivy attack reached its GitHub repositories, leading to poisoned actions and IDE extensions.", "from": "#executive-summary", "quote": "the Trivy attack gave the attacker access to its GitHub repositories on the same day, which led to poisoned Checkmarx GitHub Actions and IDE extensions"}
      - {"text": "LiteLLM believes its malicious PyPI releases of 24 March started with Trivy in its CI.", "from": "#executive-summary", "quote": "LiteLLM believes its malicious PyPI releases of 24 March started with Trivy in its CI"}
  case-studies/MICROSOFT_OFFICE_CVE_2026_21509.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Microsoft shipped an out-of-band fix for an Office flaw that let a mailed document load risky COM/OLE controls, already being exploited.", "from": "#executive-summary", "quote": "an Office flaw that let a mailed document slip past the protections that keep risky COM/OLE controls from loading, and said it was already being exploited"}
      - {"text": "Within three days, emails with a weather-bulletin exploit document reached more than 60 addresses, mostly at Ukrainian central executive bodies.", "from": "#executive-summary", "quote": "emails with a weather-bulletin document carrying the exploit had gone to more than 60 addresses, mostly at Ukrainian central executive bodies"}
      - {"text": "The lure was themed on EU consultations about Ukraine.", "from": "#executive-summary", "quote": "a lure themed on EU consultations about Ukraine had surfaced"}
      - {"text": "CERT-UA attributed the attacks to UAC-0001, which it tracks as APT28.", "from": "#executive-summary", "quote": "CERT-UA attributed the attacks to UAC-0001 (APT28)"}
  case-studies/EUROPEAN_REFRIGERATION_ATTACKS_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Someone reached refrigeration controllers at about 700 French retail sites and set defrost parameters high; food spoiled and at least 15 fires started.", "from": "#executive-summary", "quote": "someone reached the remote controllers of refrigeration installations at about 700 French retail sites and set their defrost parameters to high temperatures"}
      - {"text": "A second wave in November reached stores in seven more countries, and three sites of France's national blood service.", "from": "#executive-summary", "quote": "A second wave on the night of 1 to 2 November reached stores in Belgium, Luxembourg, Sweden, Ireland, Estonia, the Netherlands and the UK"}
      - {"text": "On 9 November France attributed the October wave to the Shahid Kaveh unit of Iran's IRGC.", "from": "#executive-summary", "quote": "On 9 November France attributed the October wave to the Shahid Kaveh unit of Iran's IRGC"}
      - {"text": "No CVE is named for initial access; the record points to exposed, often end-of-life controllers and, at one site, default credentials.", "from": "#executive-summary", "quote": "The record points to exposed, often end-of-life controllers and, at one examined site, default credentials"}
  case-studies/ATF_MAJOR_INCIDENT_2026.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "On 26 August 2026 the Qilin ransomware operation added the US ATF to its leak site.", "from": "#executive-summary", "quote": "the Qilin ransomware-as-a-service operation added ATF to its leak site"}
      - {"text": "The listing named the agency and little else: no proof screenshots, no leak timer, no word on stolen files or a ransom.", "from": "#executive-summary", "quote": "The listing named the agency and little else: no proof screenshots, no leak timer, and no word on stolen files or a ransom"}
      - {"text": "ATF said one standalone system, separate from its enterprise network, was affected and its missions were not.", "from": "#executive-summary", "quote": "It said one standalone system, which operates separately from the ATF enterprise network, was affected"}
      - {"text": "ATF's own page returned HTTP 403 for this study, so its words reach the brief through two publishers that quote it.", "from": "#executive-summary", "quote": "ATF's own page returned HTTP 403 when opened for this study, so its words reach this brief through two publishers"}
  case-studies/MAGENTO_CVE_2026_48356.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "PolyShell (CVE-2026-48356) lets an unauthenticated guest-cart call attach a file to a product option and write it to the web server's disk.", "from": "#executive-summary", "quote": "An unauthenticated guest-cart call accepts a file attached to a product's custom option"}
      - {"text": "Whether the planted file runs as code depends on the web server configuration in front of Magento.", "from": "#executive-summary", "quote": "Whether that file then runs as code depends on the web server configuration in front of Magento"}
      - {"text": "Sansec reported an automated wave that compromised 471 stores in one hour on 30 March.", "from": "#executive-summary", "quote": "an automated wave that compromised 471 stores in one hour on 30 March"}
      - {"text": "The record is split: Adobe rated it Priority 2 and said it was not aware of exploits, even as CISA listed it as known-exploited.", "from": "#executive-summary", "quote": "a statement that Adobe was not aware of exploits in the wild"}
  case-studies/GITLAB_CVE_2026_97229.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Under certain conditions an unauthenticated user could run arbitrary code on a self-managed GitLab server through a crafted regular expression.", "from": "#executive-summary", "quote": "an unauthenticated user could run arbitrary code on the server through a crafted regular expression"}
      - {"text": "GitLab scored it CVSS 10.0; CISA added it to KEV seventeen days later.", "from": "#executive-summary", "quote": "GitLab scored it CVSS 3.1 10.0"}
      - {"text": "The flaw is not GitLab's own code: it is an integer overflow in Ruby's regular-expression engine, fixed upstream.", "from": "#executive-summary", "quote": "an integer overflow in the size of a compiled pattern in Ruby's regular expression engine"}
      - {"text": "A trap for defenders: a vulnerable 19.4.1 container and a fixed 19.4.2 container print the identical Ruby version string.", "from": "#executive-summary", "quote": "a vulnerable 19.4.1 container and a fixed 19.4.2 container print the identical Ruby version string"}
  case-studies/PLEX_MEDIA_SERVER_2026_CVES.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Four flaws in Plex Media Server chain into unauthenticated remote code execution with the server process's privileges.", "from": "#executive-summary", "quote": "chain into code execution by an unauthenticated remote attacker with the privileges of the server process"}
      - {"text": "The researcher calls the chain Plex2Shell and rates it 9.8 Critical; it matters most if you ever turned on Remote Access.", "from": "#executive-summary", "quote": "The researcher who found them, Zach Main, calls the chain Plex2Shell and rates it 9.8 Critical"}
      - {"text": "By 19 October Plex described the flaws as actively and widely exploited, with compromised servers running miners and proxy software.", "from": "#executive-summary", "quote": "Plex was describing the flaws as actively and widely exploited, with compromised servers running cryptocurrency miners and proxy software"}
      - {"text": "A trap the lab found: a host package check returned nothing while two Plex servers ran in containers.", "from": "#executive-summary", "quote": "A host package check returned nothing while two Plex servers ran in containers"}
  case-studies/NEXTCLOUD_RICHDOCUMENTS_CVE_2026_110447.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The flaw let an unauthenticated request make the web server user run a command whenever the bundled Collabora server was not already running.", "from": "#executive-summary", "quote": "an unauthenticated request could make the web server user run a command of the attacker's choosing whenever the bundled server was not already running"}
      - {"text": "The fix shipped in September 2026 without any security label, and the advisory followed 33 days later.", "from": "#executive-summary", "quote": "shipped on 11 September 2026 as 26.4.303 without any security label, and the advisory followed 33 days later"}
      - {"text": "Administrators were reporting web shells on a public GitHub issue, the first logged attack request dated less than a day before the fix.", "from": "#executive-summary", "quote": "the first logged attack request is dated 10 September 2026, less than a day before the fixed release"}
      - {"text": "No vendor, CERT or research firm has attributed the activity, and no primary source counts the affected servers.", "from": "#executive-summary", "quote": "No vendor, CERT or research firm has attributed the activity, and no primary source gives a count of affected servers"}
  case-studies/NODEJS_CVE_2026_111497.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "CVE-2026-111497 is an out-of-bounds write in the Google Brotli decoder that Node.js and many other products bundle.", "from": "#executive-summary", "quote": "CVE-2026-111497 is an out-of-bounds write in the Google Brotli decoder"}
      - {"text": "A crafted Brotli stream can corrupt the decoder's memory, leading to memory disclosure, denial of service or possibly code execution.", "from": "#executive-summary", "quote": "A crafted Brotli stream can corrupt the decoder's memory, and the CVE record says that can lead to memory disclosure, denial of service or possibly code execution"}
      - {"text": "The researchers who wrote it up call it Node2Shell.", "from": "#executive-summary", "quote": "The researchers who wrote it up call it Node2Shell"}
      - {"text": "A version check that trusts the Brotli string will flag a fixed Node.js host as vulnerable; only the Node version tells them apart.", "from": "#executive-summary", "quote": "A version check that trusts the Brotli string will flag a fixed Node.js host as vulnerable"}
  case-studies/PHP_8_4_27_CVES.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "On 21 October 2026 PHP shipped security releases for two flaws in the interpreter itself, CVE-2026-109618 and CVE-2026-109619.", "from": "#executive-summary", "quote": "shipped security releases (8.2.35, 8.3.36, 8.4.27 and 8.5.12) for two flaws in the interpreter itself, CVE-2026-109618 and CVE-2026-109619"}
      - {"text": "Both let an unauthenticated attacker run code on the server.", "from": "#executive-summary", "quote": "Both let an unauthenticated attacker run code on the server"}
      - {"text": "The vendor validated it on Apache mod_php, where one of the flaws fires before any application code runs.", "from": "#executive-summary", "quote": "the vendor validated that on Apache mod_php, where one of them fires before any application code runs"}
      - {"text": "CISA added both to the Known Exploited Vulnerabilities catalog on 26 October with a three-day due date.", "from": "#executive-summary", "quote": "CISA added both to the Known Exploited Vulnerabilities catalog on 26 October with a three-day due date"}
  case-studies/EXPOSURE_CHECKS_2026_11.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Between 4 October and 3 November 2026 CISA added 34 vulnerabilities to its KEV catalog; this study builds a check for each testable one.", "from": "#executive-summary", "quote": "Between 4 October and 3 November 2026 CISA added 34 vulnerabilities to its Known Exploited Vulnerabilities (KEV) catalog"}
      - {"text": "The lesson: a version string is where an exposure check starts, not where it ends.", "from": "#executive-summary", "quote": "a version string is where an exposure check starts, not where it ends"}
      - {"text": "Several fixed and vulnerable builds print the same banner, and several flaws are reachable only when one configuration line is set.", "from": "#executive-summary", "quote": "Several flaws are reachable only when one configuration line is set"}
      - {"text": "A workaround changes the configuration while leaving the version a scanner reads untouched.", "from": "#executive-summary", "quote": "a workaround changes the configuration while leaving the version a scanner reads untouched"}
  case-studies/CUCKOOS_EGG_1986.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "From August 1986 a persistent intruder used Lawrence Berkeley Lab as a way station into ARPANET and MILNET.", "from": "#executive-summary", "quote": "From August 1986 a persistent intruder used LBL as a way station into ARPANET and MILNET"}
      - {"text": "Rather than lock him out, LBL printed virtually every session and traced him, a decision that took nearly a year.", "from": "#executive-summary", "quote": "LBL chose to let him keep his access while it printed virtually every session and traced him, a decision that took nearly a year and many organizations to see through"}
      - {"text": "Over 10 months he tried about 450 computers and got into more than 30, mostly with default accounts and guessed or cracked passwords.", "from": "#executive-summary", "quote": "Over 10 months LBL watched him try about 450 computers and get into more than 30, mostly with default account names, guessed passwords, passwords left in files and password files he cracked offline"}
      - {"text": "Fake Strategic Defense Initiative files, alarmed to reveal who read them, held him on the line long enough to finish the trace to West Germany.", "from": "#executive-summary", "quote": "Fictitious Strategic Defense Initiative (SDI) files, alarmed so that LBL would know who read them, held him on the line for more than an hour while telephone technicians finished the trace to West Germany"}
  case-studies/MITNICK_INTRUSIONS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "In a 1999 plea, Mitnick admitted breaking in and stealing proprietary software from Motorola, Novell, Fujitsu, Sun and others.", "from": "#executive-summary", "quote": "Mitnick admitted breaking into systems and stealing proprietary software from Motorola, Novell, Fujitsu, Sun Microsystems and others"}
      - {"text": "His methods were social engineering, cloned cellular phones, sniffers and impersonating employees, not novel exploits.", "from": "#executive-summary", "quote": "using social engineering, cloned cellular phones, sniffers and hacker software"}
      - {"text": "His 68 months was then the longest sentence any computer hacker had received, yet restitution was a nominal sum over $4,125.", "from": "#executive-summary", "quote": "restitution was set at a nominal sum of just over $4,125 against victim claims in the hundreds of millions"}
      - {"text": "The record is narrower than the legend: the 1994 IP-spoofing attack on Shimomura is not part of any charge in the records opened here.", "from": "#executive-summary", "quote": "the 1994 IP-spoofing attack on Shimomura, is not described as part of any charge in the records opened here"}
  case-studies/FANCY_BEAR_GOES_PHISHING_CASES.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The book's thesis: cybercrime has less to do with defective programming than with the faulty wiring of psyches and society.", "from": "#executive-summary", "quote": "cybercrime has less to do with defective programming than with the faulty wiring of psyches and society"}
      - {"text": "It tells the story through five cases: the Morris worm, the Dark Avenger, a 2005 phone break-in, the 2016 DNC intrusions, and Mirai.", "from": "#executive-summary", "quote": "the Morris worm of 1988, the Bulgarian virus writer known as the Dark Avenger, the 2005 break-in to a celebrity's phone, the 2016 intrusions at the Democratic National Committee (DNC), and the Mirai botnet of 2016"}
      - {"text": "This study does not retell the book; it goes to the primary record behind each chapter.", "from": "#executive-summary", "quote": "This study does not retell the book"}
      - {"text": "The DNC record it checks includes the July 2018 indictment of twelve GRU officers and the Special Counsel's report.", "from": "#executive-summary", "quote": "the July 2018 indictment of twelve GRU officers, the Special Counsel's report, the DHS and FBI GRIZZLY STEPPE report and the CrowdStrike DNC report"}
  case-studies/HACKER_AND_THE_STATE_CASES.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The book argues states hack less to send messages than to change the balance of power, day after day, in peacetime.", "from": "#executive-summary", "quote": "states hack less to send messages than to change the balance of power, day after day, in peacetime"}
      - {"text": "A House report traces the theft of 21.5 million background-investigation records from OPM back to a first intrusion in July 2012.", "from": "#executive-summary", "quote": "the theft of 21.5 million background-investigation records and 5.6 million fingerprints from the US Office of Personnel Management (OPM) back to a first intrusion in July 2012"}
      - {"text": "Mandiant watched APT1, which it assessed to be a Chinese military unit, compromise 141 organizations across 20 industries.", "from": "#executive-summary", "quote": "Mandiant watched one group, which it named APT1 and assessed to be a Chinese military unit, compromise 141 organizations across 20 industries"}
      - {"text": "An FBI affidavit ties the same North Korean operators to Sony in 2014, the Bangladesh Bank theft in 2016, and WannaCry in 2017.", "from": "#executive-summary", "quote": "the same North Korean operators most likely phished their way into Sony Pictures Entertainment in September 2014 and wiped its computers that November, stole about $81 million from Bangladesh Bank in 2016 and released WannaCry in 2017"}
  case-studies/CYBERCRIME_FOUR_BOOKS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Four reading-list books tell the story of the criminal and activist internet before ransomware and state espionage took the headlines.", "from": "#executive-summary", "quote": "Four books on the library's reading list tell the story of the criminal and activist internet before ransomware and state espionage took over the headlines"}
      - {"text": "Together they cover about 30 years, from the Legion of Doom in 1984 to Hector Monsegur's sentencing in 2014.", "from": "#executive-summary", "quote": "Together they cover about 30 years, from the Legion of Doom in 1984 to Hector Monsegur's sentencing in 2014"}
      - {"text": "This study rebuilds each story from the primary record and grades a claim Reported only where the record is silent.", "from": "#executive-summary", "quote": "This study rebuilds each story from that record first, and grades a claim Reported, attributed to the book or the press outlet by name, only where the record is silent"}
      - {"text": "The record largely supports the books on what happened and corrects them on several numbers.", "from": "#executive-summary", "quote": "The result largely supports the books on what happened and corrects them on several numbers"}
  case-studies/ZERO_DAY_MARKET_EVENTS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The study traces how software flaws became a traded commodity, and what happened when the stock escaped.", "from": "#executive-summary", "quote": "how software flaws became a traded commodity, and what happened when the stock escaped"}
      - {"text": "It takes the events Perlroth's book is said to cover and checks each against the primary record.", "from": "#executive-summary", "quote": "It takes the events that the book's reviewers and publisher say it covers, and checks each one against the primary record"}
      - {"text": "The book itself was not opened; nothing here states its claims unless a review or the publisher says so.", "from": "#executive-summary", "quote": "The book itself was not opened for this study"}
      - {"text": "What the study shows is the record underneath the book's events, which is unusually rich.", "from": "#executive-summary", "quote": "What the study can show is the record underneath the book's events, which is unusually rich"}
  case-studies/NSA_CIA_TOOL_LEAKS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The people who paid were patients: the UK found at least 81 of 236 NHS trusts infected by WannaCry.", "from": "#executive-summary", "quote": "the UK National Audit Office found at least 81 of the 236 NHS trusts in England and 603 other NHS organisations, 595 of them GP practices, infected by WannaCry"}
      - {"text": "A US grand jury says a health system, shipping firm and drug maker lost nearly $1 billion to NotPetya six weeks after WannaCry.", "from": "#executive-summary", "quote": "a US grand jury says lost nearly $1 billion between them to NotPetya six weeks later"}
      - {"text": "The Shadow Brokers began posting stolen NSA-linked tools on 13 August 2016 and later released a Windows exploit set.", "from": "#executive-summary", "quote": "A group calling itself the Shadow Brokers began posting on 13 August 2016"}
      - {"text": "Over the same months WikiLeaks published Vault 7 and Vault 8 from the CIA's Center for Cyber Intelligence.", "from": "#executive-summary", "quote": "WikiLeaks published Vault 7 and Vault 8, internal material from the CIA's Center for Cyber Intelligence, starting on 7 March 2017"}
  case-studies/DOTCOM_ERA_CYBER_EVENTS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The era's biggest worms used flaws that already had a fix, from Code Red to Slammer to Blaster.", "from": "#executive-summary", "quote": "the era's biggest worms used flaws that already had a fix"}
      - {"text": "Melissa exploited no new vulnerability; it needed a person to open a document.", "from": "#executive-summary", "quote": "Melissa was not known to exploit any new vulnerability; it needed a person to open a document"}
      - {"text": "The speed outran human response: CAIDA measured Slammer reaching more than 90 percent of vulnerable hosts in about ten minutes.", "from": "#executive-summary", "quote": "Slammer reaching more than 90 percent of vulnerable hosts in about ten minutes"}
      - {"text": "Institutions we take for granted were assembled in response, including the CVE List, which launched in September 1999.", "from": "#executive-summary", "quote": "the CVE List launched in September 1999"}
  case-studies/PRE_INTERNET_THREATS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "By 1972 an Air Force study said experienced programmers had little difficulty penetrating off-the-shelf systems, and it defined the Trojan horse.", "from": "#executive-summary", "quote": "an Air Force planning study already said that experienced programmers had little difficulty penetrating off-the-shelf systems, and it defined the Trojan horse"}
      - {"text": "In 1979 Morris and Thompson found that 86 percent of the UNIX passwords they studied were short strings or dictionary words.", "from": "#executive-summary", "quote": "In 1979 Morris and Thompson found that 86 percent of the UNIX passwords they studied were short strings or dictionary words"}
      - {"text": "When the Morris worm ran in November 1988, two of its four ways in were trusted hosts and password guessing.", "from": "#executive-summary", "quote": "When the Morris worm ran in November 1988, two of its four ways in were trusted hosts and password guessing"}
      - {"text": "The study covers the thirty years from 1960, when the Bell System published its signaling, to 1990.", "from": "#executive-summary", "quote": "It covers the thirty years from 1960, when the Bell System published how its long-distance network signaled, to 1990"}
  case-studies/ECOMMERCE_THREATS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The target moved from the card file to the checkout page over twenty-seven years of online-store attacks.", "from": "#executive-summary", "quote": "the target moved from the card file to the checkout page"}
      - {"text": "The big breaches of 2005 to 2014 took card data from where it was stored or swiped, from TJX to Target and Home Depot.", "from": "#executive-summary", "quote": "The big breaches of 2005 to 2014 took card data from where it was stored or swiped: TJX's transaction systems, Heartland's processing network, Target's and Home Depot's point-of-sale terminals"}
      - {"text": "From 2018 the loss shifts to the browser, where a modified script copies what the shopper types.", "from": "#executive-summary", "quote": "From 2018 the loss shifts to the browser, where a modified script copies what the shopper types"}
      - {"text": "As chip cards cut in-person fraud in 2015 to 2016, remote card fraud rose from $3.40 billion to $4.57 billion.", "from": "#executive-summary", "quote": "as chip cards cut in-person fraud between 2015 and 2016, remote card fraud rose from $3.40 billion to $4.57 billion"}
  case-studies/CLOUD_SECURITY_INCIDENTS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The record tells a different story: cloud breaches were mostly failures in the band providers say always belongs to the customer.", "from": "#executive-summary", "quote": "mostly failures in the band that every major provider says always belongs to the customer: identities, access policy, configuration and data"}
      - {"text": "Mandiant found the 2024 Snowflake campaign came not from a Snowflake breach but from compromised customer credentials, mostly without MFA.", "from": "#executive-summary", "quote": "Mandiant found no evidence that the 2024 Snowflake campaign came from a breach of Snowflake's enterprise environment; every incident Mandiant responded to traced back to compromised customer credentials"}
      - {"text": "Google said the 2025 Salesloft Drift theft did not stem from a core Salesforce vulnerability.", "from": "#executive-summary", "quote": "Google's threat intelligence team said the 2025 Salesloft Drift theft did not stem from a core Salesforce vulnerability"}
      - {"text": "The study runs from the first documented credential incidents at a consumer cloud service in 2012 to the 2026 multi-tenant app compromises.", "from": "#executive-summary", "quote": "the first well-documented credential incidents at a consumer cloud service in 2012 to the multi-tenant application compromises of October and November 2026"}
  case-studies/HEALTHCARE_THREAT_WATCHLIST.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The HHS breach portal records cover about 702 million individual health records across 2023 to 2026.", "from": "#executive-summary", "quote": "covering about 702 million individual records in total"}
      - {"text": "One entry dominates: Change Healthcare, at 192,700,000 individuals.", "from": "#executive-summary", "quote": "One entry dominates: Change Healthcare, at 192,700,000 individuals"}
      - {"text": "After a December 2023 takedown, an ALPHV Blackcat administrator urged affiliates to target hospitals, and healthcare was hit most often.", "from": "#executive-summary", "quote": "an ALPHV Blackcat administrator urged affiliates to target hospitals"}
      - {"text": "State-linked groups are in the record too: North Korea's Andariel funds espionage through ransomware against US healthcare.", "from": "#executive-summary", "quote": "North Korea's Andariel unit funds espionage through ransomware against US healthcare"}
  case-studies/WATER_TREATMENT_NETWORKS.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Water is a sector the joint incident response guide calls target-rich and resource-poor.", "from": "#executive-summary", "quote": "Water is a sector the joint incident response guide calls target-rich and resource-poor"}
      - {"text": "The sector is large and mostly small: CISA counts about 152,000 public drinking water systems and more than 16,000 wastewater systems.", "from": "#executive-summary", "quote": "CISA counts about 152,000 public drinking water systems and more than 16,000 wastewater systems"}
      - {"text": "EPA states that more than 97 percent of public water systems serve 10,000 or fewer people.", "from": "#executive-summary", "quote": "EPA states that more than 97 percent of public water systems serve 10,000 or fewer people"}
      - {"text": "Federal cyber rules are thin: EPA's 2023 cybersecurity-assessment interpretation was withdrawn seven months later after legal challenges.", "from": "#executive-summary", "quote": "EPA's March 2023 interpretation of existing law to include cybersecurity assessments at drinking water systems was withdrawn seven months later after legal challenges"}
  case-studies/EQUIFAX_2017.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Equifax is compressed into one lesson, patch vulnerable software; that lesson is correct but incomplete.", "from": "#executive-summary", "quote": "Equifax is frequently compressed into a one-line lesson: patch vulnerable software. That lesson is correct but incomplete"}
      - {"text": "The real questions: why a vulnerability notice still left an app exposed, why a compromise reached unrelated data, and why monitoring stayed silent.", "from": "#executive-summary", "quote": "why an organization could distribute a critical vulnerability notice and still leave an exposed application vulnerable, why an application compromise could reach unrelated data, and why an installed monitoring control could remain ineffective"}
      - {"text": "The study treats patch deployment, asset ownership, service identity, data access, detection health and communication as independently testable controls.", "from": "#executive-summary", "quote": "It treats patch deployment, asset ownership, service identity, data access, detection health and incident communication as connected but independently testable controls"}
      - {"text": "A patch is one interruption point, not a substitute for limiting what an application can reach after compromise.", "from": "#executive-summary", "quote": "A patch is one interruption point. It is not a substitute for limiting what an application can reach after compromise"}
  case-studies/WANNACRY_2017.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "On 12 May 2017, ransomware with automated SMB propagation created an international emergency.", "from": "#executive-summary", "quote": "On 12 May 2017, ransomware with automated SMB propagation created an international emergency"}
      - {"text": "Microsoft connected the spread to vulnerabilities addressed by MS17-010, published on 14 March, two months earlier.", "from": "#executive-summary", "quote": "Microsoft's analysis connected the spread to vulnerabilities addressed by MS17-010, published on 14 March"}
      - {"text": "The lesson is not that a patch existed, but that the distance between a published remedy and verified protection can mean interrupted care.", "from": "#executive-summary", "quote": "the distance between a published remedy and verified protection can become the distance between normal work and interrupted care"}
      - {"text": "A defender needed to know which machines existed, which were reachable, who could change them, and what those changes would interrupt.", "from": "#executive-summary", "quote": "A defender needed to know which machines existed, which were reachable, who could change them, what those changes would interrupt"}
  case-studies/NOTPETYA_2017.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "On 27 June 2017, NotPetya turned a software-distribution relationship into a destructive international incident.", "from": "#executive-summary", "quote": "On 27 June 2017, NotPetya turned a software-distribution relationship into a destructive international incident"}
      - {"text": "Microsoft observed the legitimate M.E.Doc updater initiating malicious execution in a subset of infections.", "from": "#executive-summary", "quote": "Microsoft observed the legitimate M.E.Doc updater initiating malicious execution in a subset of infections"}
      - {"text": "Inside a network it spread using credentials and administrative facilities as well as vulnerable SMB services.", "from": "#executive-summary", "quote": "the malware could use credentials and administrative facilities as well as vulnerable SMB services"}
      - {"text": "It was not real ransomware: Kaspersky found the ransom screen's installation identifier could not carry what the decryption mechanism needed.", "from": "#executive-summary", "quote": "Kaspersky found that the disk ransom screen's installation identifier could not convey the information needed by the expected decryption mechanism"}
  case-studies/HEARTBLEED_2014.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Heartbleed was a memory-disclosure defect in certain OpenSSL releases, not a broken algorithm or one central breach.", "from": "#executive-summary", "quote": "It was a memory-disclosure defect in certain OpenSSL releases that created many separate exposure and recovery problems"}
      - {"text": "The April 2014 advisory described a missing bounds check that could reveal up to 64k of memory to a connected client or server.", "from": "#executive-summary", "quote": "a missing bounds check affecting the heartbeat implementation and potentially revealing up to 64k of memory to a connected client or server"}
      - {"text": "Patching did not invalidate a previously copied password, session credential or private key.", "from": "#executive-summary", "quote": "Installing a replacement did not invalidate a previously copied password, session credential or private key"}
      - {"text": "Cloudflare's deliberately vulnerable challenge produced successful private-key extractions, overturning its initial confidence.", "from": "#executive-summary", "quote": "Cloudflare's deliberately vulnerable challenge produced successful private-key extractions"}
  case-studies/SHELLSHOCK_2014.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Shellshock was a family of Bash vulnerabilities whose disclosure created an urgent, distributed response, not one intrusion.", "from": "#executive-assessment", "quote": "It was a family of Bash vulnerabilities whose disclosure created an urgent, distributed response"}
      - {"text": "Its importance is an unexpected trust boundary: data received by one program could become executable input in another.", "from": "#executive-assessment", "quote": "information received by one program could become executable input when passed into another"}
      - {"text": "The study distinguishes susceptible software from remotely reachable paths, and attempted exploitation from confirmed compromise.", "from": "#executive-assessment", "quote": "It distinguishes susceptible software from remotely reachable execution paths, attempted exploitation from confirmed compromise"}
      - {"text": "A worldwide vulnerability event can produce impressive telemetry without producing a trustworthy worldwide victim count.", "from": "#executive-assessment", "quote": "a worldwide vulnerability event can produce impressive telemetry without producing a trustworthy worldwide victim count"}
  case-studies/ETERNALBLUE_MS17_010_2017.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Microsoft published MS17-010 on 14 March 2017; the public EternalBlue exploit and May's WannaCry made the gap consequential.", "from": "#executive-assessment", "quote": "Microsoft published the bulletin on 14 March 2017"}
      - {"text": "A correction that exists in a catalog does not establish the state of a particular machine.", "from": "#executive-assessment", "quote": "A correction that exists in a catalog does not establish the state of a particular machine"}
      - {"text": "A check for one historical update identifier is a weak substitute for understanding the installed OS and its update history.", "from": "#executive-assessment", "quote": "why a check for one historical update identifier is a weak substitute for understanding the installed operating system and its update history"}
      - {"text": "A patch for one exploitation method does not remove every other route available to malware.", "from": "#executive-assessment", "quote": "a patch for one exploitation method does not remove every other route available to malware"}
  case-studies/MIRAI_DYN_2016.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The study examines the 2016 Mirai episode and the 21 October disruption involving DNS provider Dyn.", "from": "#executive-summary", "quote": "This study examines the 2016 Mirai episode and the October 21 disruption involving DNS provider Dyn"}
      - {"text": "Those who can prevent device recruitment may have no relationship with those who suffer the downstream outage.", "from": "#executive-summary", "quote": "The people who can prevent device recruitment may have no contractual relationship with the people who suffer the downstream outage"}
      - {"text": "The recommendation: stop your assets becoming attack infrastructure, and show critical services tolerate failures outside your control.", "from": "#executive-summary", "quote": "stop assets under your control from becoming attack infrastructure, and demonstrate that critical business services can tolerate failures outside your control"}
      - {"text": "A clean vulnerability scan of your servers does not answer whether your services survive an outage you do not control.", "from": "#executive-summary", "quote": "A clean vulnerability scan of your servers does not answer the second question"}
  case-studies/ANTHEM_2015.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The key question is how an initial foothold acquired enough authority to reach a consolidated repository of identity information.", "from": "#executive-assessment", "quote": "how an initial foothold can acquire enough authority to reach a consolidated repository of identity information"}
      - {"text": "A mature defense interrupts that progression at several points: endpoint, credential misuse, privileged access, bulk retrieval and exfiltration.", "from": "#executive-assessment", "quote": "endpoint compromise, credential misuse, privileged access, bulk retrieval and transfer outside the organization"}
      - {"text": "The data needs careful language: health-plan identifiers can be protected health information even without theft of clinical histories.", "from": "#executive-assessment", "quote": "Health-plan identifiers and other identity information can be protected health information even when the disclosed evidence does not establish theft of clinical histories"}
      - {"text": "Calling all the exposed information medical records can mislead readers about the actual categories.", "from": "#executive-assessment", "quote": "Describing all exposed information as medical records can mislead readers about the actual categories"}
  case-studies/TARGET_2013.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Target connects third-party access, internal trust boundaries, payment systems, detection decisions and remediation coverage.", "from": "#executive-assessment", "quote": "Target is a useful case because it connects third-party access, internal trust boundaries, payment systems, detection decisions and remediation coverage"}
      - {"text": "It is not explained by saying a vendor was compromised or a security product generated an alert.", "from": "#executive-assessment", "quote": "It is not adequately explained by saying that a vendor was compromised or that a security product generated an alert"}
      - {"text": "Familiar statistics mislead: payment-card accounts and people whose contact information was taken are different units with possible overlap.", "from": "#executive-assessment", "quote": "Payment-card accounts and individuals whose contact information was taken are different units with possible overlap"}
      - {"text": "The remediation lesson: an enterprise-wide action is only complete when its coverage and exceptions are known.", "from": "#executive-assessment", "quote": "an enterprise-wide action is only complete when its coverage and exceptions are known"}
  case-studies/OPM_2014_2015.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Vetting data combines identity, relationships and personal history, creating risks different from a routine contact-list exposure.", "from": "#executive-assessment", "quote": "Vetting information can combine identity, relationships and personal history in a way that creates risks different from a routine contact-list exposure"}
      - {"text": "Defenders must recognize sensitive data as an asset and distinguish removal of one foothold from complete containment.", "from": "#executive-assessment", "quote": "distinguish removal of one foothold from complete containment"}
      - {"text": "A successful action against an observed intruder does not establish that all access paths have been eliminated.", "from": "#executive-assessment", "quote": "A successful action against an observed intruder does not establish that all access paths have been eliminated"}
      - {"text": "The governance lesson: a control described as implemented may still have exceptions, missing coverage or ineffective operation.", "from": "#executive-assessment", "quote": "A control described as implemented may still have exceptions, missing coverage or ineffective operation"}
  case-studies/CAPITAL_ONE_2019.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The most transferable lesson is that valid credentials can be used in an invalid context.", "from": "#executive-assessment", "quote": "The most transferable lesson is that valid credentials can be used in an invalid context"}
      - {"text": "An identity system may correctly recognize a workload while the application under that identity has been induced to act against its owner's intent.", "from": "#executive-assessment", "quote": "An identity system may correctly recognize a workload while the application executing under that identity has been induced to do something its owner never intended"}
      - {"text": "That makes identity design a partner to input validation, not a substitute for it.", "from": "#executive-assessment", "quote": "That distinction makes identity design a partner to input validation, not a substitute for it"}
      - {"text": "Recovery is a data-management problem: responders must establish which records were read and who needs notification.", "from": "#executive-assessment", "quote": "How quickly can responders establish which records were read, which protections applied to those records, and which people require notification"}
  case-studies/YAHOO_2014_2016.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Yahoo is not just a large password list: it connects mass account data, admin capability, session trust and targeted intelligence collection.", "from": "#executive-assessment", "quote": "It connects mass account information, privileged account-management capability, persistent session trust, targeted intelligence collection and failures to translate technical knowledge into corporate decisions"}
      - {"text": "The 500 million accounts from the 2014 incident are not the same measurement as the three billion later attributed to the 2013 theft.", "from": "#executive-assessment", "quote": "The approximately 500 million accounts associated with the 2014 incident are not the same measurement as the approximately three billion accounts later attributed to the August 2013 theft"}
      - {"text": "Neither number is a count of unique people, confirmed identity-theft victims or mailboxes whose contents were all read.", "from": "#executive-assessment", "quote": "Neither number is a count of unique people, confirmed identity-theft victims or mailboxes whose contents were all read"}
      - {"text": "The study treats the 2014 incident as the main case and does not present a criminal indictment as a conviction of every defendant.", "from": "#executive-assessment", "quote": "It does not present a criminal indictment as a conviction of every defendant"}
  case-studies/MARRIOTT_STARWOOD_2018.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Starwood is a case of inherited risk: an acquisition changes ownership but does not remove an intruder or validate every privileged account.", "from": "#executive-summary", "quote": "It does not remove an intruder, validate every privileged account or make an older database's security properties known"}
      - {"text": "The numbers need definitions: the count moved from up to 500 million guests to about 383 million records as an upper bound.", "from": "#executive-summary", "quote": "The initial announcement discussed up to approximately 500 million guests. A later disclosure described approximately 383 million guest records as an upper bound"}
      - {"text": "In April 2024 Marriott amended its disclosure: card and some passport numbers were protected with SHA-1, not the previously described AES-128.", "from": "#executive-summary", "quote": "Marriott amended its older disclosure to say that payment-card numbers and some passport numbers in the involved tables had been protected using SHA-1 rather than the previously described AES-128"}
      - {"text": "Hashing and encryption are not synonyms, and a source correction must travel into derivative articles and slides.", "from": "#executive-summary", "quote": "Hashing and encryption are not synonyms, and a source correction must travel into derivative articles and slides"}
  case-studies/JPMORGAN_2014.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Contact information deserves protection even when no evidence shows passwords or account numbers were taken.", "from": "#executive-assessment", "quote": "contact information deserves serious protection even when an investigation finds no evidence that account passwords or account numbers were taken"}
      - {"text": "The value may lie in later deception rather than an immediate unauthorized withdrawal.", "from": "#executive-assessment", "quote": "The value may lie in later deception rather than an immediate unauthorized withdrawal"}
      - {"text": "The disclosures and the criminal record answer different questions; the latter describes a broader campaign across multiple organizations.", "from": "#executive-assessment", "quote": "The criminal record describes a broader campaign involving multiple organizations and fraud schemes"}
      - {"text": "A January 2021 announcement, naming the bank and Andrei Tyurin's plea, ties the earlier anonymized record to a primary source.", "from": "#executive-assessment", "quote": "official reports of Andrei Tyurin's 2019 guilty plea and 2021 sentence"}
  case-studies/SONY_PICTURES_2014.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The Sony Pictures attack combined destruction, theft, public exposure and coercive pressure in one incident.", "from": "#executive-assessment", "quote": "how a cyberattack can combine destruction, theft, public exposure and coercive pressure"}
      - {"text": "Disclosure of information creates a problem that cannot be undone by restoring a server, unlike the destruction.", "from": "#executive-assessment", "quote": "Disclosure of information creates a different problem that cannot be undone by restoring a server"}
      - {"text": "Threats against people and business partners added a safety and decision-making dimension beyond technical recovery.", "from": "#executive-assessment", "quote": "Threats against people and business partners add a safety and decision-making dimension that ordinary technical recovery plans may not address"}
      - {"text": "The public record supports strong statements about the disruption and the US government's attribution.", "from": "#executive-assessment", "quote": "The public record supports strong statements about the disruption and the U.S. government's attribution"}
  case-studies/EBAY_2014.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "An attacker used compromised employee credentials to enter the corporate environment, forcing a response across a large consumer marketplace.", "from": "#executive-assessment", "quote": "An attacker used compromised employee credentials to enter a corporate environment, while the resulting customer-data exposure forced a response across a very large consumer marketplace"}
      - {"text": "The company described a compromised authentication database and a broad password-change request.", "from": "#executive-assessment", "quote": "The company described a compromised authentication database and a broad password-change request"}
      - {"text": "Describing information as non-financial does not mean it is harmless.", "from": "#executive-assessment", "quote": "Describing information as non-financial does not mean it is harmless"}
      - {"text": "Describing passwords as encrypted does not identify an algorithm or establish their resistance to guessing.", "from": "#executive-assessment", "quote": "Describing passwords as encrypted does not, by itself, identify an algorithm or establish the resistance of the stored representation to guessing"}
  case-studies/CLOUD_HOPPER_APT10.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "A managed-service provider's compromise reaches its customers: the customer's security boundary includes the provider's identities, tools and practices.", "from": "#executive-summary", "quote": "The customer's security boundary includes the identities, tools and operating practices through which the provider performs its work"}
      - {"text": "The record describes an espionage campaign through managed-service providers and their customers, followed by attribution and criminal charges.", "from": "#executive-summary", "quote": "an espionage campaign involving managed-service providers and their customers, followed by government attribution and criminal charges"}
      - {"text": "Provider compromise can create customer exposure, but exposure, access and verified theft remain different findings.", "from": "#executive-summary", "quote": "provider compromise can create customer exposure, but exposure, access and verified theft remain different findings"}
      - {"text": "Recovery requires restoring the trust relationship, not merely cleaning the computer where the first alert appeared.", "from": "#executive-summary", "quote": "Recovery requires restoring the trust relationship, not merely cleaning the computer on which the first alert appeared"}
  case-studies/OPERATION_AURORA_2010.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Aurora is best studied as three problems: technical compromise, uncertainty about what was stolen, and the response when an intrusion meets user safety.", "from": "#executive-assessment", "quote": "three connected but different problems: technical compromise, uncertainty about the extent of stolen information, and an organization's response"}
      - {"text": "Reducing it to a browser vulnerability misses the enterprise consequences.", "from": "#executive-assessment", "quote": "Reducing it to a browser vulnerability misses the enterprise consequences"}
      - {"text": "The study reconstructs a deliberately bounded public record from Google, McAfee and Microsoft.", "from": "#executive-assessment", "quote": "This study reconstructs a deliberately bounded public record from Google, McAfee and Microsoft"}
      - {"text": "The central lesson: a patch can close a known entry condition without answering what an intruder already obtained.", "from": "#executive-assessment", "quote": "a patch can close a known entry condition without answering what an intruder already obtained"}
  case-studies/RSA_SECURID_2011.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "A supplier incident can affect your security without any malicious update: information at a trusted authentication supplier can itself help an adversary.", "from": "#executive-assessment", "quote": "Information held by a trusted authentication supplier can itself become useful to an adversary"}
      - {"text": "An organization does not have to receive a malicious software update for an incident at a supplier to affect its security assumptions.", "from": "#executive-assessment", "quote": "An organization does not have to receive a malicious software update for an incident at a supplier to affect its security assumptions"}
      - {"text": "The lesson: distinguish a control's normal operation from confidence in the assumptions that make the control valuable.", "from": "#executive-assessment", "quote": "distinguish a control's normal operation from confidence in the assumptions that make the control valuable"}
      - {"text": "An authentication system can continue to function while its assurance requires reassessment.", "from": "#executive-assessment", "quote": "An authentication system can continue to function while its assurance requires reassessment"}
  case-studies/DIGINOTAR_2011.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "A certificate can carry a valid signature while making an unauthorized claim about identity.", "from": "#executive-assessment", "quote": "A certificate can carry a valid signature while making an unauthorized claim about identity"}
      - {"text": "The record establishes a real CA compromise, fraudulent issuance, and abuse against Google users primarily in Iran.", "from": "#executive-assessment", "quote": "a real certificate-authority compromise, fraudulent issuance, abuse against Google users primarily in Iran"}
      - {"text": "Repairing a server does not undo credentials already distributed outside it.", "from": "#executive-assessment", "quote": "Repairing a server does not undo credentials already distributed outside it"}
      - {"text": "The most useful lesson is operational: distrust must be an executable capability.", "from": "#executive-assessment", "quote": "distrust must be an executable capability"}
  case-studies/BLUEKEEP_2019.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "BlueKeep shows why a vulnerability response should begin before a spectacular incident makes the news.", "from": "#executive-assessment", "quote": "a vulnerability response should begin before a spectacular incident makes the evening news"}
      - {"text": "The name identifies CVE-2019-0708, not a single malware family or one organization's breach.", "from": "#executive-assessment", "quote": "The name identifies CVE-2019-0708, not a single malware family or one organization's breach"}
      - {"text": "A vulnerable service, exposed endpoint, exploitation attempt, successful compromise and malicious payload are different states.", "from": "#executive-assessment", "quote": "A vulnerable service, an exposed endpoint, an exploitation attempt, a successful compromise and a malicious payload are different states"}
      - {"text": "The feared worm did not materialize: Microsoft described operator-driven activity and cryptocurrency-mining payloads instead.", "from": "#executive-assessment", "quote": "Microsoft's November investigation described operator-driven activity and cryptocurrency-mining payloads, not proof that the feared global worm had materialized"}
  case-studies/ZEROLOGON_2020.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Zerologon (CVE-2020-1472) threatened a central source of enterprise authority: Active Directory domain controllers.", "from": "#executive-assessment", "quote": "The vulnerability threatened a central source of enterprise authority: Active Directory domain controllers"}
      - {"text": "The response was more than a patch: understanding incompatible connections and moving to stronger enforcement.", "from": "#executive-assessment", "quote": "The response involved patching those systems, understanding incompatible connections and moving to stronger enforcement"}
      - {"text": "Primary records support actual malicious use in 2020 but give no worldwide victim total or single attacker identity.", "from": "#executive-assessment", "quote": "Primary records support actual malicious use in 2020, but they do not provide a complete worldwide victim total"}
      - {"text": "A deployment is incomplete if it delivers updated software while losing track of accounts still allowed weaker behavior.", "from": "#executive-assessment", "quote": "A deployment project is incomplete if it delivers updated software while losing track of the accounts still permitted to use weaker behavior"}
  case-studies/SPECTRE_MELTDOWN_2018.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Spectre and Meltdown were vulnerability disclosures and demonstrations of information leakage, not an incident like a ransomware deployment.", "from": "#executive-assessment", "quote": "They were vulnerability disclosures and demonstrations of information leakage"}
