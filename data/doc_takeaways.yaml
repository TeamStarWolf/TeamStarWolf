  case-studies/LEDGER_2020.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Protecting a security product and protecting the people who buy it are related but different responsibilities.", "from": "#executive-assessment", "quote": "protecting a security product and protecting the people who purchase it are related but different responsibilities"}
      - {"text": "A device can keep its technical boundary while commerce records expose its owner to deception, harassment or unwanted attention.", "from": "#executive-assessment", "quote": "A device can retain its intended technical boundary while commerce records expose its owner to deception, harassment or unwanted attention"}
