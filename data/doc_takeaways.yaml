    reviewed: "2026-11-17"
    items:
      - {"text": "The flaw was a mismatch between a site's apparent job and the authority of its image-processing backend.", "from": "#executive-assessment", "quote": "a dangerous mismatch between a web application's apparent job and the authority available to its image-processing backend"}
      - {"text": "Crafted uploads could run commands as the account invoking ImageMagick, consequential in affected workflows but not automatic admin everywhere.", "from": "#executive-assessment", "quote": "This was consequential remote execution in affected workflows, not an automatic claim of administrator privileges on every installation"}
      - {"text": "The core question is what a processing service can do with an untrusted object after accepting it.", "from": "#executive-assessment", "quote": "what a processing service can do with an untrusted object after accepting it"}
      - {"text": "Reports of malicious traffic did not establish which organizations were actually compromised.", "from": "#executive-assessment", "quote": "Contemporary reports of malicious traffic did not establish a complete list of successfully compromised organizations"}
  case-studies/MSHTML_CVE_2021_40444.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The component was reachable through a document's embedded-content machinery, so the risk went beyond whether macros were enabled.", "from": "#executive-assessment", "quote": "The relevant component could be reached through a document's embedded-content machinery, and the resulting security question extended beyond whether a user had enabled VBA macros"}
      - {"text": "An advisory, interim restrictions, and the September updates were not equivalent stages of response.", "from": "#executive-assessment", "quote": "Those stages were not equivalent"}
      - {"text": "Blocking one content path was not the same as correcting the vulnerable component.", "from": "#executive-assessment", "quote": "A temporary restriction on one content path was not a correction of the vulnerable component"}
      - {"text": "A later bypass claim was overstated; the corrected account says the attack worked only on unpatched systems.", "from": "#executive-assessment", "quote": "The correction says the attack succeeded only against unpatched Windows systems"}
  case-studies/PETITPOTAM_CVE_2021_36942.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "An authentication-coercion technique combined with weakly protected certificate enrollment could threaten an Active Directory environment.", "from": "#executive-assessment", "quote": "a Windows authentication-coercion technique could be combined with insufficiently protected certificate enrollment services to threaten an Active Directory environment"}
      - {"text": "The research tool's existence is not proof that every Windows domain is open to certificate-based compromise.", "from": "#executive-assessment", "quote": "it does not make the existence of the tool proof that every Windows domain is vulnerable to certificate-based compromise"}
      - {"text": "The patch was partial: it blocked one unauthenticated call while authenticated routes remained.", "from": "#executive-assessment", "quote": "it blocked the unauthenticated call exposed through LSARPC, while authenticated EFSRPC routes remained"}
      - {"text": "The correction and the service-hardening guidance each addressed different parts of the risk.", "from": "#executive-assessment", "quote": "The correction and the service-hardening guidance addressed different parts of the risk"}
  case-studies/QUADROOTER_2016.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Software close to the hardware can undermine app isolation, while the finder is often several handoffs from whoever ships the fix.", "from": "#executive-assessment", "quote": "software close to a device's hardware can undermine application isolation, while the organization that discovers the defect may be several handoffs away from the people who can deliver its correction"}
      - {"text": "The name grouped four Qualcomm-related flaws; it did not show every affected handset had been compromised.", "from": "#executive-assessment", "quote": "It did not identify a single malware family or demonstrate that every potentially affected handset had been compromised"}
      - {"text": "The headline 900 million figure was potential exposure, not an observed victim count.", "from": "#executive-assessment", "quote": "Its headline estimate of 900 million devices represented potential exposure, not an observed victim count"}
      - {"text": "Mobile response needs an auditable link between a specific issue, the actual device variant, and evidence the fix is running.", "from": "#executive-assessment", "quote": "mobile vulnerability response needs an auditable connection between a specific issue, the actual device variant and evidence of the running correction"}
  case-studies/STAGEFRIGHT_2015.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The shorthand name hides the key distinctions: original flaws, an incomplete fix, later findings, and hardening were related developments.", "from": "#executive-assessment", "quote": "were related developments rather than one identical flaw with one universal update"}
      - {"text": "The disclosure listed seven CVEs and estimated exposure, which were capability claims, not a census of compromised devices.", "from": "#executive-assessment", "quote": "Those were vulnerability and capability claims, not a census of compromised devices"}
      - {"text": "A shared media component receives content through many apps, and a source fix still has to reach the actual device.", "from": "#executive-assessment", "quote": "A shared media component could receive content through different applications, and a source correction still had to become a product update that reached the actual device"}
      - {"text": "A parser handling untrusted content should not hold more access than its task requires.", "from": "#executive-assessment", "quote": "A parser processing untrusted content should not possess more access than its task requires"}
  case-studies/XCODEGHOST_2015.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Malicious code entered through unofficial copies of the build tools, so a developer could ship code they never wrote.", "from": "#executive-assessment", "quote": "A developer could then produce an application containing code the developer had not intentionally written"}
      - {"text": "Distribution through an official store did not by itself reveal the earlier contamination.", "from": "#executive-assessment", "quote": "Distribution through an official store did not automatically reveal that earlier contamination"}
      - {"text": "Different telemetry counts of apps, versions, DNS queries, source IPs and customers measure different things and cannot be swapped.", "from": "#executive-assessment", "quote": "Counts of named applications, versions, DNS queries, source IPs and customers cannot be substituted for one another"}
      - {"text": "The account separates researcher observations from hypotheses and a litigant's proposed findings from a court's conclusions.", "from": "#executive-assessment", "quote": "It distinguishes researcher observations from hypotheses, supplier statements from independent validation, and a litigant's proposed findings from a court's conclusions"}
  case-studies/KERANGER_2016.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "Getting an app from its real download site with a valid code signature was not, by itself, assurance of safety.", "from": "#executive-assessment", "quote": "obtaining an application from its legitimate distribution site and seeing a valid code signature were not, together, a complete assurance of safety"}
      - {"text": "This was not a user grabbing an obvious fake; it was trust in a familiar project, a release artifact, and signed code.", "from": "#executive-assessment", "quote": "It is a story about the trust placed in a familiar project, a release artifact, and the platform's acceptance of signed code"}
      - {"text": "Distinct work addressed distribution, already-executed malware, and damaged data, which later summaries often blur.", "from": "#executive-assessment", "quote": "Which actions addressed distribution, which addressed already executed malware, and which addressed damaged data?"}
      - {"text": "The sources do not supply a verified worldwide infection count, total ransom revenue, or a definitive attacker identity.", "from": "#executive-assessment", "quote": "it does not supply a verified worldwide infection count, a total ransom revenue figure, or a definitive identity for the attacker"}
  case-studies/KEYDNAP_2016.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "An installer investigation can stop too early, removing the file while the account access tied to the computer stays unresolved.", "from": "#executive-assessment", "quote": "An organization discovers an unwanted application, removes it, and resumes work, while the account access associated with the affected computer remains unresolved"}
      - {"text": "The real question is not just whether a malicious file was present but what would justify trusting the device and its accounts again.", "from": "#executive-assessment", "quote": "It is what evidence would justify trusting the device, its accounts, and its software acquisition process again"}
      - {"text": "The sources do not establish a complete worldwide victim population, a definitive attacker identity, or every user's outcome.", "from": "#executive-assessment", "quote": "They do not establish a complete worldwide victim population, a definitive attacker identity, or every affected user's outcome"}
      - {"text": "Keeping the modern recommendations separate from the 2016 reporting prevents sensible advice from becoming invented facts.", "from": "#executive-assessment", "quote": "Keeping those sections separate from historical reporting prevents sensible modern recommendations from becoming invented facts about what happened in 2016"}
  case-studies/DRIDEX_ENFORCEMENT_2019.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The December 2019 action combined charges, sanctions, a reward and publicity, not a claim that every infection was removed.", "from": "#executive-assessment", "quote": "It was not an announcement that every Dridex infection had been removed or that every named defendant had been arrested"}
      - {"text": "Reading it requires separating what had happened, accusations awaiting adjudication, institutional assessments, and technical outcomes.", "from": "#executive-assessment", "quote": "Its central distinction is between actions that had actually occurred, accusations awaiting adjudication, institutional assessments and measured technical outcomes"}
      - {"text": "Authorities had achieved concrete disruption and an earlier conviction, then exposed more alleged participants.", "from": "#executive-assessment", "quote": "The authorities had achieved concrete disruption and a conviction in an earlier case"}
      - {"text": "Later sources describe the group adapting rather than permanently disappearing, each outcome tied to its own window.", "from": "#executive-assessment", "quote": "Subsequent sources describe adaptation rather than permanent disappearance"}
  case-studies/PROLOCK_2020.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The key questions are not answered by naming the final executable: predecessor, successor, intrusion paths and operator changes differ.", "from": "#executive-assessment", "quote": "the most important questions are not answered by identifying its final executable"}
      - {"text": "The criminal promise to reverse encryption could itself add more corruption to the files.", "from": "#executive-assessment", "quote": "the promise to reverse encryption could itself introduce additional corruption"}
      - {"text": "A damaged file might still keep a normal-looking beginning, hiding the loss.", "from": "#executive-assessment", "quote": "A damaged file might still retain a normal-looking beginning"}
      - {"text": "One ransomware name disappearing would not necessarily remove the access operations that had delivered it.", "from": "#executive-assessment", "quote": "the disappearance of one ransomware name would not necessarily remove the access operations that had delivered it"}
  case-studies/TEXAS_MUNICIPAL_RANSOMWARE_2019.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "A regional incident is not just a bigger single-organization one: many governments can need help at once from the same provider.", "from": "#executive-assessment", "quote": "Multiple local governments can require help at the same time, depend on the same service provider, and compete for a limited pool of responders"}
      - {"text": "Here the coordination problem can matter as much as the malware itself.", "from": "#executive-assessment", "quote": "The coordination problem can become as important as the malware itself"}
      - {"text": "A careful account preserves distinctions like twenty-two versus twenty-three entities and an indictment versus a conviction.", "from": "#executive-assessment", "quote": "twenty-two versus twenty-three entities at different reporting stages, restoration of critical services versus complete normal operations, and an indictment versus a conviction"}
      - {"text": "Some earlier official source URLs returned not-found errors, a limit recorded rather than concealed.", "from": "#executive-assessment", "quote": "That limitation is recorded rather than concealed"}
  case-studies/NIST_AES_2000.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "The October 2000 Rijndael announcement was a selection decision, not the final publication of the federal standard.", "from": "#executive-assessment", "quote": "The announcement was a selection decision, not the final publication of the federal standard"}
      - {"text": "This is an advancement case: a public competition became a precise, interoperable specification weighing security with efficiency.", "from": "#executive-assessment", "quote": "Its importance lies in how a public technical competition became a precise interoperable specification"}
      - {"text": "Selection did not prove the losing finalists were broken or that every implementation of the winner was secure.", "from": "#executive-assessment", "quote": "It did not establish that losing finalists were broken, that every implementation of the winner was secure, or that encryption alone supplied all the properties a secure application needs"}
      - {"text": "In the three AES variants the numbers 128, 192 and 256 describe key lengths, while all use 128-bit blocks.", "from": "#executive-assessment", "quote": "the numbers 128, 192 and 256 in their names describe key lengths"}
  case-studies/NIST_ZERO_TRUST_2020.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "SP 800-207's value is not a new appliance but a neutral language for access when the network boundary no longer explains the work.", "from": "#executive-assessment", "quote": "It provided a technology-neutral language for discussing access to resources when the traditional inside-versus-outside network boundary no longer explains where people work, where applications run or which devices belong to the enterprise"}
      - {"text": "Its scope is an abstract architecture, deployment models and use cases, not one universal implementation plan.", "from": "#executive-assessment", "quote": "Its scope is an abstract architecture, deployment models and use cases, not one universal implementation plan"}
      - {"text": "For every action the essential question is what evidence justifies it on this resource and what component enforces the answer.", "from": "#executive-assessment", "quote": "what evidence justifies this action on this resource, and what component actually enforces the answer"}
      - {"text": "A workable design also needs a usable failure mode, not one that blocks essential work or silently grants broad access during an outage.", "from": "#executive-assessment", "quote": "An architecture that indiscriminately blocks essential work or silently grants broad access during an outage has not resolved the business problem merely because its diagram uses the correct terminology"}
  case-studies/TLS_1_0_1_1_DEPRECATION_2021.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "RFC 8996 in March 2021 formally deprecated TLS 1.0 and TLS 1.1, along with DTLS 1.0.", "from": "#executive-assessment", "quote": "formally deprecated TLS 1.0 and TLS 1.1, along with DTLS 1.0"}
      - {"text": "It was a standards decision, not evidence that every deployed service stopped accepting old connections that month.", "from": "#executive-assessment", "quote": "The document was a standards decision, not evidence that every deployed service stopped accepting old connections that month"}
      - {"text": "Several vendors announced coordinated retirement in 2018, then revised schedules or split disablement from removal.", "from": "#executive-assessment", "quote": "several vendors announced coordinated retirement plans in 2018, then revised schedules or distinguished disablement from removal"}
      - {"text": "Compressing it all into a single end-date claim misstates both the technology and the operational history.", "from": "#executive-assessment", "quote": "misstates both the technology and the operational history"}
