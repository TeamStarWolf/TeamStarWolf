  case-studies/PULSE_SECURE_CVE_2019_11510.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "CVE-2019-11510 made a remote-access appliance a potential source of authentication material via unauthenticated arbitrary file reading.", "from": "#executive-assessment", "quote": "CVE-2019-11510 made a remote-access security appliance a potential source of authentication material"}
