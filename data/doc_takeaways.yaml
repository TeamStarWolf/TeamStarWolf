      - {"text": "What it does not fix: it does not protect information after an endpoint receives it, establish a site is honest, or make repeated actions harmless.", "from": "#executive-assessment", "quote": "It does not automatically protect information after an endpoint receives it, establish that a website is honest, or make repeated application actions harmless"}
      - {"text": "Faster establishment introduces decisions about which data can safely arrive before the ordinary handshake finishes.", "from": "#executive-assessment", "quote": "Faster establishment also introduces decisions about which data can safely arrive before the ordinary handshake finishes"}
  case-studies/WEBAUTHN_2019.md:
    reviewed: "2026-11-17"
    items:
      - {"text": "WebAuthn's significance is changing how a service authenticates a user, reducing dependence on reusable secrets people can disclose to an impostor.", "from": "#executive-assessment", "quote": "the opportunity to change how an online service authenticates a user, reducing dependence on reusable secrets that people can disclose to an impostor"}
