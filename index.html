      function directMatches(q) {
        if (!ids) { return []; }
        var k = idKey(q);
        if (k && ids.ids[k] != null) { return [{ id: k, route: ids.ids[k] }]; }
        var name = q.trim().toLowerCase().replace(/\s+/g, ' ');
        return (ids.names[name] || []).filter(function (i) { return ids.ids[i] != null; })
          .map(function (i) { return { id: i, route: ids.ids[i], name: q.trim() }; });
      }
      function kindOfRoute(route) { return DIR_KIND[route.replace(/[^\/]*$/, '')] || 'Page'; }
      function routeHref(route) { return '#/' + route; }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
      }
      function setStatus(html) { status.innerHTML = html || ''; }
      function fallbackHtml(q) {
        var gh = 'https://github.com/search?type=code&q=' + encodeURIComponent('repo:TeamStarWolf/TeamStarWolf ' + q);
        return 'Full-text search is not available on this copy of the site: its index is built by the deploy workflow. ' +
          'Try the <a href="#/INDEX">reference index</a> or <a href="' + esc(gh) + '" target="_blank" rel="noopener">search the repository on GitHub</a>.';
      }
      // Pagefind escapes < and > in the indexed text and wraps matches in <mark>; let
      // nothing else through.
      function excerptHtml(x) { return String(x || '').replace(/<(?!\/?mark>)/g, '&lt;'); }

      // ---------- open and close
      function open(from) {
        if (!root.hidden) { input.focus(); input.select(); return; }
        opener = from || document.activeElement;
        root.hidden = false;
        document.body.classList.add('tsw-search-active');
        input.focus(); input.select();
        loadIds().then(function () { if (st.q) { run(); } });
        loadPagefind();
        if (input.value.trim()) { run(); }
      }
      function close(restore) {
        if (root.hidden) { return; }
        root.hidden = true;
        document.body.classList.remove('tsw-search-active');
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        if (restore !== false && opener && opener !== document.body && opener.focus && document.contains(opener)) { opener.focus(); }
        if (document.activeElement && root.contains(document.activeElement)) { document.activeElement.blur(); }
        opener = null;
      }
      function go(hash) {
        if (!hash) { return; }
        close(false);
        if (location.hash === hash) { window.scrollTo(0, 0); return; }
        location.hash = hash;
      }

      // ---------- search
      function run() {
        var q = input.value.trim(), my = ++seq;
        st.q = q; st.active = -1;
        if (!q) { st.results = []; st.items = []; st.shown = 0; st.direct = []; st.kinds = null; render(); setStatus(''); return; }
        st.direct = directMatches(q);
        if (!pf) {
          st.results = []; st.items = []; st.shown = 0; st.kinds = null;
          render();
          if (pfFailed) { setStatus(fallbackHtml(q)); }
          else { setStatus('Loading the search index'); loadPagefind().then(function () { if (my === seq) { run(); } }); }
          return;
        }
        var opts = st.kind ? { filters: { kind: [st.kind] } } : {};
        pf.search(q, opts).then(function (res) {
          if (my !== seq || !res) { return; }
          st.results = res.results; st.items = []; st.shown = 0;
          st.kinds = res.totalFilters && res.totalFilters.kind ? res.totalFilters.kind : null;
          return more(my);
        }).catch(function () { if (my === seq) { setStatus('Search failed. Reload the page and try again.'); } });
      }
      function more(my) {
        var next = st.results.slice(st.shown, st.shown + PAGE);
        return Promise.all(next.map(function (r) { return r.data(); })).then(function (data) {
          if (my !== seq) { return; }
          st.shown += next.length;
          data.forEach(function (d) {
            var m = d.meta || {};
            st.items.push({
              href: '#' + (d.url.split('#')[1] || '/'),
              title: m.title || d.url, kind: m.kind || 'Page', section: m.section || '',
              excerpt: d.excerpt || '', summary: m.summary || ''
            });
          });
          render();
          setStatus(st.results.length || st.direct.length ? '' :
            'No pages match "' + esc(st.q) + '". Try a technique ID (T1059), a tool, a control, or a concept.');
        });
      }

      // ---------- render: direct matches first, then the loaded results grouped by kind
      function render() {
        list.textContent = '';
        renderChips();
        var groups = [], byKind = {}, seen = {}, idx = 0;
        var direct = st.direct.map(function (d) {
          var it = { href: routeHref(d.route), title: d.id, kind: kindOfRoute(d.route),
                     section: d.name ? 'Name match: ' + d.name : 'ID match', excerpt: '', summary: '' };
          st.items.forEach(function (x) {
            if (x.href === it.href) {
              it.title = x.title; it.excerpt = x.excerpt; it.summary = x.summary;
              it.section = x.section + (d.name ? ' (name match: ' + d.name + ')' : '');
            }
          });
          seen[it.href] = true;
          return it;
        });
        if (direct.length) { groups.push({ label: direct.length > 1 ? 'Matching names' : 'Direct match', items: direct }); }
        st.items.forEach(function (it) {
          if (seen[it.href]) { return; }
          if (!byKind[it.kind]) { byKind[it.kind] = { label: it.kind, items: [] }; groups.push(byKind[it.kind]); }
          byKind[it.kind].items.push(it);
        });
        groups.forEach(function (g, gi) {
          var box = document.createElement('div');
          box.className = 'tsw-search-group'; box.setAttribute('role', 'group');
          var lab = document.createElement('div');
          lab.className = 'tsw-search-group-label'; lab.id = 'tsw-sg-' + gi; lab.setAttribute('role', 'presentation');
          lab.textContent = g.label;
          box.setAttribute('aria-labelledby', lab.id);
          box.appendChild(lab);
          g.items.forEach(function (it) {
            var a = document.createElement('a');
            a.setAttribute('role', 'option'); a.id = 'tsw-so-' + (idx++); a.href = it.href; a.tabIndex = -1;
            a.setAttribute('aria-selected', 'false');
            var t = document.createElement('span'); t.className = 'tsw-search-title'; t.textContent = it.title;
            var s = document.createElement('span'); s.className = 'tsw-search-section';
            s.textContent = g.label === it.kind ? it.section : it.kind + (it.section ? ' | ' + it.section : '');
            a.appendChild(t); a.appendChild(s);
            if (it.excerpt || it.summary) {
              var x = document.createElement('span'); x.className = 'tsw-search-excerpt';
              if (it.excerpt.indexOf('<mark>') !== -1) { x.innerHTML = excerptHtml(it.excerpt); }
              else { x.textContent = it.summary || it.excerpt.replace(/<\/?mark>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>'); }
              a.appendChild(x);
            }
            box.appendChild(a);
          });
          list.appendChild(box);
        });
        if (st.shown < st.results.length) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'tsw-search-more';
          b.textContent = 'Show more results (' + (st.results.length - st.shown) + ' more)';
          b.addEventListener('click', function () {
            var keep = st.active;
            more(seq).then(function () { setActive(Math.max(keep, 0)); input.focus(); });
          });
          list.appendChild(b);
        }
        var any = list.querySelector('[role="option"]');
        input.setAttribute('aria-expanded', any ? 'true' : 'false');
        setActive(any ? 0 : -1);
      }
      function renderChips() {
        chips.textContent = '';
        if (!st.kinds || !st.q) { return; }
        var kinds = Object.keys(st.kinds).filter(function (k) { return st.kinds[k] > 0; })
          .sort(function (a, b) { return st.kinds[b] - st.kinds[a]; });
        if (kinds.length < 2 && !st.kind) { return; }
        var all = 0;
        kinds.forEach(function (k) { all += st.kinds[k]; });
        [''].concat(kinds).forEach(function (k) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = (k || 'All') + ' ' + (k ? st.kinds[k] : all);
          b.setAttribute('aria-pressed', st.kind === k ? 'true' : 'false');
          b.addEventListener('click', function () { st.kind = (st.kind === k ? '' : k); run(); input.focus(); });
          chips.appendChild(b);
        });
      }

      // ---------- keyboard: focus stays in the input; Up and Down move the active result
      function options() { return Array.prototype.slice.call(list.querySelectorAll('[role="option"]')); }
      function setActive(i) {
        var opts = options();
        opts.forEach(function (o) { o.setAttribute('aria-selected', 'false'); });
        st.active = (i >= 0 && i < opts.length) ? i : -1;
        if (st.active < 0) { input.removeAttribute('aria-activedescendant'); return; }
        var o = opts[st.active];
        o.setAttribute('aria-selected', 'true');
        input.setAttribute('aria-activedescendant', o.id);
        if (o.scrollIntoView) { o.scrollIntoView({ block: 'nearest' }); }
      }

      input.addEventListener('input', function () {
        clearTimeout(timer);
        var q = input.value.trim();
        if (pf && q) { pf.preload(q); }
        timer = setTimeout(run, 120);
      });
      input.addEventListener('keydown', function (e) {
        var opts = options();
        if (e.key === 'ArrowDown') { e.preventDefault(); if (opts.length) { setActive(st.active < opts.length - 1 ? st.active + 1 : 0); } }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (opts.length) { setActive(st.active > 0 ? st.active - 1 : opts.length - 1); } }
        else if (e.key === 'Enter') {
          e.preventDefault();
          clearTimeout(timer);
          var q = input.value.trim();
          if (!q) { return; }
          if (q !== st.q || !ids) {
            // An ID or an exact name opens its page before the results arrive. On the first
            // open, wait for ids.json, so Enter right after typing T1059 still opens T1059.
            loadIds().then(function () {
              if (root.hidden || input.value.trim() !== q) { return; }
              var d = directMatches(q);
              if (d.length === 1) { go(routeHref(d[0].route)); return; }
              var o = options();
              if (q === st.q && o.length) { go((o[st.active] || o[0]).getAttribute('href')); } else { run(); }
            });
            return;
          }
          var a = opts[st.active] || opts[0];
          if (a) { go(a.getAttribute('href')); }
        }
      });
      list.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[role="option"]');
        if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) { return; }
        e.preventDefault(); go(a.getAttribute('href'));
      });
      list.addEventListener('mousemove', function (e) {
        var a = e.target.closest && e.target.closest('a[role="option"]');
        if (a) { var i = options().indexOf(a); if (i !== st.active) { setActive(i); } }
      });
      root.querySelector('.tsw-search-backdrop').addEventListener('click', function () { close(); });
      root.querySelector('.tsw-search-close').addEventListener('click', function () { close(); });
      // Escape closes; Tab stays inside the dialog
      dialog.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
        if (e.key !== 'Tab') { return; }
        var f = Array.prototype.slice.call(dialog.querySelectorAll('input, button, a[href]:not([role="option"])'))
          .filter(function (el) { return el.offsetParent !== null; });
        if (!f.length) { return; }
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });
      window.addEventListener('hashchange', function () { close(false); });

      // "/" or Ctrl+K (Cmd+K on macOS) opens search from anywhere on the page
      document.addEventListener('keydown', function (e) {
        var el = document.activeElement;
        var typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
        if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'k' || e.key === 'K')) {
          e.preventDefault();
          if (root.hidden) { open(); } else { close(); }
        } else if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && root.hidden) {
          e.preventDefault(); open();
        }
      });
      // The cover's Search button (its href, the reference index, is the fallback without
      // scripts), the box at the top of the sidebar and the small-screen top-bar button
      document.addEventListener('click', function (e) {
        var t = e.target.closest && e.target.closest('.tsw-cover-search, .tsw-search-open, #tsw-search-btn');
        if (!t) { return; }
        e.preventDefault(); open(t);
      });
    })();
  </script>
</body>
</html>
