<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="An open cybersecurity reference library for defenders and learners, with references, how-to guides, learning paths, and published data.">
  <meta name="theme-color" content="#0a0a12">
  <meta property="og:title" content="TeamStarWolf: Cybersecurity Reference Library">
  <meta property="og:description" content="An open cybersecurity reference library for the community: references, how-to guides, and learning paths for defenders and learners, plus published mapping data.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://teamstarwolf.github.io/TeamStarWolf/">
  <meta property="og:site_name" content="TeamStarWolf">
  <!-- One card for every shared link: docsify serves a single index.html for all routes.
       Exported by scripts/build_brand_assets.py; og:image must be an absolute URL. -->
  <meta property="og:image" content="https://teamstarwolf.github.io/TeamStarWolf/assets/brand/og-1200x630.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The STARWOLF 64 logotype, with a red and white wolf head, on a dark navy background">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://teamstarwolf.github.io/TeamStarWolf/assets/brand/og-1200x630.jpg">
  <title>TeamStarWolf: Cybersecurity Reference Library</title>
  <!-- Interim icon: the red "64" star cut from the STARWOLF 64 logotype (scripts/build_brand_assets.py). -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon-180.png">
  <!-- Theme before first paint: a stored choice (this browser only), else the system preference,
       else dark. The key is namespaced because ATT&CK-Navi shares this origin's localStorage. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('tsw-library-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" integrity="sha384-jCK82M2ExfkqAO/MYBKMjP1qC4AvZ4/Duf2gVWOy3RPn26uz+KW5I+9S39za1Fqv" crossorigin="anonymous">

  <style>
    /* ===================== Brand tokens =====================
       The Radar design system: dark-first ink with a violet cast, the wolf insignia's purple
       as the one signal colour. The values follow assets/design/tokens.css, a copy of the
       TeamStarWolf.com site package, which is the source of truth (a token change lands there
       first, then here). Dark is the default; the light theme is chosen by the toggle (stored
       per browser) or, until a reader picks one, by prefers-color-scheme. Every
       text/background pair below is measured by scripts/check_contrast.py (WCAG 2.x ratios;
       CI fails under AA). Components use these tokens only: no colour literals below this
       block, except the cover banners. */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --tsw-bg:            #0a0a12;
      --tsw-bg-alt:        #11111c;
      --tsw-surface:       #11111c;
      --tsw-surface-2:     #181827;
      --tsw-border:        #30304a;
      --tsw-border-soft:   #22223a;
      --tsw-sidebar-bg:    #0a0a12;
      --tsw-nav-bg:        rgba(10, 10, 18, .74);   /* the glass */
      --tsw-glass:         rgba(10, 10, 18, .74);

      --tsw-text:          #ecebf5;
      --tsw-text-muted:    #c4c2d6;
      --tsw-text-dim:      #8f8da6;
      --tsw-heading:       #ecebf5;
      --tsw-link:          #b794ff;   /* the accent */
      --tsw-link-hover:    #d2a0ff;

      --tsw-red:           #ff6b6b;
      --tsw-red-text:      #ff6b6b;
      --tsw-green:         #7fc48f;
      --tsw-cream:         #ecebf5;   /* the stage foreground */
      --tsw-focus:         #b794ff;
      --tsw-btn-bg:        #9b5cff;   /* the signal; ink text */
      --tsw-btn-bg-hover:  #a978ff;
      --tsw-btn-fg:        #0a0a12;

      --tsw-wolf-hi:       #d2a0ff;   /* the insignia gradient, top to bottom */
      --tsw-wolf-1:        #a63bff;
      --tsw-wolf-2:        #7a16e6;

      --tsw-tint:          rgba(183, 148, 255, .08);
      --tsw-tint-strong:   rgba(183, 148, 255, .14);
      --tsw-row-alt:       rgba(255, 255, 255, .022);
      --tsw-row-hover:     rgba(183, 148, 255, .07);
      --tsw-selection:     rgba(155, 92, 255, .30);
      --tsw-shadow:        rgba(0, 0, 0, .5);
      --tsw-glow-a:        rgba(166, 59, 255, .12);
      --tsw-glow-b:        rgba(122, 22, 230, .05);
      --tsw-backdrop:      rgba(4, 4, 10, .74);    /* behind the search overlay */

      --tsw-code-bg:       #181827;
      --tsw-code-fg:       #c4c2d6;
      --tsw-code-border:   #30304a;
      --tsw-pre-bg:        #0a0a12;
      --tsw-pre-fg:        #ecebf5;
      --tsw-tok-comment:   #8f8da6;
      --tsw-tok-keyword:   #b794ff;
      --tsw-tok-string:    #7fc48f;
      --tsw-tok-number:    #e0a84f;
      --tsw-tok-function:  #d2a0ff;
      --tsw-tok-tag:       #ff6b6b;
      --tsw-tok-operator:  #c4c2d6;

      /* The brand stage: black, with the insignia's violet as a radial glow */
      --tsw-cover-bg:      radial-gradient(1100px 620px at 50% -10%, #2a0f45 0%, #000000 62%);
      --tsw-cover-title:   var(--tsw-cream);
      --tsw-scroll:        #30304a;
      --tsw-scroll-hover:  #44445f;

      --theme-color:       var(--tsw-link);
      --sidebar-width:     305px;
      --tsw-mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
      --tsw-sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Light: the Radar light values. The wolf tokens are the same in both themes. */
    :root[data-theme="light"] {
      color-scheme: light;
      --tsw-bg:            #f4f3fa;
      --tsw-bg-alt:        #e9e7f3;
      --tsw-surface:       #ffffff;
      --tsw-surface-2:     #e9e7f3;
      --tsw-border:        #bfbbd3;
      --tsw-border-soft:   #d8d5e6;
      --tsw-sidebar-bg:    #e9e7f3;
      --tsw-nav-bg:        rgba(244, 243, 250, .8);
      --tsw-glass:         rgba(244, 243, 250, .8);

      --tsw-text:          #15131f;
      --tsw-text-muted:    #302c3f;
      --tsw-text-dim:      #5c5872;
      --tsw-heading:       #15131f;
      --tsw-link:          #5b21b6;
      --tsw-link-hover:    #6d28d9;

      --tsw-red:           #c0392b;
      --tsw-red-text:      #c0392b;
      --tsw-green:         #1f783b;   /* Radar #1f7a3c, one step darker for AA on #e9e7f3 */
      --tsw-focus:         #5b21b6;
      --tsw-btn-bg:        #6d28d9;
      --tsw-btn-bg-hover:  #5b21b6;
      --tsw-btn-fg:        #ffffff;

      --tsw-wolf-hi:       #d2a0ff;
      --tsw-wolf-1:        #a63bff;
      --tsw-wolf-2:        #7a16e6;

      --tsw-tint:          rgba(91, 33, 182, .06);
      --tsw-tint-strong:   rgba(91, 33, 182, .10);
      --tsw-row-alt:       rgba(21, 19, 31, .03);
      --tsw-row-hover:     rgba(91, 33, 182, .06);
      --tsw-selection:     rgba(91, 33, 182, .20);
      --tsw-shadow:        rgba(21, 19, 31, .14);
      --tsw-glow-a:        rgba(166, 59, 255, .05);
      --tsw-glow-b:        rgba(122, 22, 230, .03);
      --tsw-backdrop:      rgba(21, 19, 31, .45);

      --tsw-code-bg:       #e9e7f3;
      --tsw-code-fg:       #5b21b6;
      --tsw-code-border:   #d8d5e6;
      --tsw-pre-bg:        #faf9fd;
      --tsw-pre-fg:        #15131f;
      --tsw-tok-comment:   #5c5872;
      --tsw-tok-keyword:   #5b21b6;
      --tsw-tok-string:    #1f7a3c;
      --tsw-tok-number:    #9a6208;
      --tsw-tok-function:  #6d28d9;
      --tsw-tok-tag:       #c0392b;
      --tsw-tok-operator:  #302c3f;

      /* The light stage: check_contrast.py measures the cover tagline (--tsw-text-muted) on
         this background, and no one text colour reads at AA on both #f4f3fa and #000000,
         so the black stage is the dark theme's; the light cover keeps the violet glow. */
      --tsw-cover-bg:      radial-gradient(1100px 620px at 50% -10%, #efe6fd 0%, #f4f3fa 62%);
      --tsw-cover-title:   #15131f;
      --tsw-scroll:        #bfbbd3;
      --tsw-scroll-hover:  #a9a4c2;
    }

    html, body { background: var(--tsw-bg); }
    body {
      color: var(--tsw-text);
      font-family: var(--tsw-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* A faint violet glow so the ink field does not read as flat black */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 500px at 12% -8%, var(--tsw-glow-a), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, var(--tsw-glow-b), transparent 60%);
    }
    /* Lift the layout above the wash. Only z-index here: vue.css positions .content
       absolutely (left: 300px; right: 0), and forcing position: relative on it kept the
       300px offset but dropped right: 0, which pushed every desktop page 300px past the
       viewport. The mobile layout keeps its relative .content (see the 768px block). */
    .sidebar, .content, main { z-index: 1; }
    main { position: relative; }
    /* On a phone, main must not form a stacking context: docsify puts the menu button inside
       it, and a context at z-index 1 kept that button (and the opened sidebar) under the
       cover, so the landing screen showed no menu. The cover drops to z-index 2 there (set in
       the Responsive block, after the cover rule below), under the sidebar (10), the top bar
       (11, so an open sidebar scrolls under it) and the menu and theme buttons (30). */
    @media screen and (max-width: 768px) {
      main { position: static; z-index: auto; }
      .content { position: relative; }
    }

    /* ===================== Sidebar ===================== */
    .sidebar {
      background: var(--tsw-sidebar-bg);
      border-right: 1px solid var(--tsw-border-soft);
      padding-top: 0;
      /* Pin the sidebar out of document flow on the cover route. Without this, its
         full height (~8,000px of links) stacks between the cover and the homepage,
         leaving a void when scrolling. The cover paints above it (z-index below). */
      position: fixed; top: 0; bottom: 0; z-index: 10;
    }
    section.cover { position: relative; z-index: 20; }
    .sidebar > h1 {
      margin: 0; padding: 20px 22px 14px;
      border-bottom: 1px solid var(--tsw-border-soft);
      background: var(--tsw-tint);
    }
    .sidebar > h1 .app-name-link {
      color: var(--tsw-heading); font-weight: 800; font-size: 1.18rem;
      letter-spacing: -.015em; display: inline-flex; align-items: center; gap: .5rem;
    }
    .sidebar > h1 .app-name-link:hover { color: var(--tsw-link); }
    /* The wolf insignia: the #tsw-wolf symbol at the top of the body, filled with the
       #tsw-wolf-grad gradient from the three wolf tokens; the same path everywhere, at the
       artwork's own aspect ratio (viewBox 0 0 1181 633), never redrawn or cropped. */
    .tsw-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .tsw-g-hi { stop-color: var(--tsw-wolf-hi); }
    .tsw-g-1 { stop-color: var(--tsw-wolf-1); }
    .tsw-g-2 { stop-color: var(--tsw-wolf-2); }
    .tsw-mark { display: block; flex: none; width: 52px; height: 28px; }

    .sidebar ul li a {
      color: var(--tsw-text-muted);
      font-size: .875rem; line-height: 1.45;
      padding: 4px 0; border: 0;
      transition: color .13s ease, transform .13s ease;
    }
    .sidebar ul li a:hover { color: var(--tsw-link); transform: translateX(2px); }
    .sidebar ul li.active > a {
      color: var(--tsw-green) !important;
      font-weight: 650;
      border-right: 2px solid var(--tsw-green);
    }
    /* docsify wraps every sidebar item in <p>; keep those neutral */
    .sidebar ul li p {
      margin: 0;
      text-transform: none;
      font-size: inherit;
      letter-spacing: normal;
      color: inherit;
    }
    /* Group labels: the plain-text items in _sidebar.md ("Guides (How-To)", "Disciplines",
       "Coverage & Data" ...). docsify renders each as a bare text node in a top-level <li>,
       with no <p> or <strong> around it, so the label style sits on the <li> itself and the
       links and nested lists under it are reset. Without the colour here the labels kept
       vue.css's #364149, which is 1.80:1 on the dark sidebar. */
    .sidebar ul li { color: var(--tsw-text-dim); }
    .sidebar-nav > ul > li {
      font-family: var(--tsw-mono); font-size: .705rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
    }
    .sidebar-nav > ul > li > a,
    .sidebar-nav > ul > li > ul {
      font-family: var(--tsw-sans); font-size: .875rem; font-weight: 400;
      text-transform: none; letter-spacing: normal;
    }
    .sidebar hr { border-color: var(--tsw-border-soft); margin: 14px 0; }
    .sidebar::-webkit-scrollbar { width: 9px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--tsw-scroll); border-radius: 9px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background: var(--tsw-scroll-hover); }
    .sidebar-toggle { background: var(--tsw-sidebar-bg); color: var(--tsw-link); }
    .sidebar-toggle span { background-color: var(--tsw-link); }
    body.close .sidebar-toggle { background-color: transparent; }

    /* ===================== Search =====================
       A full-width overlay over the whole library (the search script at the end of this
       file), opened with "/", Ctrl+K (Cmd+K), the sidebar box, the cover button or the
       search button in the top bar on small screens. Full screen at 768px and below. */
    .tsw-search-open {
      display: flex; align-items: center; gap: .55rem;
      width: calc(100% - 32px); margin: 14px 16px 12px; box-sizing: border-box;
      padding: 9px 10px 9px 12px; border-radius: 8px; cursor: pointer;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border);
      color: var(--tsw-text-dim); font: inherit; font-size: .875rem; text-align: left;
      transition: border-color .15s;
    }
    .tsw-search-open:hover { border-color: var(--tsw-link); }
    .tsw-search-open svg { width: 16px; height: 16px; flex: none; }
    .tsw-search-open span { flex: 1; }
    .tsw-search-open kbd, .tsw-search-foot kbd, .tsw-search-close {
      font-family: var(--tsw-mono); font-size: .72rem; line-height: 1; padding: .25em .4em;
      border: 1px solid var(--tsw-border); border-radius: 6px; color: var(--tsw-text-muted);
      background: var(--tsw-surface);
    }
    .sidebar .tsw-search-open { margin-bottom: 12px; }

    .tsw-search[hidden] { display: none; }
    .tsw-search { position: fixed; inset: 0; z-index: 200; }
    .tsw-search-backdrop { position: absolute; inset: 0; background: var(--tsw-backdrop); }
    .tsw-search-dialog {
      position: relative; margin: 8vh auto 0; width: min(760px, calc(100% - 32px));
      max-height: 80vh; display: flex; flex-direction: column; box-sizing: border-box;
      background: var(--tsw-surface); color: var(--tsw-text);
      border: 1px solid var(--tsw-border); border-radius: 10px;
      box-shadow: 0 10px 28px var(--tsw-shadow); overflow: hidden;
    }
    .tsw-search-head {
      display: flex; align-items: center; gap: .6rem; padding: 12px 14px;
      border-bottom: 1px solid var(--tsw-border-soft);
    }
    .tsw-search-head > svg { width: 20px; height: 20px; flex: none; color: var(--tsw-text-dim); }
    .tsw-search-head input {
      flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
      color: var(--tsw-text); font: inherit; font-size: 1.05rem; padding: 6px 0;
    }
    .tsw-search-head input::placeholder { color: var(--tsw-text-dim); opacity: 1; }
    .tsw-search-head input::-webkit-search-cancel-button { display: none; }
    .tsw-search-head:focus-within { box-shadow: inset 0 -2px 0 var(--tsw-focus); }
    .tsw-search-close { cursor: pointer; padding: .4em .55em; }
    .tsw-search-close:hover { color: var(--tsw-link); border-color: var(--tsw-link); }
    .tsw-search-narrow { display: none; }
    /* The kind filters wrap onto as many rows as they need. flex: none keeps the row at its
       full height when the results fill the dialog; as a shrinkable flex item it collapsed
       and clipped the chips. On a phone they stay one row that scrolls sideways. */
    .tsw-search-chips {
      display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 10px 14px 2px;
    }
    .tsw-search-chips button { flex: none; white-space: nowrap; }
    .tsw-search-chips:empty { display: none; }
    .tsw-search-chips button {
      font: inherit; font-family: var(--tsw-mono); font-size: .72rem; font-weight: 500; cursor: pointer;
      text-transform: uppercase; letter-spacing: .05em; font-variant-numeric: tabular-nums;
      padding: 4px 9px; border-radius: 6px;
      background: var(--tsw-tint); color: var(--tsw-link); border: 1px solid var(--tsw-border-soft);
    }
    .tsw-search-chips button:hover { color: var(--tsw-link); border-color: var(--tsw-link); }
    .tsw-search-chips button[aria-pressed="true"] {
      background: var(--tsw-tint-strong); color: var(--tsw-heading); border-color: var(--tsw-focus);
    }
    .tsw-search-status { padding: 10px 16px 0; font-size: .82rem; color: var(--tsw-text-muted); }
    .tsw-search-status:empty { display: none; }
    .tsw-search-status a { color: var(--tsw-link); }
    .tsw-search-results { overflow-y: auto; overscroll-behavior: contain; padding: 6px 8px 10px; flex: 1; }
    .tsw-search-results:empty { display: none; }
    .tsw-search-group { margin: 6px 0 2px; }
    .tsw-search-group-label {
      padding: 8px 8px 4px; font-family: var(--tsw-mono); font-size: .7rem; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--tsw-text-dim);
    }
    .tsw-search-results a[role="option"] {
      display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none;
      color: var(--tsw-text); border: 1px solid transparent;
    }
    .tsw-search-results a[role="option"]:hover,
    .tsw-search-results a[role="option"][aria-selected="true"] {
      background: var(--tsw-tint-strong); border-color: var(--tsw-border);
    }
    .tsw-search-results a[role="option"][aria-selected="true"] { border-color: var(--tsw-focus); }
    .tsw-search-title { display: block; color: var(--tsw-link); font-weight: 650; font-size: .93rem; line-height: 1.35; }
    .tsw-search-section { display: block; color: var(--tsw-text-dim); font-size: .76rem; margin-top: 1px; }
    .tsw-search-excerpt { display: block; color: var(--tsw-text-muted); font-size: .82rem; line-height: 1.5; margin-top: 3px; }
    .tsw-search-excerpt mark {
      background: var(--tsw-tint-strong); color: var(--tsw-heading); font-weight: 650;
      border-radius: 3px; padding: 0 1px;
    }
    .tsw-search-more {
      display: block; margin: 8px auto 2px; font: inherit; font-size: .82rem; cursor: pointer;
      padding: 6px 14px; border-radius: 8px; color: var(--tsw-link);
      background: var(--tsw-surface-2); border: 1px solid var(--tsw-border);
    }
    .tsw-search-more:hover { border-color: var(--tsw-link); }
    .tsw-search-foot {
      display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between;
      padding: 9px 14px; border-top: 1px solid var(--tsw-border-soft);
      font-size: .74rem; color: var(--tsw-text-dim);
    }
    .tsw-search-foot a { color: var(--tsw-text-dim); text-decoration: underline; }
    body.tsw-search-active { overflow: hidden; }
    @media screen and (max-width: 768px) {
      .tsw-search-dialog {
        margin: 0; width: 100%; height: 100%; max-height: none;
        border: 0; border-radius: 0;
      }
      @supports (height: 100dvh) { .tsw-search-dialog { height: 100dvh; } }
      .tsw-search-head { padding-top: max(12px, env(safe-area-inset-top)); }
      .tsw-search-foot .tsw-search-keys, .tsw-search-wide { display: none; }
      .tsw-search-narrow { display: inline; }
      .tsw-search-close { font-family: var(--tsw-sans); font-size: .82rem; padding: .5em .7em; }
      .tsw-search-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
    }

    /* ===================== Top navbar ===================== */
    .app-nav {
      margin: 0; padding: 0;
      position: fixed; top: 0; right: 0; left: var(--sidebar-width);
      /* Above .content (z-index 1, later in the DOM), so the links and their dropdowns
         take the pointer; still below the sidebar (10) and the cover (20). */
      z-index: 5;
      background: var(--tsw-nav-bg);   /* the glass */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--tsw-border-soft);
      text-align: right;
      height: 52px; line-height: 52px;
      padding-right: 64px;   /* room for the theme button (#tsw-theme) */
    }
    .app-nav li ul { background: var(--tsw-surface); border: 1px solid var(--tsw-border-soft); border-radius: 10px; box-shadow: 0 10px 28px var(--tsw-shadow); }
    .app-nav li ul li { line-height: 1.6; }
    .app-nav a {
      color: var(--tsw-text-muted); font-size: .85rem; font-weight: 550;
      padding: 6px 2px; transition: color .13s;
    }
    .app-nav li ul a { color: var(--tsw-text-muted); }
    .app-nav a:hover, .app-nav li ul a:hover { color: var(--tsw-link); }
    .app-nav a.active { color: var(--tsw-heading); border-bottom: 2px solid var(--tsw-link); }
    .app-nav li { margin: 0 10px; }
    /* dropdown parents are links to their first menu item; caret marks the menu */
    .app-nav li:has(> ul) > a::after { content: ' \25BE'; font-size: .72em; opacity: .65; }
    body.close .app-nav { left: 0; }
    /* Keyboard: a dropdown opens while focus is inside it (vue.css opens it on hover only),
       or when its parent link is toggled with Space (see the keyboard plugin below). */
    .app-nav li:focus-within > ul, .app-nav li.tsw-open > ul { display: block; }
    .app-nav li.tsw-shut > ul { display: none; }
    /* Category menus (docs/site_nav.json "navbar"): a long list scrolls inside its menu, which
       is never wider than the window or taller than the room below the bar. A menu opens
       rightward from its category, except the last three, which open leftward. Where the bar
       wraps to two rows that is not enough, so the menu placement script (the keyboard
       plugin below) measures each menu as it opens and shifts it left or right to keep it
       between the sidebar and the window's right edge. The current page is marked in its
       menu, and its menu's category is marked in the bar. */
    .app-nav li ul {
      max-height: 70vh; max-height: min(70vh, calc(100vh - var(--tsw-nav-h, 52px) - 16px));
      overflow-y: auto; min-width: 13rem; width: max-content; max-width: calc(100vw - 32px);
      left: -14px; right: auto;
      z-index: 1;   /* over the bar's second row where it wraps */
    }
    .app-nav > ul > li:nth-last-child(-n+3) > ul { left: auto; right: -14px; }
    .app-nav li ul li { margin: 6px 16px; white-space: normal; }
    .app-nav li ul a.active { color: var(--tsw-link); }
    .app-nav li:has(> ul a.active) > a { color: var(--tsw-heading); border-bottom: 2px solid var(--tsw-link); }
    /* The repository is linked from the navbar ("GitHub") and from every page's
       "Edit this page on GitHub" line; the corner badge sat under the theme button. */
    .github-corner { display: none; }

    /* ===================== Theme toggle ===================== */
    #tsw-theme {
      position: fixed; top: 8px; right: 14px; z-index: 30;
      width: 36px; height: 36px; padding: 0; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--tsw-surface); color: var(--tsw-text);
      border: 1px solid var(--tsw-border); cursor: pointer;
      transition: border-color .13s, color .13s;
    }
    #tsw-theme:hover { border-color: var(--tsw-link); color: var(--tsw-link); }
    #tsw-theme svg { width: 18px; height: 18px; display: block; }
    #tsw-theme .tsw-i-moon { display: none; }
    :root[data-theme="light"] #tsw-theme .tsw-i-sun { display: none; }
    :root[data-theme="light"] #tsw-theme .tsw-i-moon { display: block; }
    /* Search button beside it, on small screens only (the 768px block shows it); wider
       screens have the search box at the top of the sidebar. */
    #tsw-search-btn {
      display: none; position: fixed; top: 6px; right: 48px; z-index: 30;
      width: 36px; height: 36px; padding: 0; border-radius: 8px;
      align-items: center; justify-content: center;
      background: var(--tsw-surface); color: var(--tsw-text);
      border: 1px solid var(--tsw-border); cursor: pointer;
    }
    #tsw-search-btn:hover { border-color: var(--tsw-link); color: var(--tsw-link); }
    #tsw-search-btn svg { width: 18px; height: 18px; display: block; }

    /* ===================== Keyboard focus and skip link ===================== */
    a:focus-visible, button:focus-visible, summary:focus-visible,
    [tabindex]:focus-visible, .sidebar-toggle:focus-visible, input:focus-visible {
      outline: 2px solid var(--tsw-focus); outline-offset: 2px; border-radius: 4px;
    }
    #main:focus, .markdown-section h1:focus, .markdown-section h2:focus { outline: none; }
    .tsw-skip {
      position: fixed; top: 8px; left: 8px; z-index: 100;
      padding: .55rem 1rem; border-radius: 8px;
      background: var(--tsw-surface-2); color: var(--tsw-text); border: 1px solid var(--tsw-focus);
      font-weight: 650; text-decoration: none;
      transform: translateY(-160%);
    }
    .tsw-skip:focus { transform: none; }
    .tsw-noscript { max-width: 760px; margin: 3rem auto; padding: 0 16px; color: var(--tsw-text); line-height: 1.6; }
    .tsw-noscript a { color: var(--tsw-link); }
    .tsw-sr-only {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ===================== Content ===================== */
    .content { background: transparent; padding-top: 52px; }
    .markdown-section {
      max-width: 1080px;
      padding: 34px 40px 80px;
      color: var(--tsw-text);
      font-size: 15.5px;
      line-height: 1.72;
    }
    .markdown-section > *:first-child { margin-top: 0; }

    .markdown-section h1, .markdown-section h2,
    .markdown-section h3, .markdown-section h4 {
      color: var(--tsw-heading); font-weight: 750; letter-spacing: -.018em; line-height: 1.25;
    }
    .markdown-section h1 { font-size: 2.05rem; margin: 0 0 1.1rem; }
    /* Section rules: a faint violet-to-line hairline (the one gradient besides the glows and the stage) */
    .markdown-section h2 {
      font-size: 1.5rem; margin: 2.6rem 0 1rem;
      padding-bottom: .45rem; border-bottom: 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--tsw-btn-bg) 70%, transparent), var(--tsw-border-soft) 36%, var(--tsw-border-soft) 64%, color-mix(in srgb, var(--tsw-btn-bg) 40%, transparent)) left bottom / 100% 1px no-repeat;
    }
    .markdown-section h3 { font-size: 1.18rem; margin: 2rem 0 .75rem; }
    .markdown-section h4 { font-size: 1.02rem; margin: 1.5rem 0 .6rem; color: var(--tsw-text-muted); }
    .markdown-section h2 + h3 { margin-top: 1.1rem; }
    /* docsify wraps heading text in a.anchor > span and vue.css paints that span #34495e
       (2.02:1 on the navy field). Let it take the heading's own colour instead. */
    .markdown-section h1 .anchor, .markdown-section h2 .anchor, .markdown-section h3 .anchor,
    .markdown-section h4 .anchor, .markdown-section h5 .anchor, .markdown-section h6 .anchor,
    .markdown-section h1 .anchor span, .markdown-section h2 .anchor span,
    .markdown-section h3 .anchor span, .markdown-section h4 .anchor span,
    .markdown-section h5 .anchor span, .markdown-section h6 .anchor span { color: inherit; }
    .markdown-section h5, .markdown-section h6 { color: var(--tsw-text-muted); }

    .markdown-section a { color: var(--tsw-link); text-decoration: none; font-weight: 500; }
    .markdown-section a:hover { color: var(--tsw-link-hover); text-decoration: underline; text-underline-offset: 3px; }
    .markdown-section p, .markdown-section li { color: var(--tsw-text); }
    .markdown-section strong { color: var(--tsw-heading); font-weight: 680; }
    .markdown-section em { color: var(--tsw-text-muted); }
    .markdown-section hr {
      border: 0; height: 1px; margin: 2.4rem 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--tsw-btn-bg) 70%, transparent), var(--tsw-border-soft) 36%, var(--tsw-border-soft) 64%, color-mix(in srgb, var(--tsw-btn-bg) 40%, transparent));
    }
    .markdown-section kbd {
      font-family: var(--tsw-mono); font-size: .8em; padding: .05em .4em;
      border: 1px solid var(--tsw-border); border-bottom-width: 2px; border-radius: 6px;
      background: var(--tsw-surface); color: var(--tsw-text);
    }

    /* Blockquote: used heavily for doc intros */
    .markdown-section blockquote {
      background: var(--tsw-tint-strong);
      border-left: 3px solid var(--tsw-link);
      border-radius: 0 10px 10px 0;
      margin: 1.5rem 0; padding: 1rem 1.2rem;
      color: var(--tsw-text);
    }
    .markdown-section blockquote p { margin: .35rem 0; color: var(--tsw-text); }

    /* ---------- Tables: this library is table-heavy ---------- */
    .markdown-section table {
      display: block; width: 100%; overflow-x: auto;
      border-collapse: collapse; border-spacing: 0;
      margin: 1.4rem 0; font-size: .885rem; font-variant-numeric: tabular-nums;
      border: 1px solid var(--tsw-border-soft); border-radius: 10px;
    }
    .markdown-section thead { background: var(--tsw-surface-2); }
    .markdown-section th {
      background: var(--tsw-surface-2);
      color: var(--tsw-text-muted); text-align: left;
      font-family: var(--tsw-mono); font-size: .72rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 10px 14px; white-space: nowrap;
      border: 0; border-bottom: 1px solid var(--tsw-border);
      position: sticky; top: 0; z-index: 2;
    }
    .markdown-section td {
      padding: 9px 14px; border: 0;
      border-bottom: 1px solid var(--tsw-border-soft);
      vertical-align: top; color: var(--tsw-text);
    }
    .markdown-section tr:last-child td { border-bottom: 0; }
    /* vue.css draws a 1 px #ccc line on top of every row; the hairlines above replace it */
    .markdown-section tr { border-top: 0; }
    .markdown-section tbody tr { background: transparent; transition: background .12s; }
    .markdown-section tbody tr:nth-child(even) { background: var(--tsw-row-alt); }
    .markdown-section tbody tr:hover { background: var(--tsw-row-hover); }

    /* ---------- Code ---------- */
    .markdown-section code {
      font-family: var(--tsw-mono);
      background: var(--tsw-code-bg);
      color: var(--tsw-code-fg);
      border: 1px solid var(--tsw-code-border);
      border-radius: 6px;
      padding: .12em .42em; font-size: .855em;
    }
    /* A long inline path or API route wraps instead of running off a phone screen (break-word,
       not anywhere, so table columns keep their width and the table scrolls instead). */
    .markdown-section :not(pre) > code { overflow-wrap: break-word; }
    .markdown-section pre {
      background: var(--tsw-pre-bg);
      border: 1px solid var(--tsw-border-soft);
      border-radius: 10px;
      margin: 1.3rem 0; padding: 0;
    }
    .markdown-section pre > code {
      background: transparent; border: 0; color: var(--tsw-pre-fg);
      font-size: .845rem; line-height: 1.65; padding: 1.05rem 1.2rem; display: block;
    }
    .markdown-section pre::after { display: none; }
    /* Literal text renders as typed: no programming ligatures in code. */
    .markdown-section code, .markdown-section pre {
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
    }
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--tsw-tok-comment); }
    .token.property, .token.tag, .token.constant, .token.symbol, .token.deleted { color: var(--tsw-tok-tag); }
    .token.boolean, .token.number { color: var(--tsw-tok-number); }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: var(--tsw-tok-string); }
    .token.operator, .token.entity, .token.url, .token.variable, .token.punctuation { color: var(--tsw-tok-operator); }
    .token.atrule, .token.attr-value, .token.function, .token.class-name { color: var(--tsw-tok-function); }
    .token.keyword { color: var(--tsw-tok-keyword); }

    .docsify-copy-code-button {
      background: var(--tsw-surface-2) !important;
      color: var(--tsw-text-muted) !important;
      border: 1px solid var(--tsw-border) !important;
      border-radius: 0 10px 0 8px !important;
      font-size: .74rem !important;
    }
    .docsify-copy-code-button:hover { color: var(--tsw-link) !important; }

    /* docsify-tabs */
    .markdown-section .docsify-tabs__tab { color: var(--tsw-text-muted); background: transparent; }
    .markdown-section .docsify-tabs__tab--active { color: var(--tsw-heading); }

    /* ---------- Cover page (the hero above HOME.md) ---------- */
    section.cover { background: var(--tsw-cover-bg) !important; color: var(--tsw-text); }
    /* auto side margins centre the column: the cover is a flex row with no justify-content */
    section.cover .cover-main { max-width: 932px; margin-left: auto; margin-right: auto; padding: 0 16px; box-sizing: border-box; }
    /* One banner per theme: the flame art (draft-4) is drawn for the dark stage only; the
       light theme uses the Version2 banner. width/height attributes reserve the box, so
       nothing shifts on load. */
    section.cover .tsw-cover-banner {
      display: block; margin: 0 auto 1.1rem; width: 100%; max-width: 880px; height: auto;
    }
    section.cover .tsw-art-light { display: none; }
    :root[data-theme="light"] section.cover .tsw-art-dark { display: none; }
    :root[data-theme="light"] section.cover .tsw-art-light { display: block; }
    section.cover h1 {
      font-size: 2.2rem; font-weight: 750; letter-spacing: -.01em;
      color: var(--tsw-cover-title);
      margin: 0 0 .4rem;
    }
    section.cover h1 a, section.cover h1 a span { color: inherit; }
    section.cover blockquote p { font-size: 1.16rem; color: var(--tsw-text-muted); }
    section.cover .tsw-cover-actions { margin-top: 1.6rem; }
    section.cover .tsw-cover-actions .tsw-cover-btn {
      display: inline-flex; align-items: center; gap: .2em; min-height: 44px; box-sizing: border-box;
      border-radius: 8px; font-size: .95rem; font-weight: 650; line-height: 1.2;
      padding: .5rem 1.4rem; margin: .38rem .3rem; text-decoration: none; vertical-align: middle;
      border: 1px solid var(--tsw-border); color: var(--tsw-text); background: var(--tsw-surface);
      transition: transform .13s, box-shadow .18s, border-color .13s, background-color .13s;
    }
    section.cover .tsw-cover-actions .tsw-cover-btn--primary {
      background: var(--tsw-btn-bg); border-color: var(--tsw-btn-bg); color: var(--tsw-btn-fg); font-weight: 700;
    }
    section.cover .tsw-cover-actions .tsw-cover-btn:hover,
    section.cover .tsw-cover-actions .tsw-cover-btn:focus-visible {
      transform: translateY(-1px); border-color: var(--tsw-link);
      box-shadow: 0 10px 28px var(--tsw-shadow);
    }
    section.cover .tsw-cover-actions .tsw-cover-btn--primary:hover,
    section.cover .tsw-cover-actions .tsw-cover-btn--primary:focus-visible { background: var(--tsw-btn-bg-hover); }
    section.cover .tsw-cover-actions kbd {
      font: inherit; font-size: .78em; line-height: 1; padding: .2em .35em;
      border: 1px solid var(--tsw-border); border-radius: 6px; color: var(--tsw-text-muted);
    }

    /* ---------- Pagination ---------- */
    .pagination-item-title { color: var(--tsw-text-muted) !important; }
    .pagination-item-label { color: var(--tsw-link) !important; }
    .docsify-pagination-container { border-top: 1px solid var(--tsw-border); }

    /* ---------- Misc ---------- */
    ::selection { background: var(--tsw-selection); }
    img { max-width: 100%; }
    .markdown-section img[src*="shields.io"] { display: inline-block; margin: 2px 1px; vertical-align: middle; }

    /* Back-to-top */
    #tsw-top {
      position: fixed; right: 22px; bottom: 22px; z-index: 40;
      width: 40px; height: 40px; border-radius: 8px;
      display: none; align-items: center; justify-content: center;
      background: var(--tsw-surface-2); border: 1px solid var(--tsw-border);
      color: var(--tsw-link); cursor: pointer; font-size: 17px;
      transition: transform .13s, box-shadow .18s;
    }
    #tsw-top:hover { transform: translateY(-1px); box-shadow: 0 10px 28px var(--tsw-shadow); }
    #tsw-top.show { display: flex; }

    /* ---------- Responsive ---------- */
    /* The mobile top bar is off by default; the 768px block below turns it on in docsify's
       phone mode only. This base rule must come first: at equal specificity the later rule
       wins. */
    #tsw-mbar { display: none; }
    @media screen and (max-width: 768px) {
      /* Two layouts share this block. docsify picks one when the page loads: at 600px or
         narrower (phone mode) it moves the navbar into the sidebar, and the mobile top bar
         (#tsw-mbar) holds the menu and theme buttons; from 601px to 768px (tablet mode) the
         navbar stays a fixed bar at the top and is itself the top bar, with the menu button
         at its left and the theme button at its right. Its items wrap to a second row where
         they do not fit, and the page, the cover and the anchor offset follow its measured
         height (--tsw-nav-h, set by the navbar-height plugin below). */
      .app-nav {
        left: 0; height: auto; min-height: 48px; line-height: 30px;
        padding: 3px 92px 3px 48px;   /* right: the search and theme buttons */
      }
      .app-nav > ul { display: block; margin: 0; padding-left: 0; }
      .app-nav li { margin: 0 6px; }
      .app-nav a { font-size: .8rem; }
      .markdown-section { padding: 26px 16px 64px; font-size: 15px; }
      .markdown-section h1 { font-size: 1.7rem; }
      .markdown-section h2 { font-size: 1.3rem; }
      section.cover h1 { font-size: 1.9rem; }
      /* The cover sizes to its content on a phone (vue.css makes it a full screen, which left
         an empty band between the buttons and the page below). */
      section.cover { min-height: 0; padding: calc(var(--tsw-nav-h, 48px) + 16px) 0 24px; z-index: 2; }
      .content { padding-top: var(--tsw-nav-h, 48px); }
      /* Mobile top bar: the menu button sits at its left and the theme button at its right,
         so neither floats over page content. vue.css put the menu button at the bottom-left
         corner, where it covered the cover's ATT&CK-Navi button. It shows in phone mode,
         and in tablet mode only while the sidebar is open (body.close), when vue.css hides
         the navbar; it never covers the tablet navbar. */
      body:not(:has(> nav.app-nav)) > #tsw-mbar, body.close > #tsw-mbar {
        display: block; position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 11;
        background: var(--tsw-nav-bg); border-bottom: 1px solid var(--tsw-border-soft);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      }
      /* The brand in the top bar: the insignia and the site name, between the menu button
         and the search and theme buttons */
      #tsw-mbar .tsw-mbar-brand {
        position: absolute; top: 0; bottom: 0; left: 52px; right: 92px;
        display: flex; align-items: center; gap: .5rem; min-width: 0;
        color: var(--tsw-heading); font-weight: 800; font-size: 1.02rem; letter-spacing: -.015em;
        white-space: nowrap; overflow: hidden;
      }
      #tsw-mbar .tsw-mark { width: 45px; height: 24px; }
      .sidebar-toggle, body.close .sidebar-toggle {
        position: fixed; top: 0; bottom: auto; left: 0; z-index: 30;
        width: 48px; height: 48px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: 0;
      }
      .sidebar-toggle .sidebar-toggle-button { padding: 14px 13px; }
      .sidebar { padding-top: 48px; }
      #tsw-theme { top: 6px; right: 8px; }
      #tsw-search-btn { display: inline-flex; }
    }
    /* Tablet mode: tighter items, so every navbar item stays on one row beside the two buttons at 768px */
    @media screen and (min-width: 601px) and (max-width: 768px) {
      .app-nav li { margin: 0 4px; }
    }
    /* Phone mode: docsify moves the navbar to the top of the sidebar (mergeNavbar). Each
       category there is one row with a caret, and its pages stay folded until a tap or Space
       opens them (the keyboard plugin below), so the categories fit in about one screen and
       the page's own sidebar follows them. The category holding the current page is marked. */
    @media screen and (max-width: 768px) {
      .sidebar > nav li > ul, .sidebar > nav li.tsw-shut > ul { display: none; }
      .sidebar > nav li.tsw-open > ul { display: block; }
      .sidebar > nav li:has(> ul) > a::after { content: ' \25B8'; font-size: .72em; opacity: .65; }
      .sidebar > nav li.tsw-open:has(> ul) > a::after { content: ' \25BE'; }
      .sidebar > nav li:has(> ul a.active) > a { color: var(--tsw-heading); font-weight: 600; }
    }
    /* Narrow desktops and tablets (docsify switches to its phone layout at 768px). The navbar
       items fit one row from 1100px when set tighter; below that they wrap, so the
       bar grows to fit and the page and the anchor offset follow its measured height
       (--tsw-nav-h, set by the navbar-height plugin below). */
    @media screen and (min-width: 769px) and (max-width: 1280px) {
      .app-nav li { margin: 0 6px; }
      .app-nav a { font-size: .8rem; }
    }
    @media screen and (min-width: 769px) and (max-width: 1099px) {
      .app-nav { height: auto; min-height: 52px; line-height: 30px; padding-top: 6px; padding-bottom: 6px; }
      .content { padding-top: var(--tsw-nav-h, 52px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      /* and no hover lifts or nudges */
      .sidebar ul li a:hover, #tsw-top:hover,
      section.cover .tsw-cover-actions .tsw-cover-btn:hover,
      section.cover .tsw-cover-actions .tsw-cover-btn:focus-visible,
      .markdown-section .tsw-door:hover, .markdown-section .tsw-guide:hover,
      .markdown-section .tsw-explore:hover { transform: none !important; }
    }

    /* ---------- Print: light colours (set by the beforeprint handler), content only ---------- */
    @media print {
      .sidebar, .sidebar-toggle, .app-nav, #tsw-theme, #tsw-top, #tsw-mbar, .tsw-skip,
      #tsw-search-btn, .tsw-search,
      .docsify-copy-code-button, .docsify-pagination-container, body::before { display: none !important; }
      .content { left: 0 !important; padding-top: 0 !important; position: static !important; }
      .markdown-section { max-width: none; padding: 0; }
      .markdown-section a { text-decoration: underline; }
      section.cover { min-height: 0 !important; height: auto !important; page-break-after: always; }
    }

    /* ===================== Homepage components (HOME.md) =====================
       New .tsw-* classes only; nothing here touches the selectors that style the other
       pages. Every selector is prefixed .markdown-section so these rules out-rank the
       generic .markdown-section link styling without touching it. */
    .markdown-section .tsw-lead { color: var(--tsw-text-muted); margin: -.3rem 0 1.1rem; max-width: 72ch; }
    .markdown-section .tsw-more { margin: .9rem 0 0; font-size: .92rem; }
    /* HOME.md's first paragraph is for readers who open the file on github.com, which drops
       classes and so shows it; on the site the page itself is the homepage. */
    .markdown-section .tsw-gh-only { display: none; }
    /* Empty targets that keep the previous homepage's #/?id= section links working */
    .markdown-section .tsw-anchor { height: 0; margin: 0; }

    /* --- Front door: the README's two link rows (the project links, then "Explore the
       library"), centered and wrapping between links, never inside one --- */
    .markdown-section .tsw-links { margin: 0 0 1.6rem; text-align: center; }
    .markdown-section .tsw-links p { margin: .3rem 0; line-height: 1.9; }
    .markdown-section .tsw-links a { white-space: nowrap; }
    .markdown-section .tsw-links-label { color: var(--tsw-text-muted); font-weight: 650; }
    .markdown-section .tsw-links-sep { color: var(--tsw-text-dim); margin: 0 .15rem; }

    /* --- Buttons --- */
    .markdown-section .tsw-btn {
      display: inline-block; border-radius: 8px; padding: .55rem 1.15rem;
      font-size: .9rem; font-weight: 650;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border);
      color: var(--tsw-text); text-decoration: none;
      transition: border-color .13s, color .13s;
    }
    .markdown-section .tsw-btn:hover { border-color: var(--tsw-link); color: var(--tsw-link); text-decoration: none; }

    /* --- Three doors --- */
    .markdown-section .tsw-doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 .6rem; }
    .markdown-section .tsw-door {
      display: flex; flex-direction: column; gap: .45rem; min-width: 0;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border-soft);
      border-top: 3px solid var(--tsw-door, var(--tsw-link)); border-radius: 10px;
      padding: 1rem 1.1rem 1.05rem; color: var(--tsw-text); text-decoration: none;
      transition: border-color .13s, transform .13s, box-shadow .13s;
    }
    .markdown-section .tsw-door--learn { --tsw-door: var(--tsw-green); }
    .markdown-section .tsw-door--task  { --tsw-door: var(--tsw-red); }
    .markdown-section .tsw-door--data  { --tsw-door: var(--tsw-link); }
    .markdown-section .tsw-door:hover {
      border-color: var(--tsw-border); border-top-color: var(--tsw-door);
      transform: translateY(-1px); box-shadow: 0 10px 28px var(--tsw-shadow); text-decoration: none;
    }
    .markdown-section .tsw-door-who {
      font-family: var(--tsw-mono); font-size: .72rem; letter-spacing: .08em;
      text-transform: uppercase; color: var(--tsw-text-dim);
    }
    .markdown-section .tsw-door-t { font-size: 1.2rem; font-weight: 750; color: var(--tsw-heading); line-height: 1.3; }
    .markdown-section .tsw-door-d { font-size: .9rem; line-height: 1.55; color: var(--tsw-text-muted); flex: 1; }
    .markdown-section .tsw-door-go { font-size: .88rem; font-weight: 650; color: var(--tsw-link); }
    .markdown-section .tsw-door-go::after { content: " \203A"; }

    /* --- Start-here guide cards --- */
    .markdown-section .tsw-guides { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    /* A 3 px violet rail at the left edge, as on the Radar tiles */
    .markdown-section .tsw-guide {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: .55rem; min-width: 0;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border-soft); border-radius: 10px;
      padding: .85rem 1rem .85rem 1.2rem; text-decoration: none; color: var(--tsw-text);
      transition: border-color .13s, transform .13s, box-shadow .13s;
    }
    .markdown-section .tsw-guide::before,
    .markdown-section .tsw-explore::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tsw-btn-bg);
    }
    .markdown-section .tsw-guide:hover {
      border-color: var(--tsw-border); transform: translateY(-1px);
      box-shadow: 0 10px 28px var(--tsw-shadow); text-decoration: none;
    }
    .markdown-section .tsw-guide-t { font-weight: 700; font-size: 1rem; line-height: 1.35; color: var(--tsw-heading); }
    .markdown-section .tsw-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .markdown-section .tsw-pill {
      font-family: var(--tsw-mono); font-size: .7rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
      font-variant-numeric: tabular-nums; line-height: 1.45; padding: .1rem .5rem; border-radius: 6px;
      background: var(--tsw-surface-2); border: 1px solid var(--tsw-border-soft); color: var(--tsw-text-muted);
    }

    /* --- How it connects: a left-to-right route --- */
    .markdown-section .tsw-connect { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 0 0 1.4rem; }
    .markdown-section .tsw-node {
      position: relative; min-width: 0; padding: .75rem .85rem .8rem .8rem;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border-soft);
    }
    .markdown-section .tsw-node + .tsw-node { border-left: 0; padding-left: 1.05rem; }
    .markdown-section .tsw-node:first-child { border-radius: 10px 0 0 10px; }
    .markdown-section .tsw-node:last-child { border-radius: 0 10px 10px 0; }
    .markdown-section .tsw-node:not(:last-child)::after {
      content: ""; position: absolute; right: -7px; top: 50%; width: 12px; height: 12px; z-index: 1;
      background: var(--tsw-surface); border-top: 1px solid var(--tsw-border-soft); border-right: 1px solid var(--tsw-border-soft);
      transform: translateY(-50%) rotate(45deg);
    }
    .markdown-section .tsw-node-k {
      display: block; font-family: var(--tsw-mono); font-size: .68rem; letter-spacing: .07em;
      text-transform: uppercase; color: var(--tsw-text-dim);
    }
    .markdown-section .tsw-node a { display: block; font-weight: 700; font-size: .9rem; line-height: 1.3; margin: .15rem 0 .35rem; }
    .markdown-section .tsw-node-d { display: block; font-size: .78rem; line-height: 1.45; color: var(--tsw-text-muted); }

    /* --- Framework chain chips --- */
    /* Chips in the Radar chip style: mono, uppercase, the colour in the text over a faint
       tint of it, never a full fill */
    .markdown-section .tsw-chip {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .3rem .75rem; font-size: .76rem; font-family: var(--tsw-mono); font-weight: 500;
      letter-spacing: .05em; text-transform: uppercase;
      background: var(--tsw-tint); border: 1px solid var(--tsw-border); border-radius: 6px;
      color: var(--tsw-link); text-decoration: none;
      transition: color .13s, border-color .13s;
    }
    .markdown-section .tsw-chip:hover { color: var(--tsw-link-hover); border-color: var(--tsw-link); text-decoration: none; }
    .markdown-section .tsw-chain {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 12px 32px; margin: .4rem 0 1.2rem;
    }
    .markdown-section .tsw-chain .tsw-chip { position: relative; }
    .markdown-section .tsw-chain .tsw-chip:not(:last-child)::after {
      content: '\2192'; position: absolute; right: -23px; top: 50%;
      transform: translateY(-50%); color: var(--tsw-text-dim); font-size: .9rem;
    }

    /* --- Explore teaser --- */
    .markdown-section .tsw-explore {
      position: relative; overflow: hidden;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border-soft); border-radius: 10px;
      padding: 1rem 1.1rem 1.15rem 1.3rem; display: grid; gap: .9rem; justify-items: start;
    }
    .markdown-section .tsw-explore-lead { margin: 0; color: var(--tsw-text-muted); }
    .markdown-section .tsw-ids { display: flex; flex-wrap: wrap; gap: 8px; }
    .markdown-section .tsw-id {
      display: inline-flex; align-items: baseline; gap: .45rem; padding: .3rem .7rem;
      border: 1px solid var(--tsw-border-soft); border-radius: 6px; background: var(--tsw-bg-alt);
      color: var(--tsw-text); font-size: .86rem; text-decoration: none;
    }
    .markdown-section .tsw-id:hover { border-color: var(--tsw-link); color: var(--tsw-link); text-decoration: none; }
    .markdown-section .tsw-id code { border: 0; background: transparent; padding: 0; color: var(--tsw-green); font-size: .86em; }
    .markdown-section .tsw-families { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: .9rem; }
    .markdown-section .tsw-families-label {
      font-family: var(--tsw-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--tsw-text-dim); margin-right: 4px;
    }

    /* --- Browse by domain --- */
    .markdown-section .tsw-domains { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .markdown-section .tsw-domain {
      display: flex; flex-direction: column; gap: .2rem; min-width: 0;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border-soft); border-radius: 10px;
      padding: .8rem 1rem .9rem; transition: border-color .13s;
    }
    .markdown-section .tsw-domain:hover { border-color: var(--tsw-border); }
    .markdown-section .tsw-domain a { font-size: .86rem; color: var(--tsw-text-muted); line-height: 1.5; }
    .markdown-section .tsw-domain a:hover { color: var(--tsw-link); }
    .markdown-section .tsw-domain a.tsw-domain-t {
      font-size: .98rem; font-weight: 700; color: var(--tsw-heading); margin-bottom: .25rem; line-height: 1.35;
    }
    .markdown-section .tsw-domain a.tsw-domain-t:hover { color: var(--tsw-link); }

    /* --- Footer --- */
    .markdown-section .tsw-footer {
      margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--tsw-border-soft);
      display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 1.2rem 2rem;
      font-size: .88rem; color: var(--tsw-text-muted);
    }
    .markdown-section .tsw-footer p { margin: 0 0 .8rem; color: var(--tsw-text-muted); line-height: 1.6; }
    .markdown-section .tsw-footer-col { display: flex; flex-direction: column; gap: .3rem; align-items: flex-start; min-width: 0; }
    .markdown-section .tsw-footer-h { font-weight: 700; color: var(--tsw-heading); margin-bottom: .2rem; }
    .markdown-section .tsw-footer-col > a { color: var(--tsw-text-muted); }
    .markdown-section .tsw-footer-col > a:hover { color: var(--tsw-link); }
    .markdown-section .tsw-footer .tsw-btn--navi {
      color: var(--tsw-btn-fg); background: var(--tsw-btn-bg); border-color: var(--tsw-btn-bg); font-weight: 700;
    }
    .markdown-section .tsw-footer .tsw-btn--navi:hover { background: var(--tsw-btn-bg-hover); color: var(--tsw-btn-fg); }
    .markdown-section .tsw-footer-small {
      grid-column: 1 / -1; font-size: .78rem !important; color: var(--tsw-text-dim) !important;
      border-top: 1px solid var(--tsw-border-soft); padding-top: .9rem; margin: 0 !important;
    }

    /* --- Homepage on smaller screens --- */
    @media screen and (max-width: 1180px) {
      .markdown-section .tsw-connect { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 10px; }
      .markdown-section .tsw-node, .markdown-section .tsw-node + .tsw-node { border: 1px solid var(--tsw-border-soft); border-radius: 10px; padding-left: .8rem; }
      .markdown-section .tsw-node:not(:last-child)::after { display: none; }
    }
    @media screen and (max-width: 1024px) {
      .markdown-section .tsw-guides, .markdown-section .tsw-domains { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media screen and (max-width: 768px) {
      .markdown-section .tsw-doors { grid-template-columns: minmax(0, 1fr); }
      .markdown-section .tsw-connect { grid-template-columns: minmax(0, 1fr); }
      .markdown-section .tsw-footer { grid-template-columns: minmax(0, 1fr); }
      .markdown-section .tsw-chain { flex-direction: column; align-items: flex-start; gap: 26px; }
      .markdown-section .tsw-chain .tsw-chip:not(:last-child)::after {
        content: '\2193'; right: auto; left: 50%; top: auto; bottom: -22px;
        transform: translateX(-50%);
      }
    }
    @media screen and (max-width: 560px) {
      .markdown-section .tsw-guides, .markdown-section .tsw-domains { grid-template-columns: minmax(0, 1fr); }
    }

    /* ===================== Library navigation =====================
       The breadcrumb trail, the "On this page" list and the section highlight in the sidebar
       (the navigation script below; trails from assets/site-nav.json, which
       scripts/build_site_nav.py writes). */
    .markdown-section .tsw-crumbs { margin: 0 0 .8rem; font-size: .82rem; line-height: 1.5; }
    .markdown-section .tsw-crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .1rem .35rem; }
    .markdown-section .tsw-crumbs li { margin: 0; color: var(--tsw-text-dim); }
    .markdown-section .tsw-crumbs li + li::before { content: '/'; margin-right: .35rem; color: var(--tsw-text-dim); }
    .markdown-section .tsw-crumbs li[aria-current] { color: var(--tsw-text-muted); }
    /* The 15 px left gutter matches docsify's ".sidebar ul" margin, so the block lines up
       with the sections below it. The height cap keeps a long reference from pushing the
       site sections a screen or more down; the list scrolls inside the block instead. */
    .sidebar .tsw-toc { margin: 0 0 12px 15px; padding: 0 0 10px; border-bottom: 1px solid var(--tsw-border-soft); }
    .sidebar .tsw-toc summary {
      cursor: pointer; padding: 2px 0 4px; font-family: var(--tsw-mono);
      font-size: .705rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--tsw-text-dim);
    }
    .sidebar .tsw-toc ul {
      display: block; margin: 2px 0 0; padding: 0 8px 0 2px; list-style: none;
      max-height: 45vh; overflow-y: auto; overscroll-behavior: contain;
    }
    .sidebar .tsw-toc li { margin: 0; float: none; clear: both; }
    /* docsify's theme puts a floated "-" before every .app-sub-sidebar item; nothing clears
       those floats, so each entry stepped further right. The block has its own heading. */
    .sidebar .tsw-toc li::before { content: none; display: none; }
    .sidebar .tsw-toc li a { display: block; font-size: .84rem; line-height: 1.4; padding: 3px 0; }
    .sidebar-nav li.tsw-in-section > a { color: var(--tsw-green); font-weight: 650; }

    /* ===================== Header card and folds =====================
       scripts/build_doc_meta.py writes a header card between meta:start and meta:end comments
       at the top of each reference and learning path; the card script below wraps that block
       in section.tsw-meta and marks its two card tables. The first table is what fits one
       screen; the rest of the card sits in details.tsw-meta-more ("More about this page"),
       which the script opens, without its summary line, on screens wider than 600 px, and the
       "Which page should I read?" table sits in a closed details.tsw-meta-which. At 600 px
       and below the script moves the card up to sit directly under the page title. On GitHub
       the same block is the same tables (a row header per label) and two closed folds. Folds
       are <details class="tsw-fold"> around a long appendix or table, and around each
       technique's body on the generated techniques/ and detections/strategies/ pages; an
       open fold's label reads "Hide ..." instead of "Show ..." (the folds script below). */
    .markdown-section .tsw-meta {
      margin: 1.2rem 0 1.8rem; padding: .35rem 1.1rem .7rem;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border-soft); border-radius: 10px;
    }
    .markdown-section .tsw-meta table { margin: .3rem 0 .5rem; border-radius: 8px; }
    /* vue.css draws a 1 px #ccc top border on every tr; inside the card it showed as a
       light line across the first row (most visibly on a phone, where rows are blocks). */
    .markdown-section .tsw-meta tr { border-top: 0; }
    .markdown-section .tsw-meta tbody tr,
    .markdown-section .tsw-meta tbody tr:nth-child(even),
    .markdown-section .tsw-meta tbody tr:hover { background: transparent; }
    .markdown-section .tsw-meta table.tsw-meta-card { display: table; width: 100%; border: 0; font-size: .9rem; }
    /* Each label is a row header (th scope="row"); the value is a paragraph in its cell. */
    .markdown-section .tsw-meta table.tsw-meta-card th,
    .markdown-section .tsw-meta table.tsw-meta-card td { padding: 7px 12px 7px 0; vertical-align: top; }
    .markdown-section .tsw-meta table.tsw-meta-card th {
      width: 11rem; white-space: nowrap; color: var(--tsw-text-dim); font-weight: 650; font-size: inherit;
      font-family: inherit; letter-spacing: normal; text-transform: none;
      background: transparent; position: static; border-bottom: 1px solid var(--tsw-border-soft);
    }
    .markdown-section .tsw-meta table.tsw-meta-card tr:last-child th { border-bottom: 0; }
    .markdown-section .tsw-meta table.tsw-meta-card td > p { margin: 0; line-height: inherit; }
    .markdown-section .tsw-meta > p { margin: 1rem 0 .4rem; color: var(--tsw-text); }
    .markdown-section .tsw-meta > details { margin: .1rem 0 .2rem; border-top: 1px solid var(--tsw-border-soft); }
    .markdown-section .tsw-meta > details > summary {
      cursor: pointer; padding: .5rem 0; color: var(--tsw-link); font-weight: 600; font-size: .88rem;
    }
    .markdown-section .tsw-meta > details > summary:hover { color: var(--tsw-link-hover); }
    .markdown-section .tsw-meta > details > table { margin-top: 0; }
    @media (min-width: 601px) {
      .markdown-section .tsw-meta > details.tsw-meta-more[data-auto-open] { border-top: 0; margin-top: -.5rem; }
      .markdown-section .tsw-meta > details.tsw-meta-more[data-auto-open] > summary { display: none; }
    }
    @media print { .markdown-section .tsw-meta > details > summary { display: none; } }
    @media (max-width: 600px) {
      .markdown-section .tsw-meta { padding: .2rem .85rem .55rem; }
      .markdown-section .tsw-meta table.tsw-meta-card,
      .markdown-section .tsw-meta table.tsw-meta-card tbody,
      .markdown-section .tsw-meta table.tsw-meta-card tr,
      .markdown-section .tsw-meta table.tsw-meta-card th,
      .markdown-section .tsw-meta table.tsw-meta-card td { display: block; width: auto; }
      .markdown-section .tsw-meta table.tsw-meta-card tr { padding: 5px 0; border-bottom: 1px solid var(--tsw-border-soft); }
      .markdown-section .tsw-meta table.tsw-meta-card tr:last-child { border-bottom: 0; }
      .markdown-section .tsw-meta table.tsw-meta-card th,
      .markdown-section .tsw-meta table.tsw-meta-card td { padding: 0; border: 0; }
      .markdown-section .tsw-meta table.tsw-meta-card th { white-space: normal; font-size: .78rem; line-height: 1.35; margin-bottom: 1px; }
      /* The "Edit this page on GitHub" line takes one short line on a phone: the "/" key
         hint is for keyboards, so the card starts higher on the first screen. */
      .markdown-section .tsw-keyhint { display: none; }
      .markdown-section blockquote:has(.tsw-keyhint) { margin: .6rem 0 1rem; padding-top: .45rem; padding-bottom: .45rem; }
    }
    .markdown-section details.tsw-fold { margin: .8rem 0 1.2rem; border: 1px solid var(--tsw-border-soft); border-radius: 10px; }
    .markdown-section details.tsw-fold:hover { border-color: var(--tsw-border); }
    .markdown-section details.tsw-fold > summary {
      cursor: pointer; padding: .55rem .9rem; color: var(--tsw-link); font-weight: 600; font-size: .9rem;
    }
    .markdown-section details.tsw-fold > summary:hover { color: var(--tsw-link-hover); }
    .markdown-section details.tsw-fold[open] > summary { border-bottom: 1px solid var(--tsw-border-soft); }
    .markdown-section details.tsw-fold > :not(summary) { margin-left: .9rem; margin-right: .9rem; }
    @media print { .markdown-section details.tsw-fold > summary { display: none; } }

    /* ===================== Explore (explore.md, the Explore script below) ===================== */
    .markdown-section .tsw-x { margin: 1.4rem 0 2rem; }
    .markdown-section .tsw-x-q { display: block; margin: 0 0 .8rem; }
    .markdown-section .tsw-x input[type="search"], .markdown-section .tsw-x select {
      font: inherit; color: var(--tsw-text); background: var(--tsw-surface);
      border: 1px solid var(--tsw-border); border-radius: 8px; box-sizing: border-box;
    }
    .markdown-section .tsw-x input[type="search"] { width: 100%; padding: .6rem .8rem; font-size: .95rem; }
    .markdown-section .tsw-x input[type="search"]::placeholder { color: var(--tsw-text-dim); opacity: 1; }
    .markdown-section .tsw-x select { padding: .35rem .5rem; font-size: .86rem; max-width: 100%; }
    .markdown-section .tsw-x input:focus-visible, .markdown-section .tsw-x select:focus-visible {
      outline: 2px solid var(--tsw-focus); outline-offset: 2px;
    }
    .markdown-section .tsw-x-kinds { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 .8rem; }
    .markdown-section .tsw-x-kinds button {
      font: inherit; font-family: var(--tsw-mono); font-size: .74rem; font-weight: 500; cursor: pointer;
      letter-spacing: .05em; text-transform: uppercase; font-variant-numeric: tabular-nums;
      padding: .28rem .6rem; border-radius: 6px;
      border: 1px solid var(--tsw-border); background: var(--tsw-tint); color: var(--tsw-link);
    }
    .markdown-section .tsw-x-kinds button:hover { border-color: var(--tsw-link); }
    .markdown-section .tsw-x-kinds button[aria-pressed="true"] {
      background: var(--tsw-tint-strong); border-color: var(--tsw-focus); color: var(--tsw-heading); font-weight: 650;
    }
    .markdown-section .tsw-x-kinds button span { color: inherit; opacity: .85; }
    .markdown-section .tsw-x-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; margin: 0 0 .6rem; }
    .markdown-section .tsw-x-filters label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--tsw-text-muted); }
    .markdown-section .tsw-x-filters label[hidden] { display: none; }
    .markdown-section .tsw-x-filters .tsw-x-check { flex-direction: row; align-items: center; gap: 6px; font-size: .84rem; padding-bottom: .35rem; }
    .markdown-section .tsw-x-btn {
      font: inherit; font-size: .84rem; cursor: pointer; padding: .35rem .8rem; border-radius: 8px;
      border: 1px solid var(--tsw-border); background: var(--tsw-surface); color: var(--tsw-link);
    }
    .markdown-section .tsw-x-btn:hover { border-color: var(--tsw-link); }
    .markdown-section .tsw-x-status { margin: .4rem 0 .2rem; font-size: .86rem; color: var(--tsw-text-muted); font-variant-numeric: tabular-nums; }
    .markdown-section .tsw-x table { font-size: .86rem; }
    .markdown-section .tsw-x td code { white-space: nowrap; }
    .markdown-section .tsw-x-sub { display: block; font-size: .78rem; color: var(--tsw-text-dim); line-height: 1.45; }
    .markdown-section .tsw-x-flag { color: var(--tsw-red-text); }
    .markdown-section .tsw-x-more { margin-top: .4rem; }
    @media screen and (max-width: 600px) {
      .markdown-section .tsw-x-filters label:not(.tsw-x-check) { flex: 1 1 100%; }
      .markdown-section .tsw-x select { width: 100%; }

    /* ===================== Case study timeline (case-studies/TIMELINE.md, the timeline script below) ===================== */

    // and Enter follows its link.

    })();

  <!-- Library navigation. Two docsify plugins, added to the config above:
       1. Breadcrumbs and orientation: on each hand-written page, a trail (Library, then its
          domain hub or folder, then the page) from assets/site-nav.json, which
          scripts/build_site_nav.py writes from docs/site_nav.json; in the sidebar, the hub or
          folder link of the open page is marked, and a page the sidebar does not list (a
          reference, a framework page) gets an "On this page" list of its sections.
       2. Explore (explore.md): the filterable table of the framework objects that have a page, from
          assets/explore.json (scripts/build_explore.py). Without the JSON the page still
          shows its family index tables, which is all GitHub shows.
       3. Case study timeline (case-studies/TIMELINE.md): every case study by year, from
          assets/case-studies.json (scripts/build_case_study_timeline.py), filtered by years,
          kind, sector and a text box, with the filters in the route query so a filtered view
          can be shared. Without the JSON the page shows its plain list, as GitHub does. -->
  <script>
    (function () {
      var BASE = location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '');
      var cache = {};
      function getJson(path) {
        if (!cache[path]) {
          cache[path] = fetch(BASE + path).then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return cache[path];
      }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
      }
      function el(tag, attrs, text) {
        var e = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k === 'className') { e.className = attrs[k]; } else { e.setAttribute(k, attrs[k]); }
        });
        if (text != null) { e.textContent = text; }
        return e;
      }

      // ---------- 1. breadcrumbs, section highlight, "On this page"
      window.$docsify.plugins.push(function (hook, vm) {
        hook.init(function () { getJson('assets/site-nav.json'); });
        hook.afterEach(function (html, next) {
          getJson('assets/site-nav.json').then(function (nav) {
            var chain = nav && nav.pages ? nav.pages[vm.route.file] : null;
            if (!chain) { next(html); return; }
            var items = ['<li><a href="#/">Library</a></li>'];
            chain.forEach(function (c) { items.push('<li><a href="#/' + esc(c[1]) + '">' + esc(c[0]) + '</a></li>'); });
            items.push('<li aria-current="page" class="tsw-crumbs-here"></li>');
            next('<nav class="tsw-crumbs" aria-label="Breadcrumb"><ol>' + items.join('') + '</ol></nav>' + html);
          });
        });
        hook.doneEach(function () {
          var h1 = document.querySelector('#main h1');
          var here = document.querySelector('.tsw-crumbs-here');
          if (here) { here.textContent = h1 ? h1.textContent.replace(/\s+/g, ' ').trim() : ''; }
          var side = document.querySelector('.sidebar-nav');
          if (!side) { return; }
          // docsify marks the longest sidebar link that prefixes the route, so on a page the
          // sidebar does not list, "Home" (#/) is marked and the page's sections are put
          // under it. Unmark it, and keep those sections for the "On this page" list.
          var act = side.querySelector('li.active'), sections = null;
          var actLink = act && act.querySelector(':scope > a');
          if (actLink && actLink.getAttribute('href') === '#/' && vm.route.path !== '/' && !/^\/HOME(\.md)?$/i.test(vm.route.path)) {
            act.classList.remove('active');
            sections = act.querySelector(':scope > ul.app-sub-sidebar');
            act = null;
          }
          if (act) { return; }
          getJson('assets/site-nav.json').then(function (nav) {
            var chain = nav && nav.pages ? nav.pages[vm.route.file] : null;
            for (var i = chain ? chain.length - 1 : -1; i >= 0; i--) {
              var r = chain[i][1];
              var a = side.querySelector('a[href="#/' + r + '"]') ||
                (/\/$/.test(r) ? side.querySelector('a[href="#/' + r + 'README"]') : null);
              if (a && a.parentElement) { a.parentElement.classList.add('tsw-in-section'); break; }
            }
          });
          // The sections of a page the sidebar does not list, at the top of the sidebar
          if (side.querySelector('.tsw-toc')) { return; }
          var ul = sections && sections.querySelector('li') ? sections : null;
          // top-level sections only: with every h3 too, a long reference listed 84 entries.
          // docsify puts each nested list beside its parent item (ul > ul), not inside it.
          if (ul && ul.querySelectorAll(':scope > li').length >= 2) {
            Array.prototype.slice.call(ul.querySelectorAll(':scope > ul, :scope > li > ul')).forEach(function (n) { n.remove(); });
          }
          if (!ul) {
            var heads = Array.prototype.slice.call(document.querySelectorAll('#main h2[id]'));
            if (heads.length < 2) { if (sections) { sections.remove(); } return; }
            ul = el('ul', {});
            heads.forEach(function (h) {
              var anchor = h.querySelector('a.anchor');
              var a = el('a', { href: anchor ? anchor.getAttribute('href') : '#' + h.id }, h.textContent.replace(/\s+/g, ' ').trim());
              var li = el('li', {});
              li.appendChild(a);
              ul.appendChild(li);
            });
          }
          // open on wide screens; closed on a phone, where the sidebar is the menu
          var box = el('details', { className: 'tsw-toc' });
          if (!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches)) { box.open = true; }
          box.appendChild(el('summary', {}, 'On this page'));
          box.appendChild(ul);
          side.insertBefore(box, side.firstChild);
        });
      });

      // ---------- 2. Explore
      var PAGE = 100;
      function idKey(q) {
        var s = q.trim().toUpperCase().replace(/\s+/g, ''), m;
        if ((m = /^T(\d{4})(?:[.\/\-_](\d{3}))?$/.exec(s))) { return 'T' + m[1] + (m[2] ? '.' + m[2] : ''); }
        if ((m = /^AML\.?([TM])(\d{4})(?:[.\/\-_](\d{3}))?$/.exec(s))) { return 'AML.' + m[1] + m[2] + (m[3] ? '.' + m[3] : ''); }
        if ((m = /^CAPEC[-_]?(\d+)$/.exec(s))) { return 'CAPEC-' + m[1]; }
        if ((m = /^F(\d{4})(?:[.\/\-_](\d{3}))?$/.exec(s))) { return 'F' + m[1] + (m[2] ? '.' + m[2] : ''); }
        return s;
      }
      function idParts(id) {
        return id.split(/(\d+)/).map(function (p) { return /^\d+$/.test(p) ? ('000000' + p).slice(-6) : p; }).join('');
      }
      function routeOf(d, row) {
        var kind = d.kinds[row.k];
        var stem = row.s || (row.k === d.kx.technique || row.k === d.kx.atlas || row.k === d.kx['atlas-mitigation']
          ? row.i.replace(/\./g, '-') : row.k === d.kx.d3fend
            ? row.n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') : row.i);
        return '#/' + kind.dir + stem;
      }
      function prepare(d) {
        d.kx = {};
        d.kinds.forEach(function (k, i) { d.kx[k.key] = i; });

  <!-- Header card and folds (scripts/build_doc_meta.py). The card: the block between a page's
       meta:start and meta:end comments becomes section.tsw-meta, its first table and the
       table in its "More about this page" fold the card; that fold is open on screens wider
       than 600 px and closed below, where the first table alone fits the first screen and
       the card sits directly under the page title.
       The folds: a link to an anchor inside a closed <details class="tsw-fold">, or to the
       heading a fold sits under (a technique on the generated techniques/ and
       detections/strategies/ pages), opens it; an open fold's label starts "Hide" and a
       closed one's "Show", so a reader scanning a page of folds sees which are open;
       printing opens every fold. -->

      function main() { return document.getElementById('main'); }

        var root = main();

        while ((c = walker.nextNode())) {

          box.className = 'tsw-meta';
          box.setAttribute('aria-label', 'About this page');
          var n = c.nextSibling;
          c.parentNode.insertBefore(box, n);
          while (n && !(n.nodeType === 8 && /^\s*meta:end\b/.test(n.nodeValue))) {
            var next = n.nextSibling;
            box.appendChild(n);
            n = next;

          Array.prototype.forEach.call(box.children, function (el) {
            var t = el.tagName === 'TABLE' ? el
              : (el.tagName === 'DETAILS' && el.classList.contains('tsw-meta-more') ? el.querySelector('table') : null);
            if (t) { t.classList.add('tsw-meta-card'); }
          });
          home = c;
          fitMore();
          return;
        }
      }
      // "More about this page": open (summary hidden) when wide, closed when 600 px or less.
      // At 600 px or less the card also moves up to sit directly under the page title, so it
      // starts on the first screen of a phone even under a long introduction; wider, it stays
      // where the page has it (after the introduction, as on GitHub).
      var wide = window.matchMedia ? window.matchMedia('(min-width: 601px)') : null;
      var home = null;   // the meta:start comment: where the card sits in the page
      function fitMore() {
        var box = document.querySelector('#main .tsw-meta');
        var d = box && box.querySelector(':scope > details.tsw-meta-more');

        if (wide.matches) { d.setAttribute('data-auto-open', ''); d.open = true; }
        else if (d.hasAttribute('data-auto-open')) { d.removeAttribute('data-auto-open'); d.open = false; }
        var h1 = home && home.parentNode && home.parentNode.querySelector(':scope > h1');
        var above = h1 && (h1.compareDocumentPosition(home) & Node.DOCUMENT_POSITION_FOLLOWING);
        var to = !wide.matches && above ? h1 : home;

        }

        var b = t;

        for (var s = b.nextElementSibling; s && !/^H[1-6]$/.test(s.tagName); s = s.nextElementSibling) {

      }

      // laid out, so on a long page its 500 ms scroll could stop with the heading up to a couple
      // of hundred pixels above the window (found by the P6 old-URL check). Once that scroll has
      // started and stopped (or nothing has moved for 1.5 s), line the heading up under the
      // navbar once, unless the reader has scrolled, clicked or pressed a key since the route
      // changed.

      ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) {

      }, true);
