<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="TeamStarWolf is a cybersecurity reference library covering offensive testing, defense, cloud, identity, governance, and AI security, cross-referenced to MITRE ATT&CK, D3FEND, and NIST SP 800-53.">
  <meta name="theme-color" content="#0b1220">
  <meta property="og:title" content="TeamStarWolf: Cybersecurity Reference Library">
  <meta property="og:description" content="A cybersecurity reference library cross-referenced to MITRE ATT&CK, with how-to guides, learning paths, and published mapping data.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://teamstarwolf.github.io/TeamStarWolf/">
  <meta property="og:site_name" content="TeamStarWolf">
  <!-- One card for every shared link: docsify serves a single index.html for all routes.
       Exported by scripts/build_brand_assets.py; og:image must be an absolute URL. -->
  <meta property="og:image" content="https://teamstarwolf.github.io/TeamStarWolf/assets/brand/og-1200x630.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The STARWOLF 64 logotype, with a red and white wolf head, on a dark navy background">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://teamstarwolf.github.io/TeamStarWolf/assets/brand/og-1200x630.jpg">
  <title>TeamStarWolf: Cybersecurity Reference Library</title>
  <!-- Interim icon: the red "64" star cut from the STARWOLF 64 logotype (scripts/build_brand_assets.py). -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon-180.png">
  <!-- Theme before first paint: a stored choice (this browser only), else the system preference,
       else dark. The key is namespaced because ATTACK-Navi shares this origin's localStorage. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('tsw-library-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" integrity="sha384-jCK82M2ExfkqAO/MYBKMjP1qC4AvZ4/Duf2gVWOy3RPn26uz+KW5I+9S39za1Fqv" crossorigin="anonymous">

  <style>
    /* ===================== Brand tokens =====================
       Colours come from the STARWOLF 64 art: navy stage #0b1220, flame red #fc0604, chrome
       green #acdf55, cream #fcf6b9, and the blue outline glow for links. Dark is the default;
       the light theme is chosen by the toggle (stored per browser) or, until a reader picks
       one, by prefers-color-scheme. Every text/background pair below is measured by
       scripts/check_contrast.py (WCAG 2.x ratios; CI fails under AA). Components use these
       tokens only: no colour literals below this block, except the cover banners. */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --tsw-bg:            #0b1220;
      --tsw-bg-alt:        #0d1526;
      --tsw-surface:       #111a2e;
      --tsw-surface-2:     #16223b;
      --tsw-border:        #26334f;
      --tsw-border-soft:   #1b2741;
      --tsw-sidebar-bg:    #0a1120;
      --tsw-nav-bg:        rgba(11, 18, 32, .88);

      --tsw-text:          #e6ebf7;
      --tsw-text-muted:    #a9b4cd;
      --tsw-text-dim:      #8b97b1;
      --tsw-heading:       #f4f7fd;
      --tsw-link:          #8fb0ff;   /* the banner's blue outline glow */
      --tsw-link-hover:    #c3d3ff;

      --tsw-red:           #fc0604;   /* accents and large text only */
      --tsw-red-text:      #ff4d4d;   /* red at body-text size */
      --tsw-green:         #acdf55;   /* chrome green: active and focus */
      --tsw-cream:         #fcf6b9;   /* hero text */
      --tsw-focus:         #acdf55;
      --tsw-btn-bg:        #de0303;   /* primary button; white text */
      --tsw-btn-bg-hover:  #c40202;
      --tsw-btn-fg:        #ffffff;

      --tsw-tint:          rgba(143, 176, 255, .08);
      --tsw-tint-strong:   rgba(143, 176, 255, .14);
      --tsw-row-alt:       rgba(255, 255, 255, .022);
      --tsw-row-hover:     rgba(143, 176, 255, .07);
      --tsw-selection:     rgba(172, 223, 85, .30);
      --tsw-shadow:        rgba(0, 0, 0, .45);
      --tsw-glow-a:        rgba(31, 72, 200, .12);
      --tsw-glow-b:        rgba(252, 6, 4, .05);

      --tsw-code-bg:       #172341;
      --tsw-code-fg:       #c9d7ff;
      --tsw-code-border:   #24345a;
      --tsw-pre-bg:        #08101f;
      --tsw-pre-fg:        #d7e3f4;
      --tsw-tok-comment:   #8b97b1;
      --tsw-tok-keyword:   #8fb0ff;
      --tsw-tok-string:    #acdf55;
      --tsw-tok-number:    #fcf6b9;
      --tsw-tok-function:  #ffb4a8;
      --tsw-tok-tag:       #ff8f85;
      --tsw-tok-operator:  #c9d7ff;

      --tsw-cover-bg:      radial-gradient(1100px 620px at 50% -10%, #16233d 0%, #0b1220 62%);
      --tsw-cover-title:   var(--tsw-cream);
      --tsw-scroll:        #26334f;
      --tsw-scroll-hover:  #34466c;

      --theme-color:       var(--tsw-link);
      --sidebar-width:     305px;
      --tsw-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --tsw-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Light: red on white is 4.06:1, so red stays an accent and red text uses #b80d0d. */
    :root[data-theme="light"] {
      color-scheme: light;
      --tsw-bg:            #f6f7fb;
      --tsw-bg-alt:        #eef1f7;
      --tsw-surface:       #ffffff;
      --tsw-surface-2:     #edf0f6;
      --tsw-border:        #cdd5e3;
      --tsw-border-soft:   #e2e7f0;
      --tsw-sidebar-bg:    #eef1f7;
      --tsw-nav-bg:        rgba(246, 247, 251, .92);

      --tsw-text:          #141c2e;
      --tsw-text-muted:    #3f4a63;
      --tsw-text-dim:      #566079;
      --tsw-heading:       #0b1220;
      --tsw-link:          #1f48c8;
      --tsw-link-hover:    #15338f;

      --tsw-red:           #c40202;
      --tsw-red-text:      #b80d0d;
      --tsw-green:         #2f6a12;
      --tsw-focus:         #1f48c8;
      --tsw-btn-bg:        #c40202;
      --tsw-btn-bg-hover:  #a30202;
      --tsw-btn-fg:        #ffffff;

      --tsw-tint:          rgba(31, 72, 200, .06);
      --tsw-tint-strong:   rgba(31, 72, 200, .10);
      --tsw-row-alt:       rgba(20, 28, 46, .03);
      --tsw-row-hover:     rgba(31, 72, 200, .06);
      --tsw-selection:     rgba(31, 72, 200, .20);
      --tsw-shadow:        rgba(20, 28, 46, .14);
      --tsw-glow-a:        rgba(31, 72, 200, .05);
      --tsw-glow-b:        rgba(196, 2, 2, .03);

      --tsw-code-bg:       #e8edf8;
      --tsw-code-fg:       #1b3a99;
      --tsw-code-border:   #d3dcef;
      --tsw-pre-bg:        #f1f4fa;
      --tsw-pre-fg:        #1a2236;
      --tsw-tok-comment:   #5d6880;
      --tsw-tok-keyword:   #1f48c8;
      --tsw-tok-string:    #2f6a12;
      --tsw-tok-number:    #8a4b00;
      --tsw-tok-function:  #8f1d1d;
      --tsw-tok-tag:       #b80d0d;
      --tsw-tok-operator:  #3f4a63;

      --tsw-cover-bg:      radial-gradient(1100px 620px at 50% -10%, #ffffff 0%, #eef2f9 62%);
      --tsw-cover-title:   #0b1220;
      --tsw-scroll:        #c3cbdb;
      --tsw-scroll-hover:  #a9b3c7;
    }

    html, body { background: var(--tsw-bg); }
    body {
      color: var(--tsw-text);
      font-family: var(--tsw-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* A faint glow so the navy field does not read as flat black */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 500px at 12% -8%, var(--tsw-glow-a), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, var(--tsw-glow-b), transparent 60%);
    }
    /* Lift the layout above the wash. Only z-index here: vue.css positions .content
       absolutely (left: 300px; right: 0), and forcing position: relative on it kept the
       300px offset but dropped right: 0, which pushed every desktop page 300px past the
       viewport. The mobile layout keeps its relative .content (see the 768px block). */
    .sidebar, .content, main { z-index: 1; }
    main { position: relative; }
    @media screen and (max-width: 768px) { .content { position: relative; } }

    /* ===================== Sidebar ===================== */
    .sidebar {
      background: var(--tsw-sidebar-bg);
      border-right: 1px solid var(--tsw-border);
      padding-top: 0;
      /* Pin the sidebar out of document flow on the cover route. Without this, its
         full height (~8,000px of links) stacks between the cover and the homepage,
         leaving a void when scrolling. The cover paints above it (z-index below). */
      position: fixed; top: 0; bottom: 0; z-index: 10;
    }
    section.cover { position: relative; z-index: 20; }
    .sidebar > h1 {
      margin: 0; padding: 20px 22px 14px;
      border-bottom: 1px solid var(--tsw-border-soft);
      background: var(--tsw-tint);
    }
    .sidebar > h1 .app-name-link {
      color: var(--tsw-heading); font-weight: 800; font-size: 1.18rem;
      letter-spacing: -.015em; display: inline-flex; align-items: center; gap: .5rem;
    }
    .sidebar > h1 .app-name-link:hover { color: var(--tsw-link); }

    .sidebar ul li a {
      color: var(--tsw-text-muted);
      font-size: .875rem; line-height: 1.45;
      padding: 4px 0; border: 0;
      transition: color .13s ease, transform .13s ease;
    }
    .sidebar ul li a:hover { color: var(--tsw-link); transform: translateX(2px); }
    .sidebar ul li.active > a {
      color: var(--tsw-green) !important;
      font-weight: 650;
      border-right: 2px solid var(--tsw-green);
    }
    /* docsify wraps every sidebar item in <p>; keep those neutral */
    .sidebar ul li p {
      margin: 0;
      text-transform: none;
      font-size: inherit;
      letter-spacing: normal;
      color: inherit;
    }
    /* Section headings = the bold entries in _sidebar.md */
    .sidebar ul li > p > strong,
    .sidebar ul li > strong {
      display: block;
      color: var(--tsw-text-dim);
      font-size: .705rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .09em;
      margin: 18px 0 6px;
    }
    .sidebar hr { border-color: var(--tsw-border-soft); margin: 14px 0; }
    .sidebar::-webkit-scrollbar { width: 9px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--tsw-scroll); border-radius: 9px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background: var(--tsw-scroll-hover); }
    .sidebar-toggle { background: var(--tsw-sidebar-bg); color: var(--tsw-link); }
    .sidebar-toggle span { background-color: var(--tsw-link); }
    body.close .sidebar-toggle { background-color: transparent; }

    /* ===================== Search ===================== */
    .search {
      margin: 0; padding: 14px 16px 12px;
      border-bottom: 1px solid var(--tsw-border-soft);
      background: transparent;
    }
    .search .input-wrap { background: transparent; }
    .search input {
      background: var(--tsw-surface);
      border: 1px solid var(--tsw-border);
      border-radius: 9px;
      color: var(--tsw-text);
      font-size: .875rem;
      padding: 10px 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search input::placeholder { color: var(--tsw-text-dim); opacity: 1; }
    .search input:focus {
      outline: none;
      border-color: var(--tsw-focus);
      box-shadow: 0 0 0 3px var(--tsw-tint-strong);
    }
    .search .clear-button svg circle { fill: var(--tsw-text-dim); }
    .search .results-panel { background: transparent; color: var(--tsw-text-muted); }
    .search .matching-post { border-bottom: 1px solid var(--tsw-border-soft); padding: 10px 0; }
    .search .matching-post:last-child { border-bottom: 0; }
    .search p.title { color: var(--tsw-link); font-weight: 650; font-size: .86rem; }
    .search p { font-size: .8rem; color: var(--tsw-text-dim); }
    .search p.empty { color: var(--tsw-text-muted); }
    .search .search-keyword { color: var(--tsw-red-text); font-style: normal; font-weight: 650; }
    .search .clear-button { cursor: pointer; }

    /* ===================== Top navbar ===================== */
    .app-nav {
      margin: 0; padding: 0;
      position: fixed; top: 0; right: 0; left: var(--sidebar-width);
      /* Above .content (z-index 1, later in the DOM), so the links and their dropdowns
         take the pointer; still below the sidebar (10) and the cover (20). */
      z-index: 5;
      background: var(--tsw-nav-bg);
      backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid var(--tsw-border);
      text-align: right;
      height: 52px; line-height: 52px;
      padding-right: 64px;   /* room for the theme button (#tsw-theme) */
    }
    .app-nav li ul { background: var(--tsw-surface); border: 1px solid var(--tsw-border); border-radius: 10px; box-shadow: 0 10px 28px var(--tsw-shadow); }
    .app-nav li ul li { line-height: 1.6; }
    .app-nav a {
      color: var(--tsw-text-muted); font-size: .85rem; font-weight: 550;
      padding: 6px 2px; transition: color .13s;
    }
    .app-nav li ul a { color: var(--tsw-text-muted); }
    .app-nav a:hover, .app-nav li ul a:hover { color: var(--tsw-link); }
    .app-nav a.active { color: var(--tsw-heading); border-bottom: 2px solid var(--tsw-red); }
    .app-nav li { margin: 0 10px; }
    /* dropdown parents are links to their first menu item; caret marks the menu */
    .app-nav li:has(> ul) > a::after { content: ' \25BE'; font-size: .72em; opacity: .65; }
    body.close .app-nav { left: 0; }
    /* Keyboard: a dropdown opens while focus is inside it (vue.css opens it on hover only),
       or when its parent link is toggled with Space (see the keyboard plugin below). */
    .app-nav li:focus-within > ul, .app-nav li.tsw-open > ul { display: block; }
    .app-nav li.tsw-shut > ul { display: none; }
    /* The repository is linked from the navbar ("GitHub") and from every page's
       "Edit this page on GitHub" line; the corner badge sat under the theme button. */
    .github-corner { display: none; }

    /* ===================== Theme toggle ===================== */
    #tsw-theme {
      position: fixed; top: 8px; right: 14px; z-index: 30;
      width: 36px; height: 36px; padding: 0; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--tsw-surface); color: var(--tsw-text);
      border: 1px solid var(--tsw-border); cursor: pointer;
      transition: border-color .13s, color .13s;
    }
    #tsw-theme:hover { border-color: var(--tsw-link); color: var(--tsw-link); }
    #tsw-theme svg { width: 18px; height: 18px; display: block; }
    #tsw-theme .tsw-i-moon { display: none; }
    :root[data-theme="light"] #tsw-theme .tsw-i-sun { display: none; }
    :root[data-theme="light"] #tsw-theme .tsw-i-moon { display: block; }

    /* ===================== Keyboard focus and skip link ===================== */
    a:focus-visible, button:focus-visible, summary:focus-visible,
    [tabindex]:focus-visible, .sidebar-toggle:focus-visible, input:focus-visible {
      outline: 2px solid var(--tsw-focus); outline-offset: 2px; border-radius: 4px;
    }
    #main:focus, .markdown-section h1:focus, .markdown-section h2:focus { outline: none; }
    .tsw-skip {
      position: fixed; top: 8px; left: 8px; z-index: 100;
      padding: .55rem 1rem; border-radius: 8px;
      background: var(--tsw-surface-2); color: var(--tsw-text); border: 1px solid var(--tsw-focus);
      font-weight: 650; text-decoration: none;
      transform: translateY(-160%);
    }
    .tsw-skip:focus { transform: none; }
    .tsw-noscript { max-width: 760px; margin: 3rem auto; padding: 0 16px; color: var(--tsw-text); line-height: 1.6; }
    .tsw-noscript a { color: var(--tsw-link); }
    .tsw-sr-only {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ===================== Content ===================== */
    .content { background: transparent; padding-top: 52px; }
    .markdown-section {
      max-width: 1080px;
      padding: 34px 40px 80px;
      color: var(--tsw-text);
      font-size: 15.5px;
      line-height: 1.72;
    }
    .markdown-section > *:first-child { margin-top: 0; }

    .markdown-section h1, .markdown-section h2,
    .markdown-section h3, .markdown-section h4 {
      color: var(--tsw-heading); font-weight: 750; letter-spacing: -.018em; line-height: 1.25;
    }
    .markdown-section h1 { font-size: 2.05rem; margin: 0 0 1.1rem; }
    .markdown-section h2 {
      font-size: 1.5rem; margin: 2.6rem 0 1rem;
      padding-bottom: .45rem; border-bottom: 1px solid var(--tsw-border);
    }
    .markdown-section h3 { font-size: 1.18rem; margin: 2rem 0 .75rem; }
    .markdown-section h4 { font-size: 1.02rem; margin: 1.5rem 0 .6rem; color: var(--tsw-text-muted); }
    .markdown-section h2 + h3 { margin-top: 1.1rem; }
    /* docsify wraps heading text in a.anchor > span and vue.css paints that span #34495e
       (2.02:1 on the navy field). Let it take the heading's own colour instead. */
    .markdown-section h1 .anchor, .markdown-section h2 .anchor, .markdown-section h3 .anchor,
    .markdown-section h4 .anchor, .markdown-section h5 .anchor, .markdown-section h6 .anchor,
    .markdown-section h1 .anchor span, .markdown-section h2 .anchor span,
    .markdown-section h3 .anchor span, .markdown-section h4 .anchor span,
    .markdown-section h5 .anchor span, .markdown-section h6 .anchor span { color: inherit; }
    .markdown-section h5, .markdown-section h6 { color: var(--tsw-text-muted); }

    .markdown-section a { color: var(--tsw-link); text-decoration: none; font-weight: 500; }
    .markdown-section a:hover { color: var(--tsw-link-hover); text-decoration: underline; text-underline-offset: 3px; }
    .markdown-section p, .markdown-section li { color: var(--tsw-text); }
    .markdown-section strong { color: var(--tsw-heading); font-weight: 680; }
    .markdown-section em { color: var(--tsw-text-muted); }
    .markdown-section hr { border: 0; border-top: 1px solid var(--tsw-border); margin: 2.4rem 0; }
    .markdown-section kbd {
      font-family: var(--tsw-mono); font-size: .8em; padding: .05em .4em;
      border: 1px solid var(--tsw-border); border-bottom-width: 2px; border-radius: 5px;
      background: var(--tsw-surface); color: var(--tsw-text);
    }

    /* Blockquote: used heavily for doc intros */
    .markdown-section blockquote {
      background: linear-gradient(90deg, var(--tsw-tint-strong), var(--tsw-tint));
      border-left: 3px solid var(--tsw-link);
      border-radius: 0 10px 10px 0;
      margin: 1.5rem 0; padding: 1rem 1.2rem;
      color: var(--tsw-text);
    }
    .markdown-section blockquote p { margin: .35rem 0; color: var(--tsw-text); }

    /* ---------- Tables: this library is table-heavy ---------- */
    .markdown-section table {
      display: block; width: 100%; overflow-x: auto;
      border-collapse: collapse; border-spacing: 0;
      margin: 1.4rem 0; font-size: .885rem;
      border: 1px solid var(--tsw-border); border-radius: 10px;
    }
    .markdown-section thead { background: var(--tsw-surface-2); }
    .markdown-section th {
      background: var(--tsw-surface-2);
      color: var(--tsw-heading); font-weight: 680; text-align: left;
      padding: 10px 14px; white-space: nowrap;
      border: 0; border-bottom: 1px solid var(--tsw-border);
      position: sticky; top: 0; z-index: 2;
    }
    .markdown-section td {
      padding: 9px 14px; border: 0;
      border-bottom: 1px solid var(--tsw-border-soft);
      vertical-align: top; color: var(--tsw-text);
    }
    .markdown-section tr:last-child td { border-bottom: 0; }
    .markdown-section tbody tr { background: transparent; transition: background .12s; }
    .markdown-section tbody tr:nth-child(even) { background: var(--tsw-row-alt); }
    .markdown-section tbody tr:hover { background: var(--tsw-row-hover); }

    /* ---------- Code ---------- */
    .markdown-section code {
      font-family: var(--tsw-mono);
      background: var(--tsw-code-bg);
      color: var(--tsw-code-fg);
      border: 1px solid var(--tsw-code-border);
      border-radius: 5px;
      padding: .12em .42em; font-size: .855em;
    }
    .markdown-section pre {
      background: var(--tsw-pre-bg);
      border: 1px solid var(--tsw-border);
      border-radius: 11px;
      margin: 1.3rem 0; padding: 0;
    }
    .markdown-section pre > code {
      background: transparent; border: 0; color: var(--tsw-pre-fg);
      font-size: .845rem; line-height: 1.65; padding: 1.05rem 1.2rem; display: block;
    }
    .markdown-section pre::after { display: none; }
    /* Literal text renders as typed: no programming ligatures in code. */
    .markdown-section code, .markdown-section pre {
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
    }
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--tsw-tok-comment); }
    .token.property, .token.tag, .token.constant, .token.symbol, .token.deleted { color: var(--tsw-tok-tag); }

        pathNamespaces: []
      },

      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },

      plugins: [
        // "Edit on GitHub" + keyboard shortcut hint on every page
        function (hook, vm) {
          hook.beforeEach(function (html) {
            var url = 'https://github.com/TeamStarWolf/TeamStarWolf/blob/main/' + vm.route.file;
            return '> [Edit this page on GitHub](' + url + '). Press <kbd>/</kbd> to search.\n\n' + html;
          });
        },
        // Back-to-top behaviour
        function (hook) {
          hook.doneEach(function () {
            var btn = document.getElementById('tsw-top');
            var body = document.querySelector('.content') || window;
            function onScroll() {
              var y = window.scrollY || document.documentElement.scrollTop;
              btn.classList.toggle('show', y > 700);
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
            btn.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
          });
        },
        // Tab titles: "<page H1> | TeamStarWolf". docsify titles a page after its sidebar
        // entry, so a page the sidebar does not list (every generated mitre/ page) was "Home".
        function (hook, vm) {
          var siteTitle = document.title;
          hook.doneEach(function () {
            setTimeout(function () {
              var path = vm.route.path;
              if (path === '/' || /^\/HOME(\.md)?$/i.test(path)) { document.title = siteTitle; return; }
              var h1 = document.querySelector('#main h1');
              var name = h1 ? h1.textContent.replace(/\s+/g, ' ').trim() : '';
              if (!name) { name = document.title.split(' | ')[0]; }
              document.title = name + ' | TeamStarWolf';
            }, 0);
          });
        },
        // Sidebar: bring the current page's entry into view on load and on each route change
        function (hook) {
          hook.doneEach(function () {
            setTimeout(function () {
              var sb = document.querySelector('.sidebar');
              var a = sb && sb.querySelector('.sidebar-nav li.active > a');
              if (!a) { return; }
              var sr = sb.getBoundingClientRect(), ar = a.getBoundingClientRect();
              if (ar.top < sr.top + 80 || ar.bottom > sr.bottom - 40) {
                sb.scrollTop += ar.top - sr.top - sb.clientHeight / 3;
              }
            }, 0);
          });
        },
        // Keyboard and landmarks: skip link first in tab order, labelled navigation,
        // menu state on the navbar dropdown parents (key handling is below the config)
        function (hook) {
          hook.doneEach(function () {
            var skip = document.querySelector('.tsw-skip');
            if (!skip) {
              skip = document.createElement('a');
              skip.className = 'tsw-skip';
              skip.href = '#main';
              skip.textContent = 'Skip to content';
              skip.addEventListener('click', function (e) {
                e.preventDefault();
                var main = document.getElementById('main');
                if (main) { main.setAttribute('tabindex', '-1'); main.focus(); main.scrollIntoView(); }
              });
            }
            if (document.body.firstElementChild !== skip) { document.body.insertBefore(skip, document.body.firstChild); }
            document.querySelectorAll('nav.app-nav').forEach(function (n) { n.setAttribute('aria-label', 'Site'); });
            var sbNav = document.querySelector('.sidebar-nav');
            if (sbNav) { sbNav.setAttribute('role', 'navigation'); sbNav.setAttribute('aria-label', 'Library contents'); }
            document.querySelectorAll('.app-nav li').forEach(function (li) {
              var menu = li.querySelector(':scope > ul'), link = li.querySelector(':scope > a');
              if (menu && link) { link.setAttribute('aria-haspopup', 'true'); link.setAttribute('aria-expanded', li.classList.contains('tsw-open') ? 'true' : 'false'); }
            });
          });
        },
        // Navbar height: between 769px and 1099px the navbar wraps to fit its items. Publish
        // its height as --tsw-nav-h (the page's top padding there) and keep heading anchors
        // clear of it (topMargin, 60 when the bar is one 52px row).
        function (hook, vm) {
          function measure() {
            var nav = document.querySelector('nav.app-nav');
            var h = nav && window.innerWidth > 768 ? nav.offsetHeight : 52;
            document.documentElement.style.setProperty('--tsw-nav-h', h + 'px');
            var margin = Math.max(60, h + 8);
            vm.config.topMargin = margin;
            window.$docsify.topMargin = margin;
          }
          hook.doneEach(measure);
          window.addEventListener('resize', measure, { passive: true });
        }
      ]
    };

    // Theme toggle. The head script already applied the stored or system theme; this keeps
    // the button label, the browser theme-color and other open tabs in step, follows a
    // system change until the reader picks a theme, and prints in the light theme.
    (function () {
      var KEY = 'tsw-library-theme';
      var root = document.documentElement;
      var btn = document.getElementById('tsw-theme');
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
      function stored() {
        try { var t = localStorage.getItem(KEY); return (t === 'light' || t === 'dark') ? t : null; } catch (e) { return null; }
      }
      function apply(t) {
        root.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) { meta.setAttribute('content', t === 'light' ? '#f6f7fb' : '#0b1220'); }
        var label = 'Switch to ' + (t === 'light' ? 'dark' : 'light') + ' theme';
        if (btn) { btn.setAttribute('aria-label', label); btn.setAttribute('title', label); }
      }
      apply(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
      if (btn) {
        btn.addEventListener('click', function () {
          var t = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          try { localStorage.setItem(KEY, t); } catch (e) {}
          apply(t);
        });
      }
      if (mq) {
        var follow = function (e) { if (!stored()) { apply(e.matches ? 'light' : 'dark'); } };
        if (mq.addEventListener) { mq.addEventListener('change', follow); } else if (mq.addListener) { mq.addListener(follow); }
      }
      window.addEventListener('storage', function (e) {
        if (e.key === KEY && (e.newValue === 'light' || e.newValue === 'dark')) { apply(e.newValue); }
      });
      var beforePrint = null;
      window.addEventListener('beforeprint', function () { beforePrint = root.getAttribute('data-theme'); root.setAttribute('data-theme', 'light'); });
      window.addEventListener('afterprint', function () { if (beforePrint) { apply(beforePrint); beforePrint = null; } });
    })();

    // Bring the sidebar search box into view and focus it. On the cover the sidebar sits
    // under the cover, so scroll to the content first; on a narrow screen open the sidebar.
    function tswFocusSearch() {
      var input = document.querySelector('.search input');
      if (!input) { return false; }
      var cover = document.querySelector('section.cover.show');
      var main = document.querySelector('section.content');
      if (cover && main && window.scrollY < cover.offsetHeight) { main.scrollIntoView(); }
      if (window.innerWidth <= 768 && !document.body.classList.contains('close')) {
        document.body.classList.add('close');
      }
      var sb = input.closest('.sidebar');
      if (sb) { sb.scrollTop = 0; }   // the box sits at the top of the sidebar
      input.focus({ preventScroll: true }); input.select();
      return true;
    }
    // The cover's Search button; its href (the reference index) is the fallback
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.tsw-cover-search');
      if (btn && tswFocusSearch()) { e.preventDefault(); }
    });

    // "/" or Ctrl+K (Cmd+K on macOS) focuses search, Esc clears it
    document.addEventListener('keydown', function (e) {
      var el = document.activeElement;
      var typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
      if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K'))) {
        if (tswFocusSearch()) { e.preventDefault(); }
      }
      if (e.key === 'Escape') {
        var i2 = document.querySelector('.search input');
        if (i2 && document.activeElement === i2) { i2.value = ''; i2.blur(); }
      }
    });

    // Navbar dropdowns by keyboard. Tab into a menu and it opens (CSS :focus-within);
    // Enter follows the parent link as before; Space opens or closes the menu without
    // leaving the page; Escape closes it and returns focus to the parent link.
    (function () {
      function menuItem(el) {
        var li = el && el.closest && el.closest('.app-nav li');
        while (li && !li.querySelector(':scope > ul')) { li = li.parentElement && li.parentElement.closest('.app-nav li'); }
        return li;
      }
      function setOpen(li, open) {
        li.classList.toggle('tsw-open', open);
        li.classList.toggle('tsw-shut', !open);
        var link = li.querySelector(':scope > a');
        if (link) { link.setAttribute('aria-expanded', open ? 'true' : 'false'); }
      }
      document.addEventListener('keydown', function (e) {
        var li = menuItem(document.activeElement);
        if (!li) { return; }
        var isParent = document.activeElement === li.querySelector(':scope > a');
        if ((e.key === ' ' || e.key === 'Spacebar') && isParent) {
          e.preventDefault();
          setOpen(li, getComputedStyle(li.querySelector(':scope > ul')).display === 'none');
        } else if (e.key === 'Escape') {
          setOpen(li, false);
          li.querySelector(':scope > a').focus();
        }
      });
      document.addEventListener('mouseover', function (e) {
        var li = menuItem(e.target);
        if (li && li.classList.contains('tsw-shut')) { li.classList.remove('tsw-shut'); }
      });
      document.addEventListener('focusin', function (e) {
        var li = menuItem(e.target);
        document.querySelectorAll('.app-nav li.tsw-open, .app-nav li.tsw-shut').forEach(function (o) {
          if (o !== li) { o.classList.remove('tsw-open', 'tsw-shut'); }
        });
        document.querySelectorAll('.app-nav li > a[aria-haspopup]').forEach(function (a) {
          var owner = a.parentElement;
          a.setAttribute('aria-expanded', owner === li && !owner.classList.contains('tsw-shut') ? 'true' : 'false');
        });
      });
    })();
  </script>
