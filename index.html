<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="TeamStarWolf — an open, threat-informed cybersecurity reference library. 139 in-depth references across offense, defense, cloud, identity, GRC and AI security, anchored to MITRE ATT&CK, ATLAS, Engage, D3FEND and NIST 800-53.">
  <meta name="theme-color" content="#0b1220">
  <meta property="og:title" content="TeamStarWolf — Cybersecurity Reference Library">
  <meta property="og:description" content="An open, threat-informed cybersecurity reference library — 139 in-depth references anchored to MITRE ATT&CK, ATLAS, Engage and D3FEND.">
  <meta property="og:type" content="website">
  <title>TeamStarWolf — Cybersecurity Reference Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* ===================== TeamStarWolf dark theme ===================== */
    :root {
      /* Core palette — deep navy field, cyan/violet Star Wolf accents */
      --tsw-bg:            #0b1220;
      --tsw-bg-alt:        #0f172a;
      --tsw-surface:       #131d33;
      --tsw-surface-2:     #18243d;
      --tsw-border:        #24324e;
      --tsw-border-soft:   #1b2740;

      --tsw-text:          #e6edf7;
      --tsw-text-muted:    #9fb0ca;
      --tsw-text-dim:      #7286a4;

      --tsw-accent:        #38bdf8;   /* sky   */
      --tsw-accent-2:      #a78bfa;   /* violet*/
      --tsw-accent-3:      #22d3ee;   /* cyan  */
      --tsw-warn:          #fbbf24;
      --tsw-danger:        #f87171;
      --tsw-ok:            #4ade80;

      --theme-color:       var(--tsw-accent);
      --sidebar-width:     305px;

      --tsw-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --tsw-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body { background: var(--tsw-bg); }
    body {
      color: var(--tsw-text);
      font-family: var(--tsw-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Subtle starfield/aurora wash so it doesn't read as flat black */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 500px at 12% -8%, rgba(56,189,248,.10), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(167,139,250,.09), transparent 60%),
        radial-gradient(700px 500px at 50% 110%, rgba(34,211,238,.05), transparent 60%);
    }
    .sidebar, .content, .app-nav, main { position: relative; z-index: 1; }

    /* ===================== Sidebar ===================== */
    .sidebar {
      background: linear-gradient(180deg, #0c1526 0%, #0a1120 100%);
      border-right: 1px solid var(--tsw-border);
      padding-top: 0;
      /* Pin the sidebar out of document flow on the cover route. Without this, its
         full height (~8,000px of links) stacks between the cover and the homepage,
         leaving a black void when scrolling. The cover paints above it (z-index below). */
      position: fixed; top: 0; bottom: 0; z-index: 10;
    }
    section.cover { position: relative; z-index: 20; }
    .sidebar > h1 {
      margin: 0; padding: 20px 22px 14px;
      border-bottom: 1px solid var(--tsw-border-soft);
      background: rgba(56,189,248,.045);
    }
    .sidebar > h1 .app-name-link {
      color: var(--tsw-text); font-weight: 800; font-size: 1.18rem;
      letter-spacing: -.015em; display: inline-flex; align-items: center; gap: .5rem;
    }
    .sidebar > h1 .app-name-link:hover { color: var(--tsw-accent); }

    .sidebar ul li a {
      color: var(--tsw-text-muted);
      font-size: .875rem; line-height: 1.45;
      padding: 4px 0; border: 0;
      transition: color .13s ease, transform .13s ease;
    }
    .sidebar ul li a:hover { color: var(--tsw-accent); transform: translateX(2px); }
    .sidebar ul li.active > a {
      color: var(--tsw-accent) !important;
      font-weight: 650;
      border-right: 2px solid var(--tsw-accent);
    }
    /* docsify wraps every sidebar item in <p> — keep those neutral */
    .sidebar ul li p {
      margin: 0;
      text-transform: none;
      font-size: inherit;
      letter-spacing: normal;
      color: inherit;
    }
    /* Section headings = the bold entries in _sidebar.md */
    .sidebar ul li > p > strong,
    .sidebar ul li > strong {
      display: block;
      color: var(--tsw-text-dim);
      font-size: .705rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .09em;
      margin: 18px 0 6px;
    }
    .sidebar hr { border-color: var(--tsw-border-soft); margin: 14px 0; }
    .sidebar::-webkit-scrollbar { width: 9px; }
    .sidebar::-webkit-scrollbar-thumb { background: #24324e; border-radius: 9px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background: #33456b; }
    .sidebar-toggle { background: transparent; color: var(--tsw-accent); }
    .sidebar-toggle span { background-color: var(--tsw-accent); }

    /* ===================== Search ===================== */
    .search {
      margin: 0; padding: 14px 16px 12px;
      border-bottom: 1px solid var(--tsw-border-soft);
      background: rgba(255,255,255,.015);
    }
    .search .input-wrap { background: transparent; }
    .search input {
      background: var(--tsw-surface);
      border: 1px solid var(--tsw-border);
      border-radius: 9px;
      color: var(--tsw-text);
      font-size: .875rem;
      padding: 10px 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search input::placeholder { color: var(--tsw-text-dim); }
    .search input:focus {
      outline: none;
      border-color: var(--tsw-accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,.16);
    }
    .search .results-panel { background: transparent; color: var(--tsw-text-muted); }
    .search .matching-post { border-bottom: 1px solid var(--tsw-border-soft); padding: 10px 0; }
    .search .matching-post:last-child { border-bottom: 0; }
    .search p.title { color: var(--tsw-accent); font-weight: 650; font-size: .86rem; }
    .search p { font-size: .8rem; color: var(--tsw-text-dim); }
    .search .clear-button { cursor: pointer; }

    /* ===================== Top navbar ===================== */
    .app-nav {
      margin: 0; padding: 0;
      position: fixed; top: 0; right: 0; left: var(--sidebar-width);
      background: rgba(11,18,32,.82);
      backdrop-filter: saturate(160%) blur(12px);
      -webkit-backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid var(--tsw-border);
      text-align: right;
      height: 52px; line-height: 52px;
      padding-right: 22px;
    }
    .app-nav li ul { background: var(--tsw-surface); border: 1px solid var(--tsw-border); border-radius: 10px; }
    .app-nav a {
      color: var(--tsw-text-muted); font-size: .85rem; font-weight: 550;
      padding: 6px 2px; transition: color .13s;
    }
    .app-nav a:hover { color: var(--tsw-accent); }
    .app-nav li { margin: 0 10px; }
    /* dropdown parents are links to their first menu item; caret marks the menu */
    .app-nav li:has(> ul) > a::after { content: ' ▾'; font-size: .72em; opacity: .65; }
    body.close .app-nav { left: 0; }

    /* ===================== Content ===================== */
    .content { background: transparent; padding-top: 52px; }
    .markdown-section {
      max-width: 1080px;
      padding: 34px 40px 80px;
      color: var(--tsw-text);
      font-size: 15.5px;
      line-height: 1.72;
    }
    .markdown-section > *:first-child { margin-top: 0; }

    .markdown-section h1, .markdown-section h2,
    .markdown-section h3, .markdown-section h4 {
      color: #f2f7ff; font-weight: 750; letter-spacing: -.018em; line-height: 1.25;
    }
    .markdown-section h1 { font-size: 2.05rem; margin: 0 0 1.1rem; }
    .markdown-section h2 {
      font-size: 1.5rem; margin: 2.6rem 0 1rem;
      padding-bottom: .45rem; border-bottom: 1px solid var(--tsw-border);
    }
    .markdown-section h3 { font-size: 1.18rem; margin: 2rem 0 .75rem; color: #e8f0fb; }
    .markdown-section h4 { font-size: 1.02rem; margin: 1.5rem 0 .6rem; color: var(--tsw-text-muted); }
    .markdown-section h2 + h3 { margin-top: 1.1rem; }

    .markdown-section a { color: var(--tsw-accent); text-decoration: none; font-weight: 500; }
    .markdown-section a:hover { color: var(--tsw-accent-3); text-decoration: underline; text-underline-offset: 3px; }
    .markdown-section p, .markdown-section li { color: var(--tsw-text); }
    .markdown-section strong { color: #fff; font-weight: 680; }
    .markdown-section em { color: var(--tsw-text-muted); }
    .markdown-section hr { border: 0; border-top: 1px solid var(--tsw-border); margin: 2.4rem 0; }

    /* Blockquote — used heavily for doc intros */
    .markdown-section blockquote {
      background: linear-gradient(90deg, rgba(56,189,248,.09), rgba(56,189,248,.02));
      border-left: 3px solid var(--tsw-accent);
      border-radius: 0 10px 10px 0;
      margin: 1.5rem 0; padding: 1rem 1.2rem;
      color: var(--tsw-text);
    }
    .markdown-section blockquote p { margin: .35rem 0; color: var(--tsw-text); }

    /* ---------- Tables: this library is table-heavy ---------- */
    .markdown-section table {
      display: block; width: 100%; overflow-x: auto;
      border-collapse: collapse; border-spacing: 0;
      margin: 1.4rem 0; font-size: .885rem;
      border: 1px solid var(--tsw-border); border-radius: 10px;
    }
    .markdown-section thead { background: var(--tsw-surface-2); }
    .markdown-section th {
      background: var(--tsw-surface-2);
      color: #eaf2ff; font-weight: 680; text-align: left;
      padding: 10px 14px; white-space: nowrap;
      border: 0; border-bottom: 1px solid var(--tsw-border);
      position: sticky; top: 0; z-index: 2;
    }
    .markdown-section td {
      padding: 9px 14px; border: 0;
      border-bottom: 1px solid var(--tsw-border-soft);
      vertical-align: top; color: var(--tsw-text);
    }
    .markdown-section tr:last-child td { border-bottom: 0; }
    .markdown-section tbody tr { background: transparent; transition: background .12s; }
    .markdown-section tbody tr:nth-child(even) { background: rgba(255,255,255,.022); }
    .markdown-section tbody tr:hover { background: rgba(56,189,248,.075); }

    /* ---------- Code ---------- */
    .markdown-section code {
      font-family: var(--tsw-mono);
      background: rgba(56,189,248,.11);
      color: #7dd3fc;
      border: 1px solid rgba(56,189,248,.16);
      border-radius: 5px;
      padding: .12em .42em; font-size: .855em;
    }
    .markdown-section pre {
      background: #08101f;
      border: 1px solid var(--tsw-border);
      border-radius: 11px;
      margin: 1.3rem 0; padding: 0;
    }
    .markdown-section pre > code {
      background: transparent; border: 0; color: #d7e3f4;
      font-size: .845rem; line-height: 1.65; padding: 1.05rem 1.2rem; display: block;
    }
    .markdown-section pre::after { display: none; }
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #64748b; }
    .token.property, .token.tag, .token.constant, .token.symbol, .token.deleted { color: #f472b6; }
    .token.boolean, .token.number { color: #fbbf24; }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: #86efac; }
    .token.operator, .token.entity, .token.url, .token.variable { color: #7dd3fc; }
    .token.atrule, .token.attr-value, .token.function, .token.class-name { color: #a78bfa; }
    .token.keyword { color: #38bdf8; }

    .docsify-copy-code-button {
      background: var(--tsw-surface-2) !important;
      color: var(--tsw-text-muted) !important;
      border: 1px solid var(--tsw-border) !important;
      border-radius: 0 10px 0 8px !important;
      font-size: .74rem !important;
    }
    .docsify-copy-code-button:hover { color: var(--tsw-accent) !important; }

    /* ---------- Cover page ---------- */
    section.cover {
      background: radial-gradient(1100px 620px at 50% -10%, #16233d 0%, #0b1220 62%) !important;
    }
    section.cover .cover-main { max-width: 900px; }
    section.cover h1 {
      font-size: 3.4rem; font-weight: 850; letter-spacing: -.035em;
      background: linear-gradient(96deg, #38bdf8 0%, #a78bfa 55%, #22d3ee 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: .5rem;
    }
    section.cover h1 a { color: inherit; }
    section.cover blockquote p { font-size: 1.16rem; color: var(--tsw-text-muted); }
    section.cover .cover-main > p:last-child a {
      border-radius: 10px; font-size: .93rem; font-weight: 640;
      padding: .62rem 1.5rem; margin: .38rem .3rem;
      border: 1px solid var(--tsw-border); color: var(--tsw-text);
      transition: transform .13s, box-shadow .18s, border-color .13s;
    }
    section.cover .cover-main > p:last-child a:last-child {
      background: linear-gradient(96deg, var(--tsw-accent), var(--tsw-accent-2));
      border-color: transparent; color: #08101f; font-weight: 700;
    }
    section.cover .cover-main > p:last-child a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56,189,248,.22);
      border-color: var(--tsw-accent);
    }
    section.cover ul { color: var(--tsw-text-muted); }
    section.cover ul li { margin: .35rem 0; }

    /* ---------- Pagination ---------- */
    .pagination-item-title { color: var(--tsw-text-muted) !important; }
    .pagination-item-label { color: var(--tsw-accent) !important; }
    .docsify-pagination-container { border-top: 1px solid var(--tsw-border); }

    /* ---------- Misc ---------- */
    ::selection { background: rgba(56,189,248,.3); }
    img { max-width: 100%; }
    .markdown-section img[src*="shields.io"] { display: inline-block; margin: 2px 1px; vertical-align: middle; }

    /* Back-to-top */
    #tsw-top {
      position: fixed; right: 22px; bottom: 22px; z-index: 40;
      width: 40px; height: 40px; border-radius: 11px;
      display: none; align-items: center; justify-content: center;
      background: var(--tsw-surface-2); border: 1px solid var(--tsw-border);
      color: var(--tsw-accent); cursor: pointer; font-size: 17px;
      transition: transform .13s, box-shadow .18s;
    }
    #tsw-top:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.45); }
    #tsw-top.show { display: flex; }

    /* ---------- Responsive ---------- */
    @media screen and (max-width: 768px) {
      .app-nav { left: 0; padding-right: 12px; height: 48px; line-height: 48px; }
      .app-nav li { margin: 0 7px; }
      .app-nav a { font-size: .8rem; }
      .markdown-section { padding: 26px 18px 64px; font-size: 15px; }
      .markdown-section h1 { font-size: 1.7rem; }
      .markdown-section h2 { font-size: 1.3rem; }
      section.cover h1 { font-size: 2.3rem; }
      .content { padding-top: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    /* ===== tsw-home components (additive) =====
       Used only by HOME.md (and disciplines/README.md). New .tsw-* classes only —
       nothing below touches the selectors that style the other 139 docs.
       All transitions are covered by the prefers-reduced-motion kill-switch above.
       Every selector is prefixed .markdown-section so these rules out-rank the
       generic .markdown-section a link styling without touching it. */

    /* --- Hero band --- */
    .markdown-section .tsw-hero {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem 1.6rem; flex-wrap: wrap;
      position: relative; padding: .2rem 0 1.35rem; margin: .4rem 0 1.7rem;
    }
    .markdown-section .tsw-hero::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--tsw-accent), var(--tsw-accent-2));
    }
    .markdown-section .tsw-hero-id { display: flex; align-items: flex-start; gap: .85rem; flex: 1 1 380px; min-width: 0; }
    .markdown-section .tsw-hero-glyph { font-size: 2.15rem; line-height: 1.15; }
    .markdown-section .tsw-hero-title {
      font-size: 1.6rem; font-weight: 850; letter-spacing: -.03em; line-height: 1.2;
      background: linear-gradient(96deg, #38bdf8 0%, #a78bfa 55%, #22d3ee 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .markdown-section .tsw-hero-tag { margin: .25rem 0 0; font-size: .92rem; color: var(--tsw-text-muted); line-height: 1.5; }
    .markdown-section .tsw-hero-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

    /* --- Pill buttons --- */
    .markdown-section .tsw-btn {
      display: inline-block; border-radius: 10px; padding: .55rem 1.15rem;
      font-size: .88rem; font-weight: 640; white-space: nowrap;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border);
      color: var(--tsw-text); text-decoration: none;
      transition: transform .13s, box-shadow .18s, border-color .13s;
    }
    .markdown-section .tsw-btn:hover {
      transform: translateY(-2px); border-color: var(--tsw-accent);
      box-shadow: 0 8px 24px rgba(56,189,248,.18);
      color: var(--tsw-text); text-decoration: none;
    }
    .markdown-section .tsw-btn--ghost { background: var(--tsw-surface); }
    .markdown-section .tsw-btn--primary,
    .markdown-section .tsw-btn--primary:hover {
      background: linear-gradient(96deg, var(--tsw-accent), var(--tsw-accent-2));
      border-color: transparent; color: #08101f; font-weight: 700;
    }

    /* --- Stat strip (8 linked chips) --- */
    .markdown-section .tsw-stats {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px; margin: 1.4rem 0 2rem;
    }
    .markdown-section .tsw-stat {
      display: flex; flex-direction: column; gap: 2px;
      padding: .8rem .95rem; min-width: 0;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border); border-radius: 10px;
      text-decoration: none;
      transition: border-color .13s, box-shadow .18s;
    }
    .markdown-section .tsw-stat:hover {
      border-color: var(--tsw-accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,.13);
      text-decoration: none;
    }
    .markdown-section .tsw-stat-n {
      font-family: var(--tsw-mono); font-size: 1.4rem; font-weight: 700;
      color: var(--tsw-accent); line-height: 1.25; overflow-wrap: break-word;
    }
    .markdown-section .tsw-stat-l {
      font-size: .68rem; font-weight: 650; text-transform: uppercase;
      letter-spacing: .07em; color: var(--tsw-text-dim); line-height: 1.4;
    }
    .markdown-section .tsw-stat-s { font-size: .7rem; font-family: var(--tsw-mono); color: var(--tsw-text-dim); }

    /* --- Shared card base (router + flagships) --- */
    .markdown-section .tsw-card {
      background: var(--tsw-surface); border: 1px solid var(--tsw-border);
      border-radius: 12px; padding: .95rem 1.05rem; min-width: 0;
      transition: border-color .13s, transform .13s, box-shadow .18s;
    }
    .markdown-section .tsw-card:hover { border-color: var(--tsw-accent); transform: translateY(-2px); }

    /* --- Quick router --- */
    .markdown-section .tsw-router {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px; margin: 1.2rem 0 .8rem;
    }
    .markdown-section .tsw-card-h {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .09em; color: var(--tsw-text-dim); margin-bottom: .5rem;
    }
    .markdown-section .tsw-card-l {
      display: block; padding: 3px 0; font-size: .875rem;
      color: var(--tsw-text-muted); text-decoration: none;
      transition: color .13s;
    }
    .markdown-section .tsw-card-l::before { content: '› '; color: var(--tsw-accent); font-weight: 650; }
    .markdown-section .tsw-card-l:hover { color: var(--tsw-accent); text-decoration: none; }

    /* --- Pill chips + count badges (chain, beyond-row, disciplines) --- */
    .markdown-section .tsw-chip {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .34rem .85rem; font-size: .82rem;
      background: var(--tsw-surface); border: 1px solid var(--tsw-border); border-radius: 999px;
      color: var(--tsw-text-muted); text-decoration: none;
      transition: color .13s, border-color .13s;
    }
    .markdown-section .tsw-chip:hover { color: var(--tsw-accent); border-color: var(--tsw-accent); text-decoration: none; }
    .markdown-section .tsw-chip-n {
      font-family: var(--tsw-mono); font-size: .72rem; font-weight: 700;
      color: var(--tsw-accent-3); background: var(--tsw-surface-2);
      border-radius: 6px; padding: .06rem .4rem;
    }
    .markdown-section .tsw-chip--all { border-color: var(--tsw-accent); color: var(--tsw-accent); font-weight: 650; }

    /* --- Knowledge-graph chain --- */
    .markdown-section .tsw-chain {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 12px 32px; margin: 1.1rem 0 1.2rem;
    }
    .markdown-section .tsw-chain .tsw-chip { position: relative; }
    .markdown-section .tsw-chain .tsw-chip:not(:last-child)::after {
      content: '→'; position: absolute; right: -23px; top: 50%;
      transform: translateY(-50%); color: var(--tsw-text-dim); font-size: .9rem;
    }

    /* --- Chip fields with block-breaking cluster labels --- */
    .markdown-section .tsw-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: .8rem 0 1.2rem; }
    .markdown-section .tsw-chips-label {
      flex-basis: 100%; margin: .7rem 0 .1rem;
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .09em; color: var(--tsw-text-dim);
    }
    .markdown-section .tsw-chips-label:first-child { margin-top: 0; }

    /* --- Flagship cards (violet top rule) --- */
    .markdown-section .tsw-flagship {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px; margin: 1.2rem 0;
    }
    .markdown-section .tsw-flag { border-top: 2px solid var(--tsw-accent-2); display: flex; flex-direction: column; gap: .45rem; }
    .markdown-section .tsw-flag-t { font-size: 1.05rem; font-weight: 720; color: var(--tsw-text); text-decoration: none; transition: color .13s; }
    .markdown-section .tsw-flag-t:hover { color: var(--tsw-accent); text-decoration: none; }
    .markdown-section .tsw-flag-sub { margin: 0; flex: 1; font-size: .86rem; line-height: 1.55; color: var(--tsw-text-muted); }
    .markdown-section .tsw-flag-links { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; margin-top: .3rem; }
    .markdown-section .tsw-flag-cta { font-size: .85rem; font-weight: 650; color: var(--tsw-accent); text-decoration: none; }
    .markdown-section .tsw-flag-cta:hover { color: var(--tsw-accent-3); text-decoration: none; }
    .markdown-section .tsw-flag-2nd { font-size: .85rem; color: var(--tsw-text-dim); text-decoration: none; transition: color .13s; }
    .markdown-section .tsw-flag-2nd:hover { color: var(--tsw-accent); text-decoration: none; }

    /* --- Domain switchboard (mirrors _sidebar.md) ---
       `columns: 3 250px` self-degrades to 2 columns near 1024px and 1 near 768px
       without extra media queries. */
    .markdown-section .tsw-switchboard { columns: 3 250px; column-gap: 28px; margin: 1.2rem 0; }
    .markdown-section .tsw-swb-group {
      break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
      margin: 0 0 1.4rem; display: block;
    }
    .markdown-section .tsw-swb-h {
      font-size: .705rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .09em; color: var(--tsw-text-dim); margin: 0 0 .45rem;
    }
    .markdown-section .tsw-swb-l {
      display: block; padding: 3px 0; font-size: .85rem;
      color: var(--tsw-text-muted); text-decoration: none;
      transition: color .13s, transform .13s;
    }
    .markdown-section .tsw-swb-l:hover { color: var(--tsw-accent); transform: translateX(2px); text-decoration: none; }
    .markdown-section .tsw-swb-more {
      display: block; padding: 4px 0 0; text-align: right;
      font-size: .78rem; color: var(--tsw-text-dim); text-decoration: none;
      transition: color .13s;
    }
    .markdown-section .tsw-swb-more:hover { color: var(--tsw-accent); text-decoration: none; }

    /* --- Data & Navigator band (2-col) / Learn & grow row --- */
    .markdown-section .tsw-databand { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; margin: 1.2rem 0; }
    .markdown-section .tsw-learn .tsw-swb-l { display: inline-block; margin: 0 1.5rem 4px 0; }

    /* --- Footer strip --- */
    .markdown-section .tsw-footer { margin-top: 3rem; padding-top: 1.4rem; border-top: 1px solid var(--tsw-border); text-align: center; }
    .markdown-section .tsw-footer-links { font-size: .86rem; color: var(--tsw-text-dim); }
    .markdown-section .tsw-footer-links a { color: var(--tsw-text-muted); text-decoration: none; font-weight: 500; transition: color .13s; }
    .markdown-section .tsw-footer-links a:hover { color: var(--tsw-accent); text-decoration: none; }
    .markdown-section .tsw-footer-sep { margin: 0 .55rem; color: var(--tsw-text-dim); }
    .markdown-section .tsw-footer-small { margin-top: .7rem; font-size: .78rem; line-height: 1.65; color: var(--tsw-text-dim); }

    /* --- Mobile --- */
    @media screen and (max-width: 768px) {
      .markdown-section .tsw-hero { flex-direction: column; align-items: stretch; }
      .markdown-section .tsw-hero-actions { width: 100%; }
      .markdown-section .tsw-hero-actions .tsw-btn { flex: 1 1 100%; text-align: center; white-space: normal; }
      .markdown-section .tsw-router { grid-template-columns: 1fr; }
      .markdown-section .tsw-flagship { grid-template-columns: 1fr; }
      .markdown-section .tsw-databand { grid-template-columns: 1fr; }
      .markdown-section .tsw-chain { flex-direction: column; align-items: flex-start; gap: 26px; }
      .markdown-section .tsw-chain .tsw-chip:not(:last-child)::after {
        content: '↓'; right: auto; left: 50%; top: auto; bottom: -22px;
        transform: translateX(-50%);
      }
    }
    @media screen and (max-width: 480px) {
      .markdown-section .tsw-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="app">Loading TeamStarWolf…</div>
  <button id="tsw-top" title="Back to top" aria-label="Back to top">↑</button>

  <script>
    window.$docsify = {
      name: '🐺 TeamStarWolf',
      nameLink: '#/',
      repo: 'https://github.com/TeamStarWolf/TeamStarWolf',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      homepage: 'HOME.md',   // site homepage; README.md stays the GitHub face
      relativePath: false,  // every in-repo link is absolute; see _sidebar.md
      alias: {
        // navigator/ ships index.md, not README.md — without this, /navigator/ 404s
        '/navigator/': '/navigator/index'
      },
      mergeNavbar: true,
      externalLinkTarget: '_blank',
      notFoundPage: true,

      // Index EVERY page reachable from the sidebar — no hardcoded allowlist to go stale.
      search: {
        maxAge: 3600000,
        paths: 'auto',
        placeholder: '🔍  Search the library — try T1059…',
        noData: 'No matches. Try a technique ID (T1059), a tool, a control, or a concept.',
        depth: 6,
        hideOtherSidebarContent: false,
        pathNamespaces: []
      },

      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },

      plugins: [
        // "Edit on GitHub" + keyboard shortcut hint on every page
        function (hook, vm) {
          hook.beforeEach(function (html) {
            var url = 'https://github.com/TeamStarWolf/TeamStarWolf/blob/main/' + vm.route.file;
            return '> 📝 [Edit this page on GitHub](' + url + ') &nbsp;·&nbsp; press <kbd>/</kbd> to search\n\n' + html;
          });
        },
        // Back-to-top behaviour
        function (hook) {
          hook.doneEach(function () {
            var btn = document.getElementById('tsw-top');
            var body = document.querySelector('.content') || window;
            function onScroll() {
              var y = window.scrollY || document.documentElement.scrollTop;
              btn.classList.toggle('show', y > 700);
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
            btn.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
          });
        }
      ]
    };

    // "/" focuses search, Esc clears it
    document.addEventListener('keydown', function (e) {
      var el = document.activeElement;
      var typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
      if (e.key === '/' && !typing) {
        var input = document.querySelector('.search input');
        if (input) { e.preventDefault(); input.focus(); input.select(); }
      }
      if (e.key === 'Escape') {
        var i2 = document.querySelector('.search input');
        if (i2 && document.activeElement === i2) { i2.value = ''; i2.blur(); }
      }
    });
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Full-text search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy-code, pagination, tabs -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
