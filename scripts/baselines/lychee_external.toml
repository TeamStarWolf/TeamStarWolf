# user agent and two retries). Dead links were fixed in the pages instead: moved -> the new URL, dead ->
# a Wayback Machine capture, dead with no capture -> the citation kept as text without the hyperlink.
# Only ever shrink this list: when a link passes again, or its page changes, delete the entry. Never add
# an entry for a link that is really dead.
