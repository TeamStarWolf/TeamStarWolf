<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 405" width="1000" height="405" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="405" rx="10" fill="#ffffff"/><rect x="10" y="10.8" width="980" height="54.0" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="33.1" font-size="15.5" font-weight="400" fill="#7a1b14" text-anchor="middle">One-way door: “Rollback is not possible once an instance is upgraded to USEM” (official). Rehearse on a cloned</text><text xml:space="preserve" x="500.0" y="53.3" font-size="15.5" font-weight="400" fill="#7a1b14" text-anchor="middle">sub-production instance first.</text><rect x="10" y="89.10000000000001" width="180" height="202.5" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="18" y="135.1" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="start">1 Prepare</text><text xml:space="preserve" x="18" y="153.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Deactivate every</text><text xml:space="preserve" x="18" y="170.7" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   integration</text><text xml:space="preserve" x="18" y="188.1" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   (sn_sec_int_</text><text xml:space="preserve" x="18" y="205.5" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   integration)</text><text xml:space="preserve" x="18" y="222.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Deactivate VR,</text><text xml:space="preserve" x="18" y="240.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   AVR, CVR, CC</text><text xml:space="preserve" x="18" y="257.7" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   scheduled jobs</text><line x1="190" y1="190.35000000000002" x2="210" y2="190.35000000000002" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="210" y="89.10000000000001" width="180" height="202.5" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="218" y="135.1" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="start">2 Upgrade in order</text><text xml:space="preserve" x="218" y="153.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• VR first</text><text xml:space="preserve" x="218" y="170.7" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• then Configuration</text><text xml:space="preserve" x="218" y="188.1" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   Compliance</text><text xml:space="preserve" x="218" y="205.5" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• then Container VR</text><text xml:space="preserve" x="218" y="222.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• then each</text><text xml:space="preserve" x="218" y="240.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   integration, one at</text><text xml:space="preserve" x="218" y="257.7" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   a time</text><line x1="390" y1="190.35000000000002" x2="410" y2="190.35000000000002" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="410" y="89.10000000000001" width="180" height="202.5" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="418" y="161.2" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="start">3 Resolve conflicts</text><text xml:space="preserve" x="418" y="179.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Review pre-upgrade</text><text xml:space="preserve" x="418" y="196.8" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   insights</text><text xml:space="preserve" x="418" y="214.2" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Resolve conflicts</text><text xml:space="preserve" x="418" y="231.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   the upgrade reports</text><line x1="590" y1="190.35000000000002" x2="610" y2="190.35000000000002" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="610" y="89.10000000000001" width="180" height="202.5" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="618" y="169.9" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="start">4 “Enable all”</text><text xml:space="preserve" x="618" y="188.1" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Assistant restores</text><text xml:space="preserve" x="618" y="205.5" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   integrations and</text><text xml:space="preserve" x="618" y="222.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   scheduled jobs</text><line x1="790" y1="190.35000000000002" x2="810" y2="190.35000000000002" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="810" y="89.10000000000001" width="180" height="202.5" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="818" y="143.8" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="start">5 Verify</text><text xml:space="preserve" x="818" y="162.0" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Assistant</text><text xml:space="preserve" x="818" y="179.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   redirects to lookup</text><text xml:space="preserve" x="818" y="196.8" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   rules</text><text xml:space="preserve" x="818" y="214.2" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Your check:</text><text xml:space="preserve" x="818" y="231.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   scores, tasks and</text><text xml:space="preserve" x="818" y="249.0" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   SLAs vs. baseline</text><rect x="10" y="313.20000000000005" width="480" height="78.30000000000001" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="18" y="332.3" font-size="15.0" font-weight="700" fill="#7d8da1" text-anchor="start">Where it lives</text><text xml:space="preserve" x="18" y="349.8" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">All &gt; Vulnerability Response &gt; Administration &gt; Migration</text><text xml:space="preserve" x="18" y="366.6" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">assistant (KB2556844). ServiceNow calls it the preferred path over</text><text xml:space="preserve" x="18" y="383.5" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">App Manager.</text><rect x="510" y="313.20000000000005" width="480" height="78.30000000000001" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="518" y="332.3" font-size="15.0" font-weight="700" fill="#b86e00" text-anchor="start">“Upgrade later”</text><text xml:space="preserve" x="518" y="349.8" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">Hides the assistant but leaves it reachable from the Filter</text><text xml:space="preserve" x="518" y="366.6" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">Navigator. Community guidance says Brazil and Australia Patch</text><text xml:space="preserve" x="518" y="383.5" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">3m/4m can force the upgrade anyway.</text></svg>
