 xml:space="preserve" x="315.0" y="139.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">one per scanner asset</text><rect x="430" y="14.5" width="250" height="203.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="555.0" y="63.9" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">CI lookup rules</text><text xml:space="preserve" x="555.0" y="81.2" font-size="12.6" font-weight="400" fill="#16212e" text-anchor="middle">Tenable.io: MAC, FQDN, NetBIOS,</text><text xml:space="preserve" x="555.0" y="97.6" font-size="12.6" font-weight="400" fill="#16212e" text-anchor="middle">hostname, DNS, IP (+ UUID via</text><text xml:space="preserve" x="555.0" y="114.1" font-size="12.6" font-weight="400" fill="#16212e" text-anchor="middle">source_id)</text><text xml:space="preserve" x="555.0" y="130.5" font-size="12.6" font-weight="400" fill="#16212e" text-anchor="middle">Tenable.sc: MAC, FQDN, NetBIOS, IP</text><text xml:space="preserve" x="555.0" y="146.9" font-size="12.6" font-weight="400" fill="#16212e" text-anchor="middle">Tenable.cs: cloud resource ID</text><text xml:space="preserve" x="555.0" y="163.4" font-size="12.6" font-weight="400" fill="#16212e" text-anchor="middle">Wiz: no default lookup rules</text><text xml:space="preserve" x="555.0" y="179.8" font-size="12.6" font-weight="400" fill="#16212e" text-anchor="middle">documented</text><polygon points="800,43.5 885.0,116.0 800,188.5 715.0,116.0" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.5"/><text xml:space="preserve" x="800.0" y="121.2" font-size="14.9" font-weight="400" fill="#16212e" text-anchor="middle">Matched?</text><line x1="200" y1="116.0" x2="230" y2="116.0" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#ag)"/><line x1="400" y1="116.0" x2="430" y2="116.0" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#ag)"/><line x1="680" y1="116.0" x2="715" y2="116.0" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#ag)"/><rect 