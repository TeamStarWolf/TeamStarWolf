<svg viewBox="0 0 1000 549" width="1000" height="549" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="549" rx="10" fill="#ffffff"/><text x="115" y="24.4" font-size="12" font-weight="700" fill="#1f4e79" text-anchor="middle">Default Risk Rule inputs (official)</text><rect x="10" y="36.6" width="210" height="39.04" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="115.0" y="61.0" font-size="14.0" font-weight="400" fill="#16212e" text-anchor="middle">Vulnerability severity</text><line x1="220" y1="56.12" x2="290" y2="170.79999999999998" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#an)"/><rect x="10" y="85.39999999999999" width="210" height="39.04" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="115.0" y="109.8" font-size="14.0" font-weight="400" fill="#16212e" text-anchor="middle">Exploit information</text><line x1="220" y1="104.92" x2="290" y2="170.79999999999998" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#an)"/><rect x="10" y="134.2" width="210" height="39.04" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="115.0" y="158.6" font-size="14.0" font-weight="400" fill="#16212e" text-anchor="middle">CI criticality</text><line x1="220" y1="153.72" x2="290" y2="170.79999999999998" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#an)"/><rect x="10" y="183.0" width="210" height="39.04" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="115.0" y="207.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">External exposure of the CI</text><line x1="220" y1="202.51999999999998" x2="290" y2="170.79999999999998" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#an)"/><rect x="10" y="231.79999999999998" width="210" height="39.04" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="115.0" y="256.2" font-size="14.0" font-weight="400" fill="#16212e" text-anchor="middle">EPSS score</text><line x1="220" y1="251.32" x2="290" y2="170.79999999999998" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#an)"/><text x="115" y="302.56" font-size="12" font-weight="700" fill="#b86e00" text-anchor="middle">Opt-in criteria (you must add them)</text><rect x="10" y="314.76" width="210" height="51.24" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="115.0" y="336.5" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">CISA KEV (cisa_exists):</text><text xml:space="preserve" x="115.0" y="353.3" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">triggers recalculation only</text><line x1="220" y1="339.15999999999997" x2="290" y2="213.5" stroke="#b86e00" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#aa)"/><rect x="10" y="370.88" width="210" height="51.24" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="115.0" y="401.0" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">SSVC fields (USEM only)</text><line x1="220" y1="395.28" x2="290" y2="213.5" stroke="#b86e00" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#aa)"/><rect x="10" y="427.0" width="210" height="51.24" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="115.0" y="448.8" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">Armis Early Warning</text><text xml:space="preserve" x="115.0" y="465.5" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">(Admiralty A1–F6)</text><line x1="220" y1="451.4" x2="290" y2="213.5" stroke="#b86e00" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#aa)"/><rect x="10" y="483.12" width="210" height="51.24" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="115.0" y="505.5" font-size="10.8" font-weight="400" fill="#16212e" text-anchor="middle">Tenable Risk Rule (inactive): VPR</text><text xml:space="preserve" x="115.0" y="519.6" font-size="10.8" font-weight="400" fill="#16212e" text-anchor="middle">70 · Asset 15 · Bus. crit. 15</text><line x1="220" y1="507.52" x2="290" y2="213.5" stroke="#b86e00" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#aa)"/><rect x="290" y="109.8" width="220" height="158.6" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="400.0" y="134.7" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Default Risk Calculator</text><text xml:space="preserve" x="400.0" y="152.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Default Risk Rule (first</text><text xml:space="preserve" x="400.0" y="169.6" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">match wins)</text><text xml:space="preserve" x="400.0" y="186.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Field weights 0–100</text><text xml:space="preserve" x="400.0" y="203.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Shipped weights unpublished</text><text xml:space="preserve" x="400.0" y="220.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">(KB1169927)</text><text xml:space="preserve" x="400.0" y="237.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Severity calculator ships</text><text xml:space="preserve" x="400.0" y="255.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">disabled</text><line x1="510" y1="189.1" x2="560" y2="189.1" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="560" y="73.2" width="170" height="48.8" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="645.0" y="103.0" font-size="15.5" font-weight="400" fill="#16212e" text-anchor="middle">Risk score 0–100</text><rect x="560" y="134.2" width="170" height="36.6" rx="4" fill="#8e1b14" stroke="none" opacity="1"/><text x="575" y="158.6" font-size="11.5" font-weight="700" fill="#fff" text-anchor="start">Rating 1</text><text x="718" y="158.6" font-size="11.5" font-weight="600" fill="#fff" text-anchor="end">90–100</text><rect x="560" y="175.68" width="170" height="36.6" rx="4" fill="#c7432f" stroke="none" opacity="1"/><text x="575" y="200.07999999999998" font-size="11.5" font-weight="700" fill="#fff" text-anchor="start">Rating 2</text><text x="718" y="200.07999999999998" font-size="11.5" font-weight="600" fill="#fff" text-anchor="end">70–89</text><rect x="560" y="217.16" width="170" height="36.6" rx="4" fill="#e08a1e" stroke="none" opacity="1"/><text x="575" y="241.56" font-size="11.5" font-weight="700" fill="#fff" text-anchor="start">Rating 3</text><text x="718" y="241.56" font-size="11.5" font-weight="600" fill="#fff" text-anchor="end">40–69</text><rect x="560" y="258.64" width="170" height="36.6" rx="4" fill="#e7c547" stroke="none" opacity="1"/><text x="575" y="283.04" font-size="11.5" font-weight="700" fill="#16212e" text-anchor="start">Rating 4</text><text x="718" y="283.04" font-size="11.5" font-weight="600" fill="#16212e" text-anchor="end">1–39</text><rect x="560" y="300.12" width="170" height="36.6" rx="4" fill="#b8c2cc" stroke="none" opacity="1"/><text x="575" y="324.52" font-size="11.5" font-weight="700" fill="#16212e" text-anchor="start">Rating 5</text><text x="718" y="324.52" font-size="11.5" font-weight="600" fill="#16212e" text-anchor="end">0</text><line x1="730" y1="231.79999999999998" x2="770" y2="231.79999999999998" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="770" y="109.8" width="220" height="244.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="778" y="143.3" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">Rollup calculators</text><text xml:space="preserve" x="778" y="163.5" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">(every 15 min)</text><text xml:space="preserve" x="778" y="181.0" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• Remediation task,</text><text xml:space="preserve" x="778" y="197.8" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   Discovered Item,</text><text xml:space="preserve" x="778" y="214.6" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   organization risk</text><text xml:space="preserve" x="778" y="231.3" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• Documented example: Max</text><text xml:space="preserve" x="778" y="248.1" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   80% · Avg 5% · Count 15%</text><text xml:space="preserve" x="778" y="264.8" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   (not a confirmed default)</text><text xml:space="preserve" x="778" y="281.6" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• “All active records”</text><text xml:space="preserve" x="778" y="298.4" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   includes deferred findings</text><text xml:space="preserve" x="778" y="315.1" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• EPSS rolls up as 1 − Π(1</text><text xml:space="preserve" x="778" y="331.9" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   − p)</text><rect x="290" y="366.0" width="700" height="170.79999999999998" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="298" y="395.9" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="start">What this means for a Tenable + Wiz program</text><text xml:space="preserve" x="298" y="413.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• KEV adds nothing to the score until you add a weighted criterion on cisa_exists; both</text><text xml:space="preserve" x="298" y="431.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   scanners populate it.</text><text xml:space="preserve" x="298" y="448.8" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Tenable VPR lands in source_risk_score but drives the score only if you activate the</text><text xml:space="preserve" x="298" y="466.2" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   Tenable Risk Rule.</text><text xml:space="preserve" x="298" y="483.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• No Wiz risk rule exists; Wiz severity, CVSS v3, exploit and KEV feed the default rule like</text><text xml:space="preserve" x="298" y="501.0" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   any scanner.</text><text xml:space="preserve" x="298" y="518.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• ACR/AES and Wiz graph context are absent, so business context comes from CMDB criticality.</text></svg>
