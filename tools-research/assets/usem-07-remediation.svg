<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 330" width="1000" height="330" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="330" rx="10" fill="#ffffff"/><rect x="10" y="10.0" width="232" height="120.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="126.0" y="57.1" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="middle">1 Import + CI match</text><text xml:space="preserve" x="126.0" y="76.2" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Scanner integrations, lookup</text><text xml:space="preserve" x="126.0" y="94.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">rules, IRE</text><line x1="242" y1="70.0" x2="259" y2="70.0" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="259" y="10.0" width="232" height="120.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="375.0" y="47.8" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="middle">2 Risk score</text><text xml:space="preserve" x="375.0" y="66.9" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Calculators on the finding,</text><text xml:space="preserve" x="375.0" y="85.5" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">then rollups every 15</text><text xml:space="preserve" x="375.0" y="104.0" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">minutes</text><line x1="491" y1="70.0" x2="508" y2="70.0" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="508" y="10.0" width="232" height="120.0" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="624.0" y="30.6" font-size="15.6" font-weight="700" fill="#b86e00" text-anchor="middle">3 Assignment rules</text><text xml:space="preserve" x="624.0" y="49.1" font-size="13.8" font-weight="400" fill="#16212e" text-anchor="middle">First match wins; manual</text><text xml:space="preserve" x="624.0" y="67.0" font-size="13.8" font-weight="400" fill="#16212e" text-anchor="middle">assignments are not</text><text xml:space="preserve" x="624.0" y="85.0" font-size="13.8" font-weight="400" fill="#16212e" text-anchor="middle">re-evaluated</text><text xml:space="preserve" x="624.0" y="102.9" font-size="13.8" font-weight="400" fill="#16212e" text-anchor="middle">“Run assignment rules” job:</text><text xml:space="preserve" x="624.0" y="120.8" font-size="13.8" font-weight="400" fill="#16212e" text-anchor="middle">off</text><line x1="740" y1="70.0" x2="757" y2="70.0" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="757" y="10.0" width="232" height="120.0" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="873.0" y="47.8" font-size="16.1" font-weight="700" fill="#b86e00" text-anchor="middle">4 Remediation task rules</text><text xml:space="preserve" x="873.0" y="66.9" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Default Match All: a finding</text><text xml:space="preserve" x="873.0" y="85.5" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">can sit in several tasks</text><text xml:space="preserve" x="873.0" y="104.0" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Re-run property: off</text><rect x="757" y="160.0" width="232" height="120.0" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="873.0" y="207.1" font-size="16.1" font-weight="700" fill="#b86e00" text-anchor="middle">5 Remediation targets</text><text xml:space="preserve" x="873.0" y="226.2" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Most restrictive rule wins</text><text xml:space="preserve" x="873.0" y="244.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">No out-of-box SLA days</text><rect x="508" y="160.0" width="232" height="120.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="624.0" y="197.8" font-size="16.1" font-weight="700" fill="#1f4e79" text-anchor="middle">6 Exceptions</text><text xml:space="preserve" x="624.0" y="216.9" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Two-level approval</text><text xml:space="preserve" x="624.0" y="235.5" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Creates a Change Approval</text><text xml:space="preserve" x="624.0" y="254.0" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">record</text><rect x="259" y="160.0" width="232" height="120.0" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="375.0" y="188.6" font-size="16.1" font-weight="700" fill="#2e7d32" text-anchor="middle">7 Fix + verify</text><text xml:space="preserve" x="375.0" y="207.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Change needs ITSM Advanced</text><text xml:space="preserve" x="375.0" y="226.2" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Patch Orchestration</text><text xml:space="preserve" x="375.0" y="244.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Tenable rescan; scanner data</text><text xml:space="preserve" x="375.0" y="263.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">closes the finding</text><line x1="873.0" y1="130.0" x2="873.0" y2="160.0" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><line x1="757" y1="220.0" x2="741" y2="220.0" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><line x1="508" y1="220.0" x2="492" y2="220.0" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="10" y="160.0" width="232" height="120.0" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="126.0" y="181.1" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Order (official)</text><text xml:space="preserve" x="126.0" y="199.4" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">Task rules evaluate after CI</text><text xml:space="preserve" x="126.0" y="217.1" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">matching, risk calculation</text><text xml:space="preserve" x="126.0" y="234.8" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">and assignment</text><text xml:space="preserve" x="126.0" y="252.6" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">SLA targets evaluate at</text><text xml:space="preserve" x="126.0" y="270.3" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">import and on reopen</text><rect x="10" y="296.0" width="16" height="14.0" rx="3" fill="#fff3df" stroke="#b86e00" opacity="1"/><text x="32" y="308.0" font-size="12" font-weight="400" fill="#16212e" text-anchor="start">default off or left for you to define</text><rect x="330" y="296.0" width="16" height="14.0" rx="3" fill="#e7f4ea" stroke="#2e7d32" opacity="1"/><text x="352" y="308.0" font-size="12" font-weight="400" fill="#16212e" text-anchor="start">outcome</text></svg>
