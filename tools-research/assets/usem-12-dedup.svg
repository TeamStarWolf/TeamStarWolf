<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 614" width="1000" height="614" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="614" rx="10" fill="#ffffff"/><rect x="300" y="9.44" width="400" height="61.36" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="36.7" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Same flaw on one cloud VM</text><text xml:space="preserve" x="500.0" y="55.0" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">Tenable agent finding + Wiz agentless finding</text><line x1="500" y1="70.8" x2="500" y2="96.75999999999999" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#an)"/><polygon points="500,96.75999999999999 660.0,155.76 500,214.76 340.0,155.76" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.5"/><text xml:space="preserve" x="500.0" y="151.5" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Do both resolve to the</text><text xml:space="preserve" x="500.0" y="170.0" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">same CMDB CI?</text><rect x="720" y="108.55999999999999" width="270" height="94.39999999999999" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text xml:space="preserve" x="855.0" y="144.1" font-size="15.5" font-weight="700" fill="#b3261e" text-anchor="middle">No → two CIs, two VI sets</text><text xml:space="preserve" x="855.0" y="161.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Asset and finding counts double. No</text><text xml:space="preserve" x="855.0" y="179.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">dedup mechanism applies.</text><line x1="660" y1="155.76" x2="720" y2="155.76" stroke="#b3261e" stroke-width="1.6" marker-end="url(#ar)"/><rect x="680.2" y="146.8" width="19.6" height="15.2" rx="3" fill="#ffffff" opacity="0.92"/><text x="690.0" y="159.75" font-size="10.5" font-weight="600" fill="#b3261e" text-anchor="middle">no</text><line x1="500" y1="214.76" x2="500" y2="243.07999999999998" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ak)"/><rect x="487.3" y="220.0" width="25.3" height="15.2" rx="3" fill="#ffffff" opacity="0.92"/><text x="500.0" y="232.91" font-size="10.5" font-weight="600" fill="#2e7d32" text-anchor="middle">yes</text><polygon points="500,243.07999999999998 660.0,302.08 500,361.08 340.0,302.08" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.5"/><text xml:space="preserve" x="500.0" y="297.9" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">Do they share a CVE?</text><text xml:space="preserve" x="500.0" y="316.0" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">(CVE/CVE or CVE/TPE)</text><rect x="720" y="257.24" width="270" height="89.67999999999999" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="855.0" y="299.0" font-size="15.5" font-weight="700" fill="#b86e00" text-anchor="middle">No → separate VIs</text><text xml:space="preserve" x="855.0" y="316.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Rule-based dedup cannot pair them</text><line x1="660" y1="302.08" x2="720" y2="302.08" stroke="#b86e00" stroke-width="1.6" marker-end="url(#aa)"/><rect x="680.2" y="293.2" width="19.6" height="15.2" rx="3" fill="#ffffff" opacity="0.92"/><text x="690.0" y="306.07" font-size="10.5" font-weight="600" fill="#b86e00" text-anchor="middle">no</text><line x1="500" y1="361.08" x2="500" y2="389.4" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ak)"/><rect x="487.3" y="366.3" width="25.3" height="15.2" rx="3" fill="#ffffff" opacity="0.92"/><text x="500.0" y="379.23" font-size="10.5" font-weight="600" fill="#2e7d32" text-anchor="middle">yes</text><rect x="350" y="389.4" width="300" height="51.919999999999995" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="420.4" font-size="14.3" font-weight="700" fill="#1f4e79" text-anchor="middle">“Show Duplicate VIs” flags the pair</text><line x1="450" y1="441.32" x2="320" y2="476.71999999999997" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#an)"/><line x1="550" y1="441.32" x2="680" y2="476.71999999999997" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#an)"/><rect x="130" y="476.71999999999997" width="370" height="127.44" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="315.0" y="512.3" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Manual or AI-assisted</text><text xml:space="preserve" x="315.0" y="529.9" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">Resolve from the remediation task, or run the Otto</text><text xml:space="preserve" x="315.0" y="546.6" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">“Identify duplicate vulnerable items” skill</text><text xml:space="preserve" x="315.0" y="563.4" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">(license-dependent; its auto-close threshold ships</text><text xml:space="preserve" x="315.0" y="580.2" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">empty, so nothing closes on its own)</text><rect x="520" y="476.71999999999997" width="470" height="127.44" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="755.0" y="512.3" font-size="15.5" font-weight="700" fill="#b86e00" text-anchor="middle">Automatic (opt-in)</text><text xml:space="preserve" x="755.0" y="529.9" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul.auto_resolve_duplicate_vit + a daily job resolve the</text><text xml:space="preserve" x="755.0" y="546.6" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">slower scanner’s VI when the other reports Fixed. It reopens if</text><text xml:space="preserve" x="755.0" y="563.4" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">the scanner says Not Fixed, so scanners on different cadences can</text><text xml:space="preserve" x="755.0" y="580.2" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="middle">flap. Watch Reopened Count.</text><rect x="10" y="108.55999999999999" width="270" height="342.2" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="18" y="201.3" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="start">Amplifiers</text><text xml:space="preserve" x="18" y="218.8" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• One Tenable plugin often spans</text><text xml:space="preserve" x="18" y="235.6" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   many CVEs; Wiz reports one finding</text><text xml:space="preserve" x="18" y="252.3" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   per CVE</text><text xml:space="preserve" x="18" y="269.1" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• Task rules default to Match All</text><text xml:space="preserve" x="18" y="285.9" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• Rollup example weights VI count</text><text xml:space="preserve" x="18" y="302.6" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   at 15%</text><text xml:space="preserve" x="18" y="319.4" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• Application findings: no dedup</text><text xml:space="preserve" x="18" y="336.2" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   across integrations</text><text xml:space="preserve" x="18" y="352.9" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">• Fix Intelligence dedups fixes,</text><text xml:space="preserve" x="18" y="369.7" font-size="12.9" font-weight="400" fill="#16212e" text-anchor="start">   not findings (needs Armis ViPR)</text></svg>
