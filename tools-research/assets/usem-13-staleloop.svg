<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 507" width="1000" height="507" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="507" rx="10" fill="#ffffff"/><rect x="340" y="10.4" width="320" height="83.2" rx="7" fill="#efeafd" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="40.0" font-size="15.5" font-weight="700" fill="#5b3fd1" text-anchor="middle">1 Daily delta pull</text><text xml:space="preserve" x="500.0" y="58.1" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">“Import since” returns only findings that</text><text xml:space="preserve" x="500.0" y="75.5" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">changed in Wiz</text><rect x="670" y="143.0" width="320" height="98.8" rx="7" fill="#efeafd" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="830.0" y="180.4" font-size="15.5" font-weight="700" fill="#5b3fd1" text-anchor="middle">2 Active but unchanged</text><text xml:space="preserve" x="830.0" y="198.5" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">last_found (= Wiz lastDetectedAt) is not</text><text xml:space="preserve" x="830.0" y="215.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">refreshed for findings that did not change</text><rect x="340" y="291.2" width="320" height="83.2" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="320.8" font-size="15.5" font-weight="700" fill="#b3261e" text-anchor="middle">3 Stale auto-close fires</text><text xml:space="preserve" x="500.0" y="338.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">e.g. a 14-day rule on last_found closes a</text><text xml:space="preserve" x="500.0" y="356.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">live finding</text><rect x="10" y="143.0" width="320" height="98.8" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="170.0" y="171.7" font-size="15.5" font-weight="700" fill="#b86e00" text-anchor="middle">4 Finding reopens</text><text xml:space="preserve" x="170.0" y="189.8" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">The next detection change reopens it;</text><text xml:space="preserve" x="170.0" y="207.2" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Reopened Count climbs and SLA clocks</text><text xml:space="preserve" x="170.0" y="224.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">confuse owners</text><line x1="660" y1="52.0" x2="780" y2="143.0" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)"/><line x1="830" y1="241.8" x2="662" y2="325.0" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)"/><line x1="340" y1="332.8" x2="170" y2="241.8" stroke="#b3261e" stroke-width="2" marker-end="url(#ar)"/><line x1="170" y1="143.0" x2="338" y2="52.0" stroke="#b86e00" stroke-width="2" marker-end="url(#aa)"/><text x="500" y="188.5" font-size="11" font-weight="700" fill="#3a4656" text-anchor="middle" font-style="italic">Community-reported (Apr–May 2026)</text><text x="500" y="210.6" font-size="11" font-weight="400" fill="#3a4656" text-anchor="middle" font-style="italic">consistent with the official field mapping</text><rect x="10" y="395.2" width="980" height="101.4" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="433.9" font-size="15.5" font-weight="700" fill="#2e7d32" text-anchor="middle">Mitigations</text><text xml:space="preserve" x="500.0" y="452.0" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Close on Wiz status = Resolved or on asset last-scanned, not last_found · raise stale thresholds · schedule an off-hours backdated</text><text xml:space="preserve" x="500.0" y="469.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">resync by editing “Import since” · monitor Reopened Count · ask ServiceNow for a full-reconcile job (requested Jul 2026, unanswered)</text></svg>
