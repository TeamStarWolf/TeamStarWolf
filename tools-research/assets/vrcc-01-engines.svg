<svg viewBox="0 0 1000 540" width="1000" height="540" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="540" rx="10" fill="#ffffff"/><rect x="10" y="9.2" width="230" height="34.5" rx="6" fill="#1f4e79" stroke="none" opacity="1"/><text x="125.0" y="32.199999999999996" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Sources</text><rect x="300" y="9.2" width="330" height="34.5" rx="6" fill="#1f4e79" stroke="none" opacity="1"/><text x="465.0" y="32.199999999999996" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ServiceNow engines</text><rect x="690" y="9.2" width="300" height="34.5" rx="6" fill="#1f4e79" stroke="none" opacity="1"/><text x="840.0" y="32.199999999999996" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Shared behavior</text><rect x="10" y="59.8" width="230" height="80.5" rx="7" fill="#e0f2ef" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="125.0" y="86.1" font-size="15.5" font-weight="700" fill="#0b7a75" text-anchor="middle">Tenable Vulnerability</text><text xml:space="preserve" x="125.0" y="106.3" font-size="15.5" font-weight="700" fill="#0b7a75" text-anchor="middle">Mgmt</text><text xml:space="preserve" x="125.0" y="125.2" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">formerly Tenable.io</text><rect x="10" y="154.1" width="230" height="80.5" rx="7" fill="#e0f2ef" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="125.0" y="190.5" font-size="15.5" font-weight="700" fill="#0b7a75" text-anchor="middle">Tenable Security Center</text><text xml:space="preserve" x="125.0" y="209.4" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Tenable.sc 5.13+</text><rect x="10" y="248.39999999999998" width="230" height="80.5" rx="7" fill="#e0f2ef" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="125.0" y="275.5" font-size="15.5" font-weight="700" fill="#0b7a75" text-anchor="middle">Tenable Cloud Security</text><text xml:space="preserve" x="125.0" y="294.4" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Tenable.cs: cloud hosts and</text><text xml:space="preserve" x="125.0" y="313.0" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">container images</text><rect x="10" y="342.7" width="230" height="126.49999999999999" rx="7" fill="#efeafd" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="125.0" y="374.3" font-size="15.5" font-weight="700" fill="#5b3fd1" text-anchor="middle">Wiz</text><text xml:space="preserve" x="125.0" y="393.2" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">One ServiceNow-built app</text><text xml:space="preserve" x="125.0" y="411.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">(sn_vul_wiz) feeds every</text><text xml:space="preserve" x="125.0" y="430.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">engine</text><text xml:space="preserve" x="125.0" y="448.8" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">GA July 31, 2025</text><rect x="300" y="59.8" width="330" height="110.39999999999999" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="465.0" y="101.9" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">VR: Vulnerability Response</text><text xml:space="preserve" x="465.0" y="120.8" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Hosts: detections → vulnerable items →</text><text xml:space="preserve" x="465.0" y="139.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">remediation tasks</text><rect x="300" y="186.29999999999998" width="330" height="110.39999999999999" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="465.0" y="228.4" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">CC: Configuration Compliance</text><text xml:space="preserve" x="465.0" y="247.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Imports pass/fail test results it never</text><text xml:space="preserve" x="465.0" y="265.8" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">evaluates → remediation tasks</text><rect x="300" y="312.79999999999995" width="330" height="110.39999999999999" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="465.0" y="354.9" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">CVR: Container Vulnerability Response</text><text xml:space="preserve" x="465.0" y="373.8" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Image findings → container vulnerable</text><text xml:space="preserve" x="465.0" y="392.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">items (CVITs) → container tasks</text><rect x="300" y="439.29999999999995" width="330" height="59.8" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="465.0" y="458.0" font-size="14.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Elsewhere</text><text xml:space="preserve" x="465.0" y="474.9" font-size="12.5" font-weight="400" fill="#16212e" text-anchor="middle">Wiz SCA, secrets → Application VR · AI posture</text><text xml:space="preserve" x="465.0" y="491.2" font-size="12.5" font-weight="400" fill="#16212e" text-anchor="middle">→ AI Security</text><line x1="240" y1="92.0" x2="300" y2="109.24999999999999" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><line x1="240" y1="109.24999999999999" x2="300" y2="229.99999999999997" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><line x1="240" y1="195.49999999999997" x2="300" y2="126.49999999999999" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><line x1="240" y1="276.0" x2="300" y2="143.75" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><line x1="240" y1="299.0" x2="300" y2="362.25" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><line x1="240" y1="379.49999999999994" x2="300" y2="155.25" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)"/><line x1="240" y1="402.49999999999994" x2="300" y2="252.99999999999997" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)"/><line x1="240" y1="425.49999999999994" x2="300" y2="379.49999999999994" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)"/><line x1="240" y1="454.24999999999994" x2="300" y2="465.74999999999994" stroke="#5b3fd1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#av)"/><rect x="690" y="59.8" width="300" height="195.49999999999997" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="698" y="118.6" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">One rule pipeline</text><text xml:space="preserve" x="698" y="136.9" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="start">1 CI lookup to a CMDB record</text><text xml:space="preserve" x="698" y="154.7" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="start">2 Risk calculators</text><text xml:space="preserve" x="698" y="172.4" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="start">3 Assignment (first match wins)</text><text xml:space="preserve" x="698" y="190.1" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="start">4 Remediation-task rules</text><text xml:space="preserve" x="698" y="207.9" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="start">5 Daily remediation-target job</text><rect x="690" y="271.4" width="300" height="126.49999999999999" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text xml:space="preserve" x="840.0" y="296.6" font-size="15.5" font-weight="700" fill="#b3261e" text-anchor="middle">One closure rule</text><text xml:space="preserve" x="840.0" y="314.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">The scanner closes the work. Manual</text><text xml:space="preserve" x="840.0" y="332.0" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Close was removed; owners can only</text><text xml:space="preserve" x="840.0" y="349.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Resolve.</text><text xml:space="preserve" x="840.0" y="366.8" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Items the scanner stops reporting go</text><text xml:space="preserve" x="840.0" y="384.2" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">stale (90 days by default).</text><rect x="690" y="413.99999999999994" width="300" height="85.1" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="840.0" y="444.9" font-size="15.5" font-weight="700" fill="#b86e00" text-anchor="middle">Tenable narrows, Wiz spans</text><text xml:space="preserve" x="840.0" y="462.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Tenable: VM → VR + CC; SC → VR only;</text><text xml:space="preserve" x="840.0" y="479.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Cloud Security → VR + CVR</text></svg>
