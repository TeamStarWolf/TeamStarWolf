<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 462" width="1000" height="462" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="462" rx="10" fill="#ffffff"/><rect x="10" y="22.0" width="250" height="143.0" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="135.0" y="50.6" font-size="14.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Detection</text><text xml:space="preserve" x="135.0" y="67.3" font-size="12.3" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul_detection</text><text xml:space="preserve" x="135.0" y="83.3" font-size="12.3" font-weight="400" fill="#16212e" text-anchor="middle">One scanner-reported occurrence</text><text xml:space="preserve" x="135.0" y="99.2" font-size="12.3" font-weight="400" fill="#16212e" text-anchor="middle">Key: Tenable = vuln + port +</text><text xml:space="preserve" x="135.0" y="115.2" font-size="12.3" font-weight="400" fill="#16212e" text-anchor="middle">protocol + asset ID</text><text xml:space="preserve" x="135.0" y="131.2" font-size="12.3" font-weight="400" fill="#16212e" text-anchor="middle">Wiz = finding UUID from 30.3 / 1.3</text><text xml:space="preserve" x="135.0" y="147.2" font-size="12.3" font-weight="400" fill="#16212e" text-anchor="middle">(release notes: new customers only)</text><rect x="330" y="22.0" width="300" height="143.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="480.0" y="56.2" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Vulnerable item (VI)</text><text xml:space="preserve" x="480.0" y="74.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul_vulnerable_item</text><text xml:space="preserve" x="480.0" y="91.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Unique per CI + vulnerability +</text><text xml:space="preserve" x="480.0" y="108.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">integration instance</text><text xml:space="preserve" x="480.0" y="125.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Optional port key: cannot be undone</text><text xml:space="preserve" x="480.0" y="142.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">without deleting VR data</text><rect x="700" y="22.0" width="290" height="143.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="845.0" y="73.3" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Remediation task (RT)</text><text xml:space="preserve" x="845.0" y="91.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul_vulnerability</text><text xml:space="preserve" x="845.0" y="108.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Groups VIs on up to six fields</text><text xml:space="preserve" x="845.0" y="125.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Reapply deletes and recreates Open RTs</text><line x1="260" y1="93.50000000000001" x2="330" y2="93.50000000000001" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><line x1="630" y1="93.50000000000001" x2="700" y2="93.50000000000001" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="10" y="187.00000000000003" width="480" height="143.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="18" y="220.4" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">State rolls up from detections to the VI</text><text xml:space="preserve" x="18" y="238.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Any Open detection keeps the VI Open</text><text xml:space="preserve" x="18" y="255.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Closed + Stale detections → VI Closed – Fixed</text><text xml:space="preserve" x="18" y="273.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• All Stale → VI Closed – Stale</text><text xml:space="preserve" x="18" y="290.7" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">• Fixed, Stale or CI Decommissioned VIs reopen on a new</text><text xml:space="preserve" x="18" y="308.1" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">   matching detection</text><rect x="510" y="187.00000000000003" width="480" height="143.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="518" y="229.8" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">RT states and precedence</text><text xml:space="preserve" x="518" y="247.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Open → Under Investigation → Awaiting Implementation → Resolved →</text><text xml:space="preserve" x="518" y="264.6" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Closed (Deferred via exception)</text><text xml:space="preserve" x="518" y="281.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">When a VI is in several RTs: Closed &gt; Deferred &gt; Resolved &gt; In</text><text xml:space="preserve" x="518" y="298.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Review &gt; Awaiting Implementation &gt; Under Investigation &gt; Open</text><rect x="10" y="347.6" width="980" height="70.4" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="370.5" font-size="15.5" font-weight="700" fill="#b86e00" text-anchor="middle">Same CVE, same server, two scanners = two VIs</text><text xml:space="preserve" x="500.0" y="388.8" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">The integration instance is part of the VI key and VIs are not de-duplicated across integrations. Report on CVE + CI, not VI</text><text xml:space="preserve" x="500.0" y="406.5" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">counts.</text></svg>
