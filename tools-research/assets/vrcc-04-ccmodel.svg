<svg viewBox="0 0 1000 473" width="1000" height="473" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="473" rx="10" fill="#ffffff"/><rect x="10" y="22.0" width="300" height="187.00000000000003" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="160.0" y="61.1" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Scanner-supplied knowledge</text><text xml:space="preserve" x="160.0" y="78.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Test group: sn_vulc_policy</text><text xml:space="preserve" x="160.0" y="96.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Test: sn_vulc_test (criticality,</text><text xml:space="preserve" x="160.0" y="113.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">remediation)</text><text xml:space="preserve" x="160.0" y="130.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Authoritative source: sn_vulc_auth_src</text><text xml:space="preserve" x="160.0" y="147.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Citation: sn_vulc_citation</text><text xml:space="preserve" x="160.0" y="164.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">GRC Policy Statements tab (if GRC</text><text xml:space="preserve" x="160.0" y="181.4" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">installed)</text><rect x="350" y="22.0" width="300" height="187.00000000000003" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="69.7" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Test result</text><text xml:space="preserve" x="500.0" y="87.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">sn_vulc_result (history in</text><text xml:space="preserve" x="500.0" y="104.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">sn_vulc_result_history)</text><text xml:space="preserve" x="500.0" y="121.6" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Passed · Failed · Error · Unknown</text><text xml:space="preserve" x="500.0" y="138.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Expected vs Actual values</text><text xml:space="preserve" x="500.0" y="155.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Passed results stay Closed – Fixed and</text><text xml:space="preserve" x="500.0" y="172.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">keep their risk score</text><rect x="690" y="22.0" width="300" height="187.00000000000003" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="840.0" y="78.2" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Remediation task</text><text xml:space="preserve" x="840.0" y="96.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">sn_vulc_result_group</text><text xml:space="preserve" x="840.0" y="113.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Carries the state model</text><text xml:space="preserve" x="840.0" y="130.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Exceptions are requested on the task,</text><text xml:space="preserve" x="840.0" y="147.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">not the result (365-day cap)</text><text xml:space="preserve" x="840.0" y="164.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Change requests drive the task state</text><line x1="310" y1="115.50000000000001" x2="350" y2="115.50000000000001" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><line x1="650" y1="115.50000000000001" x2="690" y2="115.50000000000001" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="10" y="226.60000000000002" width="480" height="132.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="18" y="263.2" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">After every import</text><text xml:space="preserve" x="18" y="281.2" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">1 Resolved tasks that still fail return to Awaiting</text><text xml:space="preserve" x="18" y="298.7" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">Implementation</text><text xml:space="preserve" x="18" y="316.1" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">2 Tasks whose results all passed close</text><text xml:space="preserve" x="18" y="333.5" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="start">3 The Ungrouped Test Results list refreshes</text><rect x="510" y="226.60000000000002" width="480" height="132.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="518" y="263.9" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">Scoring and clocks</text><text xml:space="preserve" x="518" y="281.6" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Risk = average of CMDB business criticality and scanner test</text><text xml:space="preserve" x="518" y="298.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">severity (script needs Service Mapping)</text><text xml:space="preserve" x="518" y="315.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Targets daily 4:30 from Last pass, 30-day default</text><text xml:space="preserve" x="518" y="332.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Stale keyed to last compliance scan date</text><rect x="10" y="376.20000000000005" width="980" height="61.60000000000001" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="395.5" font-size="14.5" font-weight="700" fill="#b86e00" text-anchor="middle">Ships mostly switched off</text><text xml:space="preserve" x="500.0" y="412.6" font-size="12.8" font-weight="400" fill="#16212e" text-anchor="middle">The base task rule, the base assignment rule and the &quot;Reapply all assignment rules&quot; job are disabled: results arrive ungrouped and</text><text xml:space="preserve" x="500.0" y="429.2" font-size="12.8" font-weight="400" fill="#16212e" text-anchor="middle">unassigned until rules exist.</text></svg>
