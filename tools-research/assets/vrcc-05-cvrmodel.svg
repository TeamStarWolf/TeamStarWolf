<svg viewBox="0 0 1000 473" width="1000" height="473" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="473" rx="10" fill="#ffffff"/><rect x="10" y="22.0" width="180" height="121.00000000000001" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="100.0" y="52.5" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Discovered</text><text xml:space="preserve" x="100.0" y="72.6" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">container image</text><text xml:space="preserve" x="100.0" y="90.3" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul_container_image</text><text xml:space="preserve" x="100.0" y="107.2" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">· image ID, digest,</text><text xml:space="preserve" x="100.0" y="124.1" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">registry</text><line x1="190" y1="82.5" x2="207" y2="82.5" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="207" y="22.0" width="180" height="121.00000000000001" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="297.0" y="71.0" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Layers and packages</text><text xml:space="preserve" x="297.0" y="88.7" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">package URL since</text><text xml:space="preserve" x="297.0" y="105.6" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">v2.11.3</text><line x1="387" y1="82.5" x2="404" y2="82.5" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="404" y="22.0" width="180" height="121.00000000000001" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="494.0" y="62.5" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Image findings</text><text xml:space="preserve" x="494.0" y="80.2" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul_container_image_</text><text xml:space="preserve" x="494.0" y="97.1" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">findings · per image,</text><text xml:space="preserve" x="494.0" y="114.1" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">package, layer, path</text><line x1="584" y1="82.5" x2="601" y2="82.5" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="601" y="22.0" width="180" height="121.00000000000001" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="691.0" y="71.0" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">CVIT</text><text xml:space="preserve" x="691.0" y="88.7" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul_container_image_</text><text xml:space="preserve" x="691.0" y="105.6" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">vulnerable_item</text><line x1="781" y1="82.5" x2="798" y2="82.5" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="798" y="22.0" width="180" height="121.00000000000001" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="888.0" y="71.0" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Container task</text><text xml:space="preserve" x="888.0" y="88.7" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">sn_vul_container_</text><text xml:space="preserve" x="888.0" y="105.6" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="middle">vulnerability</text><rect x="10" y="165.0" width="480" height="165.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="18" y="210.2" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">CVIT key (per scanner)</text><text xml:space="preserve" x="18" y="228.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Default: image repository + vulnerability + image</text><text xml:space="preserve" x="18" y="245.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Optional: registry, cluster, namespace, service</text><text xml:space="preserve" x="18" y="262.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Context from Scanner Information or ServiceNow Discovery</text><text xml:space="preserve" x="18" y="279.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">(Discovery removed for new customers in 30.8.5 / 2.20.3)</text><text xml:space="preserve" x="18" y="296.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">Wiz keys freeze once container data exists</text><rect x="510" y="165.0" width="480" height="165.0" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="518" y="202.1" font-size="15.5" font-weight="700" fill="#2e7d32" text-anchor="start">What closes a CVIT (never manual)</text><text xml:space="preserve" x="518" y="219.8" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">• Scanner fixed data</text><text xml:space="preserve" x="518" y="236.7" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">• Base auto-close: 90 days unreported → Stale; mixed Closed +</text><text xml:space="preserve" x="518" y="253.7" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">   Stale → Fixed</text><text xml:space="preserve" x="518" y="270.6" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">• A newer image version deployed at runtime</text><text xml:space="preserve" x="518" y="287.5" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">• Job cancels CVITs with no Docker image</text><text xml:space="preserve" x="518" y="304.4" font-size="13.0" font-weight="400" fill="#16212e" text-anchor="start">• Exceptions, false positives, auto-exception rules</text><rect x="10" y="347.6" width="980" height="70.4" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="370.5" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Anchored on the source image, not running containers</text><text xml:space="preserve" x="500.0" y="388.8" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">Runtime context (hosts, clusters, namespaces, services) enriches findings. Business criticality comes from services mapped to the</text><text xml:space="preserve" x="500.0" y="406.5" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">image, so it needs ITOM service mapping.</text></svg>
