<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 360" width="1000" height="360" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="360" rx="10" fill="#ffffff"/><rect x="10" y="10.0" width="980" height="46.0" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="28.6" font-size="14.5" font-weight="400" fill="#7a1b14" text-anchor="middle">ServiceNow: if you do not intend to move to USEM, install a version below v30.x of VR, CC, CVR and the scanner</text><text xml:space="preserve" x="500.0" y="47.5" font-size="14.5" font-weight="400" fill="#7a1b14" text-anchor="middle">integrations.</text><rect x="10" y="72.0" width="480" height="210.0" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="18" y="126.8" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="start">Classic track (below v30)</text><text xml:space="preserve" x="18" y="145.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• VR, CC, CVR classic versions</text><text xml:space="preserve" x="18" y="164.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• CVR 2.20.3 (Sep 2026)</text><text xml:space="preserve" x="18" y="182.8" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Wiz 4.2.4 (Sep 2026)</text><text xml:space="preserve" x="18" y="201.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Tenable 6.2.3 (Sep 2026)</text><text xml:space="preserve" x="18" y="219.9" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Per-module rule tables</text><text xml:space="preserve" x="18" y="238.4" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• No SSVC, Early Warning or integration-health dashboards</text><rect x="510" y="72.0" width="480" height="210.0" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="518" y="117.5" font-size="15.5" font-weight="700" fill="#2e7d32" text-anchor="start">USEM track (v30 and later)</text><text xml:space="preserve" x="518" y="136.5" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Install sn_vul_usem_common first</text><text xml:space="preserve" x="518" y="155.0" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• CVR 30.8.5 (Sep 2026)</text><text xml:space="preserve" x="518" y="173.5" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Wiz 32.8.4 (Sep 2026)</text><text xml:space="preserve" x="518" y="192.1" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Tenable 30.5.3 (Sep 2026)</text><text xml:space="preserve" x="518" y="210.6" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Shared sn_sec_* rule tables; one rule can target VITs,</text><text xml:space="preserve" x="518" y="229.1" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">   AVITs, CVITs and CC results</text><text xml:space="preserve" x="518" y="247.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="start">• Finding tables keep their classic names</text><line x1="490" y1="177.0" x2="510" y2="177.0" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#an)"/><rect x="10" y="296.0" width="980" height="52.0" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="317.7" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">Move with the Migration assistant: rehearse in non-production, upgrade apps in the displayed order, then &quot;Enable all&quot;. The</text><text xml:space="preserve" x="500.0" y="336.3" font-size="14.3" font-weight="400" fill="#16212e" text-anchor="middle">move cannot be rolled back.</text></svg>
