iddle">scheduled; chains on</text><rect x="590" y="22.0" width="230" height="132.0" rx="7" fill="#e8f0f9" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="705.0" y="66.8" font-size="15.5" font-weight="700" fill="#0b7a75" text-anchor="middle">Open Compliance Results</text><text xml:space="preserve" x="705.0" y="85.1" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">FAILED, WARNING, ERROR,</text><text xml:space="preserve" x="705.0" y="102.8" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">UNKNOWN</text><text xml:space="preserve" x="705.0" y="120.6" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">skipped if Fixed fails</text><rect x="860" y="22.0" width="130" height="132.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="925.0" y="84.6" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">CC results</text><text xml:space="preserve" x="925.0" y="102.8" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">sn_vulc_result</text><line x1="260" y1="88.0" x2="310" y2="88.0" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><line x1="540" y1="88.0" x2="590" y2="88.0" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><line x1="820" y1="88.0" x2="860" y2="88.0" stroke="#1f4e79" stroke-width="2" marker-end="url(#an)"/><rect x="310" y="176.0" width="510" height="77.0" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="565.0" y="202.5" font-size="15.5" font-weight="700" fill="#b86e00" text-anchor="middle">Unmatched asset?</text><text xml:space="preserve" x="565.0" y="220.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Result ignored; asset ID parked in sn_vul_tenable_missing_asset.</text><text xml:space="preserve" x="565.0" y="238.0" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Compliance Results Backfill reconciles up to 200 per run.</text><line x1="705" y1="154.0" x2="705" y2="176.0" stroke="#b86e00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aa)"/><rect x="10" y="275.0" width="980" height="121.00000000000001" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="314.3" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="middle">Test key: choose once, before the first import</text><text xml:space="preserve" x="500.0" y="332.6" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">compliance_control_id (new-install default): groups results under one CIS / DISA recommendation; audit-stable. Recommended.</text><text xml:space="preserve" x="500.0" y="350.3" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">check_id (upgrade default): tests sharing an ID overwrote each other. compliance_functional_id: changes whenever Tenable edits the</text><text xml:space="preserve" x="500.0" y="368.1" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">check logic.</text></svg>
