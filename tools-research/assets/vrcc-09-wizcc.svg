" y1="143.0" x2="740" y2="99.00000000000001" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#an)"/><rect x="740" y="165.0" width="250" height="121.00000000000001" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="865.0" y="196.8" font-size="15.5" font-weight="700" fill="#7d8da1" text-anchor="middle">Rejected in Wiz</text><text xml:space="preserve" x="865.0" y="214.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Fetch rejected: imported, stays</text><text xml:space="preserve" x="865.0" y="231.6" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">failed, not rolled up</text><text xml:space="preserve" x="865.0" y="248.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">Close rejected: imported and</text><text xml:space="preserve" x="865.0" y="265.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="middle">closed</text><rect x="10" y="297.0" width="690" height="110.00000000000001" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text xml:space="preserve" x="355.0" y="331.3" font-size="15.5" font-weight="700" fill="#b3261e" text-anchor="middle">AI posture routing is a one-way switch</text><text xml:space="preserve" x="355.0" y="349.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">With sn_sec_ai active, a checkbox sends Wiz AI-resource posture findings to AI Security</text><text xml:space="preserve" x="355.0" y="366.8" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Exposure Management. Only 5 of 14 AI types map (agent, dataset, model, tool, MCP server).</text><text xml:space="preserve" x="355.0" y="384.2" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">Once saved it cannot be turned off.</text><rect x="740" y="308.0" width="250" height="99.00000000000001" rx="7" fill="#f3f5f8" stroke="#7d8da1" stroke-width="1.4"/><text xml:space="preserve" x="865.0" y="345.2" font-si