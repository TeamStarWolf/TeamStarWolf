<svg viewBox="0 0 1000 462" width="1000" height="462" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="462" rx="10" fill="#ffffff"/><text x="10" y="24.200000000000003" font-size="14" font-weight="700" fill="#0b7a75" text-anchor="start">Tenable Cloud Security</text><rect x="10" y="35.2" width="300" height="88.0" rx="7" fill="#e8f0f9" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="160.0" y="75.7" font-size="14.9" font-weight="700" fill="#0b7a75" text-anchor="middle">Cloud Container Assets</text><text xml:space="preserve" x="160.0" y="93.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">images, Docker images, repositories</text><line x1="310" y1="79.2" x2="340" y2="79.2" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><rect x="340" y="35.2" width="300" height="88.0" rx="7" fill="#e8f0f9" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="490.0" y="75.7" font-size="14.9" font-weight="700" fill="#0b7a75" text-anchor="middle">Open Cloud Container Vulns</text><text xml:space="preserve" x="490.0" y="93.6" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">new / reopened CVITs, findings, TPEs</text><line x1="640" y1="79.2" x2="670" y2="79.2" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)"/><rect x="670" y="35.2" width="300" height="88.0" rx="7" fill="#e8f0f9" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="820.0" y="67.0" font-size="14.9" font-weight="700" fill="#0b7a75" text-anchor="middle">Fixed Cloud Container Vulns</text><text xml:space="preserve" x="820.0" y="84.9" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">findings in closed state: explicit fix</text><text xml:space="preserve" x="820.0" y="102.3" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">signal</text><text x="10" y="154.0" font-size="14" font-weight="700" fill="#5b3fd1" text-anchor="start">Wiz (32.8.4 / 4.2.4, on by default)</text><rect x="10" y="165.0" width="300" height="88.0" rx="7" fill="#e8f0f9" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="160.0" y="205.5" font-size="14.9" font-weight="700" fill="#5b3fd1" text-anchor="middle">Container Grouped Vulnerability</text><text xml:space="preserve" x="160.0" y="223.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">source IDs of active images</text><line x1="310" y1="209.00000000000003" x2="340" y2="209.00000000000003" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)"/><rect x="340" y="165.0" width="300" height="88.0" rx="7" fill="#e8f0f9" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="490.0" y="205.5" font-size="14.9" font-weight="700" fill="#5b3fd1" text-anchor="middle">Container Deployment Context</text><text xml:space="preserve" x="490.0" y="223.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">image → cluster, namespace, service</text><line x1="640" y1="209.00000000000003" x2="670" y2="209.00000000000003" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)"/><rect x="670" y="165.0" width="300" height="88.0" rx="7" fill="#e8f0f9" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="820.0" y="205.5" font-size="14.9" font-weight="700" fill="#5b3fd1" text-anchor="middle">Container Vulnerability</text><text xml:space="preserve" x="820.0" y="223.4" font-size="13.4" font-weight="400" fill="#16212e" text-anchor="middle">CVITs for every deployment</text><rect x="10" y="275.0" width="480" height="154.0" rx="7" fill="#e0f2ef" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="18" y="323.3" font-size="15.5" font-weight="700" fill="#0b7a75" text-anchor="start">Tenable.cs specifics</text><text xml:space="preserve" x="18" y="341.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Image digest → image_id and image_digest, used for CI lookup</text><text xml:space="preserve" x="18" y="358.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• u_resolved drives finding status and CVIT state</text><text xml:space="preserve" x="18" y="375.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Critical + High only by default</text><text xml:space="preserve" x="18" y="392.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Token permissions undocumented (vendor page end-of-support)</text><rect x="510" y="275.0" width="480" height="154.0" rx="7" fill="#efeafd" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="518" y="306.2" font-size="15.5" font-weight="700" fill="#5b3fd1" text-anchor="start">Wiz specifics</text><text xml:space="preserve" x="518" y="324.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Old Container Vulnerability alone capped CVITs at 16 clusters</text><text xml:space="preserve" x="518" y="341.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   per image</text><text xml:space="preserve" x="518" y="358.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• 32.0.3 added path to uniqueness; irrelevant findings</text><text xml:space="preserve" x="518" y="375.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   bulk-closed as invalid</text><text xml:space="preserve" x="518" y="392.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Fix status and Validated in Runtime roll up to CVITs</text><text xml:space="preserve" x="518" y="409.4" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Gate: sn_vul_wiz.deployment_context_gate_writes</text></svg>
