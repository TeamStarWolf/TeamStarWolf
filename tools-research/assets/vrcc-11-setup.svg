<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 440" width="1000" height="440" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="440" rx="10" fill="#ffffff"/><rect x="10" y="22.0" width="310" height="297.0" rx="7" fill="#e0f2ef" stroke="#0b7a75" stroke-width="1.4"/><text xml:space="preserve" x="18" y="90.5" font-size="15.5" font-weight="700" fill="#0b7a75" text-anchor="start">Tenable side</text><text xml:space="preserve" x="18" y="108.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• VM: API access + secret keys; Basic</text><text xml:space="preserve" x="18" y="125.4" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   [16] user from app v3.8, Can View on</text><text xml:space="preserve" x="18" y="142.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   assets</text><text xml:space="preserve" x="18" y="159.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• SC: API keys (5.13+, admin enables</text><text xml:space="preserve" x="18" y="176.6" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   &quot;Allow API Keys&quot;); Security Analyst or</text><text xml:space="preserve" x="18" y="193.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   Manager</text><text xml:space="preserve" x="18" y="210.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Cloud Security: API token</text><text xml:space="preserve" x="18" y="227.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   (permissions undocumented)</text><text xml:space="preserve" x="18" y="245.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Limit: 10 concurrent exports per</text><text xml:space="preserve" x="18" y="262.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   container; HTTP 429 with retry-after</text><rect x="345" y="22.0" width="310" height="297.0" rx="7" fill="#e8f0f9" stroke="#1f4e79" stroke-width="1.4"/><text xml:space="preserve" x="353" y="99.0" font-size="15.5" font-weight="700" fill="#1f4e79" text-anchor="start">ServiceNow side</text><text xml:space="preserve" x="353" y="116.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• VR with NVD and CWE loaded first (Wiz</text><text xml:space="preserve" x="353" y="133.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   also needs CISA)</text><text xml:space="preserve" x="353" y="151.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• IntegrationHub; CC 12.2+ for Tenable</text><text xml:space="preserve" x="353" y="168.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   compliance</text><text xml:space="preserve" x="353" y="185.2" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• CVR and CC apps (Wiz prerequisites)</text><text xml:space="preserve" x="353" y="202.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Roles: sn_vul.vulnerability_admin,</text><text xml:space="preserve" x="353" y="219.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   sn_vulc.admin, app configure roles</text><text xml:space="preserve" x="353" y="236.4" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Shared import framework: 10</text><text xml:space="preserve" x="353" y="253.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   import-template jobs; stagger chains</text><rect x="680" y="22.0" width="310" height="297.0" rx="7" fill="#efeafd" stroke="#5b3fd1" stroke-width="1.4"/><text xml:space="preserve" x="688" y="90.5" font-size="15.5" font-weight="700" fill="#5b3fd1" text-anchor="start">Wiz side</text><text xml:space="preserve" x="688" y="108.3" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Service account: Client ID + Secret,</text><text xml:space="preserve" x="688" y="125.4" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   Auth URL, API URL</text><text xml:space="preserve" x="688" y="142.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Host: read:vulnerabilities,</text><text xml:space="preserve" x="688" y="159.5" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   read:host_configuration</text><text xml:space="preserve" x="688" y="176.6" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Asset: read:resources</text><text xml:space="preserve" x="688" y="193.7" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• Container: read:cloud_configuration</text><text xml:space="preserve" x="688" y="210.8" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• CC + Issues: read:issues,</text><text xml:space="preserve" x="688" y="227.9" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   read:threat_issues</text><text xml:space="preserve" x="688" y="245.0" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">• CMDB connector: read:resources,</text><text xml:space="preserve" x="688" y="262.1" font-size="13.1" font-weight="400" fill="#16212e" text-anchor="start">   read:projects (separate account)</text><line x1="320" y1="165.0" x2="345" y2="165.0" stroke="#0b7a75" stroke-width="2" marker-end="url(#at)" marker-start="url(#st)"/><line x1="655" y1="165.0" x2="680" y2="165.0" stroke="#5b3fd1" stroke-width="2" marker-end="url(#av)" marker-start="url(#sv)"/><rect x="10" y="336.6" width="980" height="70.4" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="359.5" font-size="15.5" font-weight="700" fill="#2e7d32" text-anchor="middle">Least privilege</text><text xml:space="preserve" x="500.0" y="377.8" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">One service identity per integration purpose, scoped to the projects and assets it needs, with only the scopes of the integrations</text><text xml:space="preserve" x="500.0" y="395.5" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">actually activated.</text></svg>
