<svg viewBox="0 0 1000 363" width="1000" height="363" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,Arial,sans-serif"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="sk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a75"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker></defs><rect x="0" y="0" width="1000" height="363" rx="10" fill="#ffffff"/><rect x="10" y="11.0" width="980" height="48.400000000000006" rx="7" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text xml:space="preserve" x="500.0" y="30.6" font-size="15.5" font-weight="400" fill="#7a1b14" text-anchor="middle">Four choices are expensive or impossible to reverse. Settle them in a design review before the first production</text><text xml:space="preserve" x="500.0" y="50.7" font-size="15.5" font-weight="400" fill="#7a1b14" text-anchor="middle">import.</text><rect x="10" y="77.0" width="235" height="121.00000000000001" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="127.5" y="125.4" font-size="16.1" font-weight="700" fill="#b86e00" text-anchor="middle">VI port option</text><text xml:space="preserve" x="127.5" y="143.9" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">Cannot be turned off without</text><text xml:space="preserve" x="127.5" y="161.6" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">deleting all VR data</text><rect x="10" y="209.00000000000003" width="235" height="121.00000000000001" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="127.5" y="265.3" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">Recommended: CI +</text><text xml:space="preserve" x="127.5" y="283.4" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">vulnerability, no port</text><line x1="127.5" y1="198.00000000000003" x2="127.5" y2="209.00000000000003" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ak)"/><rect x="258" y="77.0" width="235" height="121.00000000000001" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="375.5" y="125.4" font-size="16.1" font-weight="700" fill="#b86e00" text-anchor="middle">Wiz detection key</text><text xml:space="preserve" x="375.5" y="143.9" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">Changing it needs a full</text><text xml:space="preserve" x="375.5" y="161.6" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">import</text><rect x="258" y="209.00000000000003" width="235" height="121.00000000000001" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="375.5" y="265.3" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">Recommended: Wiz finding UUID</text><text xml:space="preserve" x="375.5" y="283.4" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">for new deployments</text><line x1="375.5" y1="198.00000000000003" x2="375.5" y2="209.00000000000003" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ak)"/><rect x="506" y="77.0" width="235" height="121.00000000000001" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="623.5" y="125.4" font-size="16.1" font-weight="700" fill="#b86e00" text-anchor="middle">Wiz CVIT key</text><text xml:space="preserve" x="623.5" y="143.9" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">Frozen once container data</text><text xml:space="preserve" x="623.5" y="161.6" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">exists</text><rect x="506" y="209.00000000000003" width="235" height="121.00000000000001" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="623.5" y="256.3" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">Recommended: add cluster or</text><text xml:space="preserve" x="623.5" y="274.4" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">namespace only where they map</text><text xml:space="preserve" x="623.5" y="292.4" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">1:1 to owning teams</text><line x1="623.5" y1="198.00000000000003" x2="623.5" y2="209.00000000000003" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ak)"/><rect x="754" y="77.0" width="235" height="121.00000000000001" rx="7" fill="#fff3df" stroke="#b86e00" stroke-width="1.4"/><text xml:space="preserve" x="871.5" y="125.4" font-size="16.1" font-weight="700" fill="#b86e00" text-anchor="middle">Tenable CC test key</text><text xml:space="preserve" x="871.5" y="143.9" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">Changes how later runs match</text><text xml:space="preserve" x="871.5" y="161.6" font-size="13.6" font-weight="400" fill="#16212e" text-anchor="middle">records</text><rect x="754" y="209.00000000000003" width="235" height="121.00000000000001" rx="7" fill="#e7f4ea" stroke="#2e7d32" stroke-width="1.4"/><text xml:space="preserve" x="871.5" y="265.3" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">Recommended:</text><text xml:space="preserve" x="871.5" y="283.4" font-size="13.9" font-weight="400" fill="#16212e" text-anchor="middle">compliance_control_id</text><line x1="871.5" y1="198.00000000000003" x2="871.5" y2="209.00000000000003" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#ak)"/></svg>
